# kagent 0.10.3 — controller, UI and a bundled PostgreSQL, nothing else.
# A time-boxed trial (spike kanr): 1.0 rewrites the runtime on Agent
# Substrate and needs k8s ≥ 1.37, so this install's exit is `git rm` of
# this directory, not an upgrade.
#
# Trimmed from the chart defaults:
#   - ten bundled agents (k8s, istio, helm, cilium …) off — each is a
#     Deployment with 50m/128Mi requests and cluster RBAC we did not ask
#     for. Agents are declared next to this file instead.
#   - kagent-tools (the built-in k8s/helm/argo MCP server) and kmcp off
#     for the first step; a chat agent on OpenRouter needs neither. Turn
#     kagent-tools on when an agent should read the cluster, and read
#     its ClusterRole first.
#   - providers: null — the chart would otherwise create a default
#     ModelConfig plus an EMPTY Secret for OpenAI; modelconfig.yaml and
#     sealed-secret.yaml own that here.
#   - auth.mode unsecure: the UI trusts X-User-Id or defaults to one
#     admin user. The wallet gate on ingress.yaml is the auth boundary,
#     exactly as for SillyTavern. trusted-proxy (JWT from oauth2-proxy)
#     is a follow-up once siwe-oidc's claims are checked against it.
#
# Postgres: the bundled instance is "demo only" upstream (hardcoded
# kagent/kagent credentials, in-cluster Service only). Its PVC goes on
# the default longhorn class (ADR-0029): sessions and chat history are
# data-plane state, same tier as SillyTavern's.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent
    targetRevision: 0.10.3
    helm:
      valuesObject:
        providers: null
        kmcp:
          enabled: false
        kagent-tools:
          enabled: false
        k8s-agent: { enabled: false }
        kgateway-agent: { enabled: false }
        istio-agent: { enabled: false }
        promql-agent: { enabled: false }
        observability-agent: { enabled: false }
        argo-rollouts-agent: { enabled: false }
        helm-agent: { enabled: false }
        cilium-policy-agent: { enabled: false }
        cilium-manager-agent: { enabled: false }
        cilium-debug-agent: { enabled: false }
        controller:
          replicas: 1
          auth:
            mode: unsecure
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
        ui:
          replicas: 1
          # OpenShift-only Route; a no-op here, off for clarity.
          route:
            enabled: false
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 768Mi }
        database:
          postgres:
            bundled:
              enabled: true
              storageClassName: longhorn
              size: 2Gi
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
