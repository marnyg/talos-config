# kagent CRDs (Agent, ModelConfig, MCPServer, RemoteMCPServer, …), as a
# separate chart per upstream's install order. Pinned EXACTLY, like
# Longhorn: 1.0 replaces the CRD group and has no in-place upgrade, so
# drifting to "0.*" or "1.*" unattended is not a thing to do.
#
# Sync-wave -1 so the CRDs exist before the raw ModelConfig/Agent CRs
# next to this file are applied; the root app's
# SkipDryRunOnMissingResource covers the first-sync window anyway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent-crds
    targetRevision: 0.10.3
    helm:
      valuesObject:
        # kmcp's CRDs come with this chart when enabled; the main chart
        # has kmcp off (application.yaml), so keep both sides in step.
        kmcp:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
