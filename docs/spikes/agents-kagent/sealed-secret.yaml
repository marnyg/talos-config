# The OpenRouter key for agents in `ai`. A data-plane credential (it
# authorises spend against a vendor, not a user): invariant 1 is not in
# play, invariant 8 is — the plaintext exists only in the pod's env.
# Create the key with a spend limit at OpenRouter; nothing in-cluster
# meters it (protocol budget caveats are M5, `0bc.5`).
#
# PLACEHOLDER is not ciphertext. Replace with `kubeseal --format yaml`
# output for a Secret named `openrouter` in `ai` (README.md).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openrouter
  namespace: ai
spec:
  encryptedData:
    OPENROUTER_API_KEY: PLACEHOLDER
  template:
    metadata:
      name: openrouter
      namespace: ai
