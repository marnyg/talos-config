# One declarative agent, no tools: the smallest thing that proves the
# chain UI → controller → agent pod → OpenRouter end to end. kagent
# renders it as a Deployment (+ Service, ServiceAccount) in `ai`.
#
# securityContext/podSecurityContext are set here because whether the
# rendered pod passes PodSecurity `restricted` on its own is unverified
# (spike memo, open questions). Mirrors k8s/apps/sillytavern.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: scout
  namespace: ai
spec:
  type: Declarative
  description: Trial agent on OpenRouter; chat only, no tools.
  declarative:
    runtime: python
    modelConfig: openrouter
    stream: true
    systemMessage: |
      You are scout, a terse assistant running as a pod on the owner's
      home Kubernetes cluster. You have no tools. Answer briefly; say so
      when a question needs cluster access you do not have.
    deployment:
      replicas: 1
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 384Mi }
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
