# Gated behind the wallet like SillyTavern (k8s/apps/sillytavern/
# ingress.yaml): kagent's controller runs in `unsecure` auth mode, so
# this annotation pair is what keeps "every exposed service
# authenticates against the wallet" true. Reachable only through the
# gateway on the mesh (invariant 5): no new public surface.
#
# The UI proxies /api and WebSockets to the controller itself
# (ui.publicBackendUrl: /api), so one host + one backend suffices.
# Agent replies stream over SSE; nginx's 60 s read timeout would cut
# long turns, hence the proxy-read-timeout.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kagent
  namespace: ai
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.sso.svc.cluster.local/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: http://oauth2.gw.mesh.internal/oauth2/start?rd=$scheme://$host$request_uri
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: kagent.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kagent-ui
                port:
                  number: 8080
