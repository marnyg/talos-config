# Hostname routing over the mesh: <service>.cp1.mesh.internal resolves
# to cp1 (hub DNS resolves any name scoped under a member — nothing to
# declare), ingress-nginx on hostNetwork :80 routes by Host header.
# Exposing a service = adding an Ingress here, nothing else.
# Plain HTTP — nebula encrypts the wire; HTTPS lands with the
# wallet-derived CA (deferred, refs 162c630d).
#
# The auth-url/auth-signin annotations gate a service behind the wallet
# (oauth2-proxy in the sso namespace → SIWE→OIDC bridge): nginx makes an
# auth_request subrequest per request; 401s bounce the browser through
# one wallet signature, and the session cookie (domain
# .cp1.mesh.internal) then opens every gated service. Jellyfin is
# deliberately ungated here: it gets native OIDC via jellyfin-plugin-sso
# (refs 162c630d), and the TV reaches it LAN-direct on NodePort 30096
# outside the ingress path anyway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
spec:
  ingressClassName: nginx
  rules:
    - host: jellyfin.cp1.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.sso.svc.cluster.local/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: http://oauth2.cp1.mesh.internal/oauth2/start?rd=$scheme://$host$request_uri
spec:
  ingressClassName: nginx
  rules:
    - host: sonarr.cp1.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  number: 8989
