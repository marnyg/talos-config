# Hostname routing over the mesh: <service>.cp1.mesh.internal resolves
# to cp1 (hub DNS resolves any name scoped under a member — nothing to
# declare), ingress-nginx on hostNetwork :80 routes by Host header.
# Exposing a service = adding an Ingress here, nothing else.
# Plain HTTP — nebula encrypts the wire; HTTPS lands with the
# wallet-derived CA (deferred, refs 162c630d).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
spec:
  ingressClassName: nginx
  rules:
    - host: jellyfin.cp1.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
