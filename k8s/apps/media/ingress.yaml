# Hostname routing over the identity plane (Mesh v3 P2.3):
# <service>.gw.mesh.internal resolves on the caller's device to the
# in-cluster gateway pod (k8s/apps/gateway), which terminates the
# identity stream and forwards to ingress-nginx with Host intact; nginx
# routes by Host header. Exposing a service = adding an Ingress here,
# nothing else. Plain HTTP — the identity stream encrypts the wire;
# browser TLS, if an app ever forces it, is a device-local matter
# (ADR-0033; no mesh CA).
#
# The group gate (ADR-0032) is the controller's global-auth-url
# (k8s/apps/ingress-nginx), so every Ingress has it unless it opts out
# with enable-global-auth: "false" (as Jellyfin and Seerr do below) or
# names another group with its own auth-url: nginx makes an
# auth_request subrequest per request to the bridge's /authz, carrying
# the X-Mesh-Token the gateway signed for this request; the bridge
# verifies it against the gateway id pinned in git and answers 200 iff
# the device's member cert holds the named group. No login, no cookie:
# an admin device opens the service as it is; a device outside the
# group gets 403, a caller with no token (anything off the gateway
# path, e.g. a pod) gets 401 — there is nothing to sign in as, so no
# auth-signin. Jellyfin is deliberately ungated here: it keeps per-user
# state and gets the person gate, native OIDC via jellyfin-plugin-sso
# (refs 162c630d). Its nebula name jellyfin.cp1 was cut once the TV ran
# the v3 APK (359.9.4.5, vftt; decision d3z3) — every device now reaches
# it as jellyfin.gw through this ingress (the gateway's raw :8096 facet
# was retired 2026-10-06, ADR-0034). The backend is the pod's qc front
# proxy (:8097, config-server/jellyfinqc), which reads the same
# X-Mesh-Token to log a `media` device in by Quick Connect as its own
# user — the appliances' login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/enable-global-auth: "false"
    # Dashboard tile (k8s/apps/homepage/config.yaml explains).
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Jellyfin
    gethomepage.dev/group: Media
    gethomepage.dev/icon: jellyfin.png
    gethomepage.dev/description: movies, shows, music
    gethomepage.dev/pod-selector: app=jellyfin
    gethomepage.dev/weight: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: jellyfin.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8097
