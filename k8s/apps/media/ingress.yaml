# Jackett was the first service migrated to the identity plane (Mesh v3
# P2.3, talos-config-359.9.3); the caller's device identity arrives
# verified in X-Mesh-* and, signed, in X-Mesh-Token — the latter is
# what the group gate decides on. Its nebula name jackett.cp1 is cut
# (decision d3z3: a migrated consumer loses its nebula path).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jackett
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://siwe-oidc.sso.svc.cluster.local/authz?group=admins
spec:
  ingressClassName: nginx
  rules:
    - host: jackett.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jackett
                port:
                  number: 9117
---
# Seerr is ungated like Jellyfin, not like the *arr apps: its users are
# household members signing in with their Jellyfin account (seerr
# authenticates against jellyfin server-side), who have no wallet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr
  namespace: media
spec:
  ingressClassName: nginx
  rules:
    - host: seerr.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seerr
                port:
                  number: 5055
