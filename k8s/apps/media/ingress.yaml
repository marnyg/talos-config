# Seerr is ungated like Jellyfin, not like the *arr apps: its users are
# household members signing in with their Jellyfin account (seerr
# authenticates against jellyfin server-side), who have no wallet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/enable-global-auth: "false"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Seerr
    gethomepage.dev/group: Media
    gethomepage.dev/icon: jellyseerr.png
    gethomepage.dev/description: requests
    gethomepage.dev/pod-selector: app=seerr
    gethomepage.dev/weight: "20"
spec:
