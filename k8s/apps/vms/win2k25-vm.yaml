# Windows Server 2025 guest. Deliberately boring device choices for the
# install path — the goal is "RDP works", not peak I/O:
#
#   - system disk on SATA, NIC as e1000e: Windows setup sees both with
#     inbox drivers, zero "Load driver" fumbling over VNC. The virtio
#     switch (viostor/NetKVM from the attached driver CD) is a later,
#     deliberate perf step.
#   - EFI without SecureBoot (SecureBoot needs SMM; nothing here needs
#     attestation theater on an eval guest).
#   - runStrategy Always: with ArgoCD selfHeal, `virtctl stop/start`
#     would be reverted by the next sync — start/stop is a git edit of
#     this field (Always ↔ Halted), consistent with git-is-truth.
#
# Sizing (2026-10-19, on w2): 8 cores / 24Gi of w2's 12 threads / 48Gi
# — the node exists for this VM and the GPU it holds, and the rest is
# left for Longhorn and whatever AI pods take the GPU when the VM is
# Halted (dsuj). Guest memory is not reclaimable; was 4 / 8Gi on cp1
# (16 vCPU / 28Gi beside etcd and the media stack).
#
# The transfer share (k8s/apps/files, \\samba.files.svc.cluster.local\transfer)
# is mapped as T: by the answer file's FirstLogonCommands (cmdkey +
# net use /persistent:yes, Administrator's Credential Manager) — a
# reinstall comes up with it; the first install got the same two
# commands by hand through the guest agent.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win2k25
  namespace: vms
  annotations:
    # Wave 2: start only after the no-prompt repack Job (wave 1) is
    # Complete. A blank disk + empty CD boots to the EFI shell and
    # sits there — the VM must be last in the cold-start chain.
    argocd.argoproj.io/sync-wave: "2"
spec:
  runStrategy: Always
  dataVolumeTemplates:
    # Blank system disk. Filesystem mode (disk.img on Longhorn's xfs),
    # not Block: CDI's importer runs non-root and cannot open the raw
    # device on a Block-mode Longhorn volume — it crash-looped with
    # `blockdev: cannot open /dev/cdi-block-volume: Permission denied`
    # (2026-08-11). The double-filesystem overhead is irrelevant behind
    # SATA emulation; revisit Block only alongside the virtio switch.
    # Created degraded (1 of 2 replicas) while w1 is down; heals when
    # it returns. Lifecycle is tied to the VM: deleting the VM deletes
    # the Windows install, but never the ISO (separate DataVolume).
    - metadata:
        name: win2k25-system
      spec:
        source:
          blank: {}
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn
          resources:
            requests:
              storage: 80Gi
  template:
    metadata:
      labels:
        vm.kubevirt.io/name: win2k25
    spec:
      domain:
        cpu:
          cores: 8
        memory:
          guest: 24Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        clock:
          utc: {}
          timer:
            hpet:
              present: false
            pit:
              tickPolicy: delay
            rtc:
              tickPolicy: catchup
            hyperv: {}
        features:
          acpi: {}
          apic: {}
          hyperv:
            relaxed: {}
            vapic: {}
            spinlocks:
              spinlocks: 8191
        devices:
          inputs:
            # USB tablet = absolute pointer coordinates; without it the
            # VNC mouse drifts hopelessly during Windows setup.
            - type: tablet
              bus: usb
              name: tablet
          disks:
            - name: system
              bootOrder: 1
              disk:
                bus: sata
            - name: iso
              bootOrder: 2
              cdrom:
                bus: sata
            - name: virtio-drivers
              cdrom:
                bus: sata
            - name: sysprep
              cdrom:
                bus: sata
          interfaces:
            - name: default
              masquerade: {}
              model: e1000e
          # w2's RTX 3070 (spike dsuj, 2026-10-19): the two functions of
          # one IOMMU group, advertised by KubeVirt as extended
          # resources (k8s/apps/kubevirt/kubevirt-cr.yaml) once the
          # node's hardware layer has them on vfio-pci. Claiming them
          # pins the VM to w2 — it can no longer run on cp1/w1 — and
          # a spec change here needs a VMI restart (not live). The
          # guest sees a bare PCI device until the NVIDIA driver is
          # installed inside Windows; EFI firmware (above) is what the
          # card's option ROM expects.
          hostDevices:
            - name: gpu
              deviceName: nvidia.com/GA104_GEFORCE_RTX_3070
            - name: gpu-audio
              deviceName: nvidia.com/GA104_HD_AUDIO
      networks:
        - name: default
          pod: {}
      volumes:
        - name: system
          dataVolume:
            name: win2k25-system
        # The no-prompt repack (win2k25-iso-noprompt.yaml), not the raw
        # CDI import — its EFI loader boots straight into setup, which is
        # what makes unattended reinstalls a pure API act. Empty until
        # the repack Job has run once; harmless, the installed system
        # boots from the system disk anyway.
        - name: iso
          persistentVolumeClaim:
            claimName: win2k25-iso-noprompt
        # virtio-win drivers ISO, shipped by the KubeVirt project as a
        # container image — no CDI import needed. For the post-install
        # virtio switch and the qemu guest agent.
        - name: virtio-drivers
          containerDisk:
            image: quay.io/kubevirt/virtio-container-disk:v1.9.0
        # autounattend.xml on a vfat CD (win2k25-autounattend.yaml).
        # Only Windows *setup* reads it — inert once the guest is
        # installed. Reinstall-from-scratch: fire the suspended CronJob
        # (win2k25-reinstall-trigger.yaml) or run
        # scripts/win2k25-reinstall.sh; zero interaction either way.
        - name: sysprep
          sysprep:
            secret:
              # LocalObjectReference — the field is `name`, NOT `secretName`
              # (that spelling silently drops on apply and the launcher
              # pod fails validation with an empty secret ref; cost 20
              # minutes on 2026-08-12).
              name: win2k25-autounattend
