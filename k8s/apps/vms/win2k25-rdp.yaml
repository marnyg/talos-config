# RDP into the guest from admin devices, via the gateway's `rdp` facet
# (ADR-0017 amendment 2026-10-04): the gateway pod forwards the facet
# to this Service, the recipe grants it to `group: admins`, and the
# presentation reads <anything>.gw.mesh.internal:3389 as (gw, rdp):
#
#   xfreerdp /v:rdp.gw.mesh.internal /u:Administrator /dynamic-resolution
#
# ClusterIP, not NodePort: the v2 NodePort (30389 on every node)
# presumed nebula's "admins reach any node port"; a v3 node forwards
# only apid/kube-api, so it was unreachable from the mesh. Nothing
# public is exposed (invariant 5: the hub stays the only public
# surface). Out-of-band fallback with only the kube-api facet:
# `kubectl -n vms port-forward svc/win2k25-rdp 3389:3389`.
#
# Selector matches the virt-launcher pod's VM label, so the service
# follows the VM wherever it schedules.
apiVersion: v1
kind: Service
metadata:
  name: win2k25-rdp
  namespace: vms
spec:
  selector:
    vm.kubevirt.io/name: win2k25
  ports:
    - name: rdp
      protocol: TCP
      port: 3389
      targetPort: 3389
