# The win2k25 local Administrator credentials — the same password that
# is baked into the sealed answer file (win2k25-autounattend.yaml), kept
# here separately so retrieval is a kubectl call instead of a password
# manager (the jellyfin-admin pattern):
#   kubectl -n vms get secret win2k25-admin -o jsonpath='{.data.password}' | base64 -d
# If you rotate the password in the answer file, reseal BOTH secrets —
# nothing links them mechanically.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: win2k25-admin
  namespace: vms
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: win2k25-admin
      namespace: vms
