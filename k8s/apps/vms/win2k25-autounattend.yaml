# Unattended-install answer file for the win2k25 guest, exposed to the
# VM as a small vfat CD via KubeVirt's `sysprep` volume. Windows setup
# scans the root of every removable drive for autounattend.xml and, on
# finding this one, runs the whole install hands-free: partitioning,
# eval edition selection, EULA, admin password, RDP enabled (specialize
# pass: fDenyTSConnections=false + Remote Desktop firewall group), and
# virtio guest tools via FirstLogonCommands.
#
# Sealed because it carries the local Administrator password (plaintext
# inside the XML — invariant 8: plaintext only in memory/cluster, never
# in git). Regenerate: write a new autounattend.xml, then
#   kubectl create secret generic win2k25-autounattend -n vms \
#     --from-file=autounattend.xml=… --dry-run=client -o yaml \
#   | kubeseal --controller-name sealed-secrets-controller \
#              --controller-namespace kube-system -o yaml
# The reinstall flow that consumes this is scripts/win2k25-reinstall.sh.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: win2k25-autounattend
  namespace: vms
spec:
  encryptedData:
    autounattend.xml: 
  template:
    metadata:
      name: win2k25-autounattend
      namespace: vms
