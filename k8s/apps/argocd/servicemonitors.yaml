# ArgoCD's metrics for kube-prometheus-stack (k8s/apps/monitoring):
# sync status and health per Application, reconcile durations, repo
# fetch failures, API latency. The upstream install.yaml already ships
# the metrics Services (argocd-metrics :8082 for the application
# controller, argocd-server-metrics :8083, and a `metrics` port on
# repo-server / applicationset-controller / notifications-controller);
# these are only the monitors selecting them. Plain manifests under the
# root app, which skips the dry run on a missing CRD — so they sit as
# SyncFailed for the minutes before the Operator CRDs land and heal on
# the next loop.
#
# The hub watches gitops liveness over the kube API already (ADR-0027);
# this is the finer grain — which app, how long, why.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-application-controller
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-server
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server-metrics
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-applicationset-controller
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-applicationset-controller
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-notifications-controller
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-notifications-controller-metrics
  endpoints:
    - port: metrics
