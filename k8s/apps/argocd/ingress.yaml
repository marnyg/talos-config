# ArgoCD over the mesh (ADR-0009 pattern): plain HTTP, hostname
# routing; argocd-server runs with server.insecure=true (set in
# config.yaml alongside this file) so it serves
# HTTP instead of redirecting to its self-signed TLS. Sign-in is OIDC
# against the SIWE bridge — the wallet is the identity (sketch
# 162c630d); the local admin account remains as break-glass.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # Dashboard tile (k8s/apps/homepage/config.yaml explains); the
    # ingress name matches argocd-server's app.kubernetes.io/name, so
    # no pod-selector.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: ArgoCD
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: argo-cd.png
    gethomepage.dev/description: gitops — what the cluster runs
    gethomepage.dev/weight: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
