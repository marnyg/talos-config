# Guacamole's two secrets (talos-config-5is2, ADR-0045), sealed with
# the cluster's public cert (`talos/clusters/homelab/sealed-secrets.crt`):
#
#   json-secret-key  the 16-byte AES key the guacamole-auth-json
#                    extension verifies login blobs with. Held by BOTH
#                    containers of the pod: the webapp as
#                    JSON_SECRET_KEY, the guacjson sidecar as
#                    GUACJSON_SECRET_KEY. A transport secret between two
#                    containers, not an identity root — identity is the
#                    device cert the gateway signs into X-Mesh-Token.
#   guest-password   the guest's Administrator password, sidecar only;
#                    it rides inside each minted blob as the RDP
#                    `password` parameter. The mesh says which device
#                    may knock; Windows still decides who logs on —
#                    same shape as the raw `rdp` facet.
#
# There is no Guacamole login any more: user-mapping.xml went with
# ADR-0045 (the device IS the user). Reseal with bootstrap.md's recipe;
# env from a Secret needs a rollout, not a pod delete.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: guacamole-auth
  namespace: guacamole
spec:
  encryptedData:
    guest-password: 
    json-secret-key: 
  template:
    metadata:
      name: guacamole-auth
      namespace: guacamole
