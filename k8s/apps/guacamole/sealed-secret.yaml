# Guacamole's one-file auth + connection list: user-mapping.xml (the
# webapp's built-in basic auth provider, no database). Sealed with the
# cluster's public cert (`talos/clusters/homelab/sealed-secrets.crt`).
#
# Two things live in it, and both are the *second* gate:
#   - the Guacamole login the browser sees after the mesh gate let the
#     device in (a password here is ceremony, but it costs nothing);
#   - the guest's Administrator credentials, so guacd can open an RDP
#     session without a prompt. The mesh says which device may knock;
#     Windows still decides who logs on — same shape as the raw `rdp`
#     facet (talos/mesh-policy-v3.yaml's comment on that row).
#
# Sealed with the real guest credentials since 5c2b432 (2026-10-22).
# The Guacamole login's password is still the bootstrap placeholder
# string — it is the second gate behind a device gate, so this is
# ceremony; rotate by resealing. `bootstrap.md` beside this file has the
# two-command recipe (`kubeseal --cert … < secret.yaml >
# sealed-secret.yaml`), plus the gotcha that a subPath secret mount
# never refreshes — a re-sealed secret needs the pod recreated.
#
# Plaintext passwords are fine *here* only because the whole file is
# the sealed payload; nothing about this secret is unsealed in git.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: guacamole-user-mapping
  namespace: guacamole
spec:
  encryptedData:
    user-mapping.xml: 
  template:
    metadata:
      name: guacamole-user-mapping
      namespace: guacamole
