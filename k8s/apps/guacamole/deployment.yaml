# Apache Guacamole: RDP to the win2k25 guest from any browser on the
# mesh (talos-config-ey3a). Two pods, each with one job:
#
#   guacd      — the RDP *client*. FreeRDP dials the guest and re-encodes
#                its framebuffer into Guacamole's drawing protocol. It
#                dials the ClusterIP the VM already has
#                (k8s/apps/vms/win2k25-rdp.yaml), so the guest, that
#                Service and the raw `rdp` facet are untouched:
#                `xfreerdp /v:rdp.gw.mesh.internal` keeps working.
#   guacamole  — the web app: the connection list and the WebSocket
#                tunnel the browser drives. Tomcat + a WAR. No database
#                and no user list: the only authentication extension
#                is guacamole-auth-json (JSON_SECRET_KEY), which
#                accepts a signed+encrypted blob naming the user and
#                the connections, and nothing else.
#   guacjson   — the sidecar in front of the webapp (ADR-0045,
#                config-server/guacjson): the Service points here. It
#                forwards everything, and on the client's own
#                credential-less `POST api/tokens` it verifies the
#                gateway-signed X-Mesh-Token (same pinned gateway id
#                as siwe-oidc and jellyfinqc), requires `admins`, and
#                adds the blob: the device's name as the Guacamole
#                user, the one RDP connection with the guest password
#                from the sealed secret. So the device IS the login;
#                no form, nothing to brute-force (a request without a
#                valid token is forwarded untouched and the webapp has
#                nobody to authenticate it as).
#
# Why Guacamole and not the console: KubeVirt's VNC is the *console* —
# no audio, no clipboard, no dynamic resolution, and it fights any
# concurrent RDP session. This is a real RDP session, so the phone gets
# audio and a resize-to-viewport desktop, which is what "use the
# Windows VM without a client" has to mean. The price is guacd:
# software decode of the whole framebuffer, no GPU (the colour depth
# and visual-effect toggles in the connection parameters are about
# that, not about taste).
#
# Rootless upstream images: guacd is uid/gid 1000 (`guacd`), the webapp
# 1001 (`guacamole`), both from the upstream Dockerfiles. The UIDs are
# pinned explicitly — kubelet cannot verify `runAsNonRoot` against a
# non-numeric image USER, and a wrong UID means the entrypoint cannot
# write GUACAMOLE_HOME. With them set, both pods satisfy the
# namespace's inherited `restricted` PSS.
#
# One replica each. guacd is per-connection child processes and could
# scale, but the webapp keeps sessions in Tomcat memory, so a second
# replica would need sticky routing to be worth anything — not for a
# one-person tool. Neither pod is on the mesh; only the Ingress is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacd
  template:
    metadata:
      labels:
        app: guacd
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guacd
          # Docker Hub tag@digest; bump both images together — guacd and
          # the webapp share one protocol version (GUACAMOLE_HANDSHAKE).
          image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
          env:
            # LOG_LEVEL, not the older GUACD_LOG_LEVEL: the image warns
            # that the latter is deprecated (verified 2026-10-22).
            - name: LOG_LEVEL
              value: info
          ports:
            - name: guacd
              containerPort: 4822
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 4822
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # Generous: every live session is a forked child holding a
            # decoded 16-bit framebuffer. Two sessions stay well under.
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: guacamole
spec:
  selector:
    app: guacd
  ports:
    - name: guacd
      port: 4822
      targetPort: 4822
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: guacamole
spec:
  replicas: 1
  # Recreate, not RollingUpdate: one user, and a rolling replace would
  # run two Tomcats against the same secret for no gain.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: guacamole
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guacamole
          image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
          env:
            - name: GUACD_HOSTNAME
              value: guacd
            - name: GUACD_PORT
              value: "4822"
            # The one authentication extension (ADR-0045). The key is
            # shared with the sidecar below, which mints the blobs.
            - name: JSON_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: guacamole-auth
                  key: json-secret-key
            # No IP ban. Guacamole bans a source address after 5 failed
            # logins, but every browser here arrives as ONE address: the
            # gateway drops X-Forwarded-For (it has a key, not an IP, to
            # forward) and nginx adds its own pod IP. So the ban could
            # only ever lock every device out together (it did, on
            # 2026-10-22), and it protects nothing the device gate in
            # front and Windows' own account lockout do not already.
            - name: BAN_ENABLED
              value: "false"
            # WEBAPP_CONTEXT stays the image default (`guacamole`): the
            # app is served at /guacamole/, and the Ingress sends `/`
            # there. Naming it ROOT would collide with Tomcat's own
            # default webapp.
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # No `exec` probes: the image is a Tomcat distro and running
          # another JVM for a probe would be worse than nothing.
          readinessProbe:
            httpGet:
              path: /guacamole/
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /guacamole/
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
        # The front proxy (ADR-0045). Pinned by :<sha>@digest like
        # jellyfinqc; .github/workflows/guacjson-image.yml builds it on
        # a push that touches config-server/guacjson or cmd/guacjson.
        - name: front
          image: ghcr.io/marnyg/guacjson:ea6cbe8d04b57b4615a591cb28af46449be1db1a@sha256:2f59b258da9bc1b8815f924d991eeac79d5a24e2a1e9bfb64de194e85da7952c
          args:
            - -listen=:8081
            - -upstream=http://127.0.0.1:8080
            - -group=admins
            - -gateway=ed:45fc82fcbd3714b82a42805131a957a59cd814e02064ba40abc4f71f6b6613f4
            - -connection=win2k25
            - -protocol=rdp
            # The RDP parameters, visible here on purpose; only the
            # password comes from the secret (GUACJSON_PASSWORD).
            - -param=hostname=win2k25-rdp.vms.svc.cluster.local
            - -param=port=3389
            - -param=username=Administrator
            - -param=security=nla
            - -param=ignore-cert=true
            - -param=resize-method=display-update
            - -param=server-layout=en-us-qwerty
            - -param=enable-audio=true
            - -param=enable-wallpaper=false
            - -param=enable-theming=false
            - -param=enable-font-smoothing=false
            - -param=enable-full-window-drag=false
            - -param=enable-desktop-composition=false
            - -param=enable-menu-animations=false
          env:
            - name: GUACJSON_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: guacamole-auth
                  key: json-secret-key
            - name: GUACJSON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guacamole-auth
                  key: guest-password
          ports:
            - name: front
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            # Through the proxy into Tomcat: ready means both are.
            httpGet:
              path: /guacamole/
              port: 8081
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: guacamole
spec:
  selector:
    app: guacamole
  ports:
    # The Ingress still says 8080; it lands on the sidecar.
    - name: http
      port: 8080
      targetPort: front
