# App state (users, watch progress, library metadata; also Jellyfin's
# cache and transcode scratch, hence the size) on the default longhorn
# class, RWO 2 replicas, per ADR-0011. Was an emptyDir until 2026-10-03.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # The SSO plugin's code exchange dials the issuer server-side;
      # pods cannot resolve .mesh.internal (Talos host DNS serves no
      # /etc/hosts entries to kube-dns — siderolabs/talos#9822), so pin
      # the issuer name — at the siwe-oidc **Service** ClusterIP (pinned
      # in its manifest), same as oauth2-proxy/argocd-server. A node's
      # mesh address would only be dialable from pods on that node
      # (nebula carries 10.42.0.0/16 sources; pods are 10.244.x.x).
      hostAliases:
        - ip: 10.107.226.217
          hostnames: [auth.gw.mesh.internal]
      # The image starts as root and drops to PUID; fsGroup just makes
      # the fresh ext4 /config volume 1000-writable from the first mount.
      securityContext:
        fsGroup: 1000
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:12.1ubu2604-ls51
          ports:
            - containerPort: 8096
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tv
              mountPath: /data/tv
              readOnly: true
            - name: movies
              mountPath: /data/movies
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: configurator
          # ships curl + sh, so no root apk install at start (same as
          # sonarr/radarr). Helper pin: one tag across k8s/apps
          # (rg 'image: curlimages/curl').
          image: curlimages/curl:8.22.0
          command: ["/bin/sh", "/scripts/configure.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: JELLYFIN_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jellyfin-admin
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: scripts
          configMap:
            name: jellyfin-configurator
        - name: tv
          persistentVolumeClaim:
            claimName: tv
        - name: movies
          persistentVolumeClaim:
            claimName: movies
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  type: NodePort
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
      nodePort: 30096
