# App state (users, watch progress, library metadata; also Jellyfin's
# cache and transcode scratch, hence the size) on the default longhorn
# class, RWO 2 replicas, per ADR-0011. Was an emptyDir until 2026-10-03.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  # RWO /config: the replacement pod cannot attach while the old one
  # holds the volume on another node (Multi-Attach), so no rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Never on nas1, the node pinned to host this library's NFS servers
      # (storageclass.yaml shareManagerNodeSelector). A nas1 shutdown
      # drains the share-manager and its clients at once; a client on
      # the same node is then left with a hard NFS mount to a server
      # that is gone, its unmount never returns, and Talos hangs in
      # unmountPodMounts until the power button (2026-10-05, m1au).
      # Clients on other nodes just stall and reconnect when the
      # share-manager is back. The NFS hop is paid anyway (ADR-0029).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [nas1]
      # The SSO plugin's code exchange dials the issuer server-side;
      # pods cannot resolve .mesh.internal (Talos host DNS serves no
      # /etc/hosts entries to kube-dns — siderolabs/talos#9822), so pin
      # the issuer name — at the siwe-oidc **Service** ClusterIP (pinned
      # in its manifest), same as argocd-server. A node's
      # mesh address is a fake IP owned by that member's own tun (v3,
      # 198.18/15) — not routable from pods (10.244.x.x) at all.
      hostAliases:
        - ip: 10.107.226.217
          hostnames: [auth.gw.mesh.internal]
      # PSS restricted: runs as 1000 like sonarr/radarr. The upstream image
      # (not linuxserver's: its Jellyfin build has no non-root branch and
      # always s6-setuidgid's, which cannot work once we are already 1000)
      # has no s6 and takes every directory from the environment. fsGroup
      # makes the ext4 /config volume 1000-writable; the library mounts are
      # read-only. No /dev/dri here, so transcoding is software either way.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: docker.io/jellyfin/jellyfin:12.1.20260915-010956
          ports:
            - containerPort: 8096
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # linuxserver's layout, kept so the PVC written under that
            # image (2026-10-03) reads as-is: /config is the config dir,
            # data/cache/log beneath it (upstream's default is /config as
            # data dir with config under it and cache on /cache).
            - name: JELLYFIN_CONFIG_DIR
              value: /config
            - name: JELLYFIN_DATA_DIR
              value: /config/data
            - name: JELLYFIN_CACHE_DIR
              value: /config/cache
            - name: JELLYFIN_LOG_DIR
              value: /config/log
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tv
              mountPath: /data/tv
              readOnly: true
            - name: movies
              mountPath: /data/movies
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: configurator
          # ships curl + sh, so no root apk install at start (same as
          # sonarr/radarr). Helper pin: one tag across k8s/apps
          # (rg 'image: curlimages/curl').
          image: curlimages/curl:8.22.0
          command: ["/bin/sh", "/scripts/configure.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: JELLYFIN_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jellyfin-admin
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
        # Front proxy (config-server/jellyfinqc): the jellyfin.gw
        # Ingress's backend. Forwards to :8096 and, on a Quick Connect
        # started by a `media`-group device, approves it as that
        # device's own (non-admin) Jellyfin user — the appliance login
        # (95la): the TV presses Quick Connect and is in, no password
        # on the device. Identity comes from the gateway's X-Mesh-Token,
        # verified against the same gateway id the bridge pins
        # (k8s/apps/siwe-oidc). Admin devices and anything without a
        # token keep Jellyfin's manual approval.
        - name: qc
          image: ghcr.io/marnyg/jellyfinqc:latest
          imagePullPolicy: Always
          args:
            - -listen=:8097
            - -upstream=http://127.0.0.1:8096
            - -group=media
            - -gateway=ed:45fc82fcbd3714b82a42805131a957a59cd814e02064ba40abc4f71f6b6613f4
          ports:
            - containerPort: 8097
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: JELLYFIN_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jellyfin-admin
                  key: password
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: scripts
          configMap:
            name: jellyfin-configurator
        - name: tv
          persistentVolumeClaim:
            claimName: tv
        - name: movies
          persistentVolumeClaim:
            claimName: movies
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  # ClusterIP only: the gateway's raw `jellyfin` facet (:8096) and the
  # jellyfin.gw ingress (via the qc front proxy, :8097) are the two
  # doors (ADR-0017). The NodePort 30096
  # was the nebula-era LAN-direct path for the TV; it was unreachable
  # from mesh v3 (a node forwards only apid/kube-api) and an
  # unauthenticated LAN door otherwise — cut 2026-10-04 with the win2k25
  # RDP NodePort (j5c5).
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: 8096
    - name: qc
      port: 8097
      targetPort: 8097
