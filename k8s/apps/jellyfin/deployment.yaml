apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # The SSO plugin's code exchange dials the issuer server-side;
      # pods cannot resolve .mesh.internal (Talos host DNS serves no
      # /etc/hosts entries to kube-dns — siderolabs/talos#9822), so pin
      # the issuer name — at the siwe-oidc **Service** ClusterIP (pinned
      # in its manifest), same as oauth2-proxy/argocd-server. A node's
      # mesh address would only be dialable from pods on that node
      # (nebula carries 10.42.0.0/16 sources; pods are 10.244.x.x).
      hostAliases:
        - ip: 10.107.226.217
          hostnames: [auth.cp1.mesh.internal]
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:10.11.6
          ports:
            - containerPort: 8096
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tv
              mountPath: /data/tv
              readOnly: true
            - name: movies
              mountPath: /data/movies
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: configurator
          image: alpine:3.21
          command: ["/bin/sh", "-c"]
          args:
            - apk add --no-cache curl > /dev/null 2>&1 && sh /scripts/configure.sh
          env:
            - name: JELLYFIN_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jellyfin-admin
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: config
          emptyDir: {}
        - name: scripts
          configMap:
            name: jellyfin-configurator
        - name: tv
          persistentVolumeClaim:
            claimName: tv
        - name: movies
          persistentVolumeClaim:
            claimName: movies
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  type: NodePort
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
      nodePort: 30096
