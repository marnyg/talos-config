# Jellyfin's local admin password, sealed to the cluster's
# sealed-secrets key pair (same as oauth2-proxy's cookie secret).
#
# This account is bootstrap machinery, not a human login: the
# configurator sidecar creates it in the startup wizard and then
# authenticates as it on every pod start to drive Jellyfin's API
# (libraries, SSO plugin, wallet provider). Humans sign in with the
# wallet (SIWE SSO); the local account remains only as the LAN/TV
# login and break-glass. It used to be the literal admin/admin in git —
# reachable LAN-direct (NodePort 30096) and over the mesh, and Jellyfin
# admin means plugin install, i.e. code execution in the pod.
#
# Retrieve for TV login / break-glass:
#   kubectl -n media get secret jellyfin-admin -o jsonpath='{.data.password}' | base64 -d
# Rotate: generate a new password, reseal (kubeseal --cert
# talos/clusters/homelab/sealed-secrets.crt), and restart the pod —
# config lives on emptyDir, so the wizard re-creates the account.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jellyfin-admin
  namespace: media
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: jellyfin-admin
      namespace: media
