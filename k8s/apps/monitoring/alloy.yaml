# Alloy, one per node: tails every pod's stdout/stderr off the node's
# /var/log/pods and watches the cluster's Events, shipping both to Loki
# (loki.yaml). Grafana's collector, replacing Promtail (deprecated
# upstream, EOL 2026-03).
#
# File tailing rather than the kubelet-API source (loki.source.
# kubernetes): the files are what containerd wrote, survive a kubelet
# restart, and cost no API round trip per container. The price is a
# read-only hostPath on /var/log and running as root — Talos' kubelet
# writes pod logs 0640 root:root — which is the reason the namespace is
# PSS privileged (namespace.yaml). The container keeps a read-only
# rootfs and no other capability.
#
# Labels kept: namespace, pod, container, node, app (app.kubernetes.io/
# name falling back to app). Nothing high-cardinality (no pod uid, no
# container id) — Loki indexes labels, and a stream per pod restart
# is the classic way to make it crawl.
#
# Not covered: Talos' own logs (kernel, machined, etcd, kubelet). Those
# never enter /var/log/pods; Talos ships them by machine.logging.
# destinations over tcp/udp JSON lines, which would need a receiver
# here (loki.source.syslog is the wrong shape; otelcol.receiver.tcplog
# the likely one). Open on the epic (talos-config-xhk3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.1
    helm:
      valuesObject:
        controller:
          type: daemonset
          # Scrape control-plane pods too.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          volumes:
            extra:
              - name: storage
                emptyDir: {}
        alloy:
          # Positions + WAL; the chart's default /tmp/alloy would sit
          # on the read-only rootfs.
          storagePath: /var/lib/alloy
          mounts:
            varlog: true
            extra:
              - name: storage
                mountPath: /var/lib/alloy
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          configMap:
            content: |
              // Pods on this node only; the DaemonSet gives each Alloy its
              // own node name in K8S_NODE_NAME.
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                // /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
                rule {
                  source_labels = [
                    "__meta_kubernetes_namespace",
                    "__meta_kubernetes_pod_name",
                    "__meta_kubernetes_pod_uid",
                    "__meta_kubernetes_pod_container_name",
                  ]
                  separator    = "/"
                  regex        = "(.*)/(.*)/(.*)/(.*)"
                  replacement  = "/var/log/pods/$1_$2_$3/$4/*.log"
                  target_label = "__path__"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = [
                    "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                    "__meta_kubernetes_pod_label_app",
                  ]
                  separator    = ""
                  regex        = "(.+?)(.*)"
                  replacement  = "$1"
                  target_label = "app"
                }
              }

              local.file_match "pods" {
                path_targets = discovery.relabel.pods.output
              }

              loki.source.file "pods" {
                targets    = local.file_match.pods.targets
                forward_to = [loki.process.pods.receiver]
                // Positions live in an emptyDir (storagePath): a pod
                // recreation starts at the end of each file rather than
                // re-shipping what Loki already has.
                tail_from_end = true
              }

              loki.process "pods" {
                // containerd's CRI format: "<ts> <stdout|stderr> <F|P> <line>",
                // reassembling partial (P) lines.
                stage.cri {}
                // longhorn-csi-plugin logs the volume-encryption
                // passphrase verbatim (NodePublishVolume req dump,
                // Longhorn 1.12.0; k8s/apps/longhorn/crypto.sealed.yaml).
                // Drop any line carrying it before it reaches Loki 
                // Loki's own volume is encrypted under that same key, but
                // Grafana shows logs to every admin.
                stage.drop {
                  expression = "CRYPTO_KEY_VALUE"
                }
                forward_to = [loki.write.default.receiver]
              }

              // Kubernetes Events (scheduling, OOMKilled, probe failures,
              // Longhorn's volume state changes) as a log stream — they
              // otherwise live one hour in the API server and vanish.
              loki.source.kubernetes_events "events" {
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
