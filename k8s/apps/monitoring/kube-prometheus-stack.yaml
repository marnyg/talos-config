# Metrics: Prometheus Operator + Prometheus + Alertmanager + Grafana +
# node-exporter + kube-state-metrics, one chart (epic talos-config-xhk3).
# Until this landed the cluster had no metrics at all — not even
# metrics-server — and every incident in notes.md (w1 off for 8 days,
# bulk replicas faulted for 12, nas1 rebuilding for hours) was found by
# a human noticing something was slow.
#
# Version pinned EXACTLY (Longhorn's reasoning, not ingress-nginx's):
# the chart carries the Operator CRDs and Grafana's major, both of
# which have broken on upgrade before; upgrades are a deliberate act
# with the release notes read.
#
# Talos specifics:
#   - controller-manager, scheduler, etcd and kube-proxy bind their
#     metrics to loopback by default; talos/clusters/homelab/cluster.yaml
#     moves them to the node address. Without that these four targets
#     stay down and their dashboards blank.
#   - etcd is a Talos service, not a pod, so there is nothing for a
#     Service selector to find; etcd-scrapeconfig.yaml next to this
#     file scrapes it by static address (cp1's declared LAN address, the
#     same literal cluster.yaml uses) on the plain-text metrics port
#     2381. The chart's own kubeEtcd.endpoints mechanism renders a bare
#     Endpoints object, which ArgoCD 3 excludes by default and never
#     creates; kubeEtcd stays enabled only for the dashboard + rules it
#     gates.
#   - controller-manager and scheduler ARE static pods with the
#     `component:` labels the chart's Services select on; scraped over
#     https with the Prometheus ServiceAccount token (RBAC permits
#     /metrics via system:monitoring).
#   - the kubelet is scraped through its own :10250 with the same token
#     (default), which Talos permits.
#
# Grafana login (proxy-to-grafana; spike i1il, ADR-0032, ADR-0039): the
# Ingress gates on `admins` and Grafana trusts X-Mesh-Name as the user.
# The gateway is the only caller of ingress-nginx, so the header is
# exactly as trustworthy as the X-Mesh-Token the gate verified — a
# device, not a person, is the principal (ArgoCD's -token-client
# reasoning: dashboards carry no per-person state worth splitting). Every
# auto-created user is an org Admin because the Ingress already proved
# `admins`. The chart's generated local `admin` stays as break-glass at
# /login, like ArgoCD's.
#
# Storage: Prometheus 20Gi / 15d, Alertmanager 1Gi, Grafana 2Gi, all on
# the default Longhorn class (nvme, 2 replicas). Data plane under
# invariant 2 (see namespace.yaml). The memory-heavy pods (Prometheus,
# Grafana) keep off nas1 (7Gi, the media tier) by hostname, the way the
# download clients pin TO it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.10.0
    helm:
      valuesObject:
        # Shorter resource names: kube-prometheus-stack-prometheus-… is
        # a mouthful in every kubectl line and Grafana URL.
        fullnameOverride: kps
        cleanPrometheusOperatorObjectNames: true

        defaultRules:
          create: true
          rules:
            # No etcd-on-pods alerts: Talos etcd is a host service with
            # its own lifecycle; the metrics still land for dashboards.
            etcd: true
            # The Watchdog it carries is routed to null below: a
            # dead-man's switch is only worth something to a receiver
            # OUTSIDE the failure domain, and the hub (ADR-0027) does
            # not take heartbeats yet.
            general: true

        kubeEtcd:
          enabled: true
          service:
            enabled: false
          serviceMonitor:
            enabled: false

        kubeProxy:
          enabled: true

        kubeControllerManager:
          enabled: true

        kubeScheduler:
          enabled: true

        # Talos exposes no CoreDNS metrics change; defaults scrape the
        # kube-dns Service on :9153.
        coreDns:
          enabled: true

        nodeExporter:
          enabled: true
          operatingSystems:
            # The chart would otherwise also render darwin/aix bits.
            linux:
              enabled: true
            darwin:
              enabled: false
            aix:
              enabled: false
        prometheus-node-exporter:
          # Talos mounts the root fs read-only and the chart's default
          # hostRootFsMount is fine; exclude the containerd/kubelet
          # mount churn so the filesystem dashboards stay readable.
          extraArgs:
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/kubelet/.+|var/lib/containerd/.+|var/mnt/longhorn.*/replicas/.+)($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          # Backup health (ADR-0044). Longhorn's own exporter gives a
          # backup's state (longhorn_backup_state: 3 Completed, 4 Error)
          # but no time, so "is the newest backup fresh" is unanswerable
          # from it. The timestamps live on Longhorn's CRs; these
          # custom-resource metrics lift them out for the rules in
          # k8s/apps/monitoring/longhorn-backup-rules.yaml:
          #   longhorn_backupvolume_last_backup_timestamp_seconds{volume}
          #   longhorn_volume_cr_created_timestamp_seconds{volume,backup_group,pvc,pvc_namespace}
          #   longhorn_backuptarget_available{target}
          #   longhorn_backuptarget_last_synced_timestamp_seconds{target}
          # RFC3339 strings become unix seconds; a bool becomes 0/1.
          rbac:
            extraRules:
              - apiGroups: [longhorn.io]
                resources: [volumes, backupvolumes, backuptargets]
                verbs: [list, watch]
          customResourceState:
            enabled: true
            config:
              kind: CustomResourceStateMetrics
              spec:
                resources:
                  - groupVersionKind: {group: longhorn.io, version: v1beta2, kind: BackupVolume}
                    metricNamePrefix: longhorn_backupvolume
                    labelsFromPath:
                      volume: [spec, volumeName]
                    metrics:
                      - name: last_backup_timestamp_seconds
                        help: Time of the newest backup of this volume in the backup target.
                        each:
                          type: Gauge
                          gauge:
                            path: [status, lastBackupAt]
                  - groupVersionKind: {group: longhorn.io, version: v1beta2, kind: Volume}
                    metricNamePrefix: longhorn_volume_cr
                    labelsFromPath:
                      volume: [metadata, name]
                      backup_group: [metadata, labels, recurring-job-group.longhorn.io/backup]
                      pvc: [status, kubernetesStatus, pvcName]
                      pvc_namespace: [status, kubernetesStatus, namespace]
                    metrics:
                      - name: created_timestamp_seconds
                        help: Creation time of the Longhorn volume (a new volume is not stale before its first nightly).
                        each:
                          type: Gauge
                          gauge:
                            path: [metadata, creationTimestamp]
                  - groupVersionKind: {group: longhorn.io, version: v1beta2, kind: BackupTarget}
                    metricNamePrefix: longhorn_backuptarget
                    labelsFromPath:
                      target: [metadata, name]
                    metrics:
                      - name: available
                        help: 1 when Longhorn can reach the backup target (Tigris).
                        each:
                          type: Gauge
                          gauge:
                            path: [status, available]
                            nilIsZero: true
                      - name: last_synced_timestamp_seconds
                        help: Last time Longhorn listed the backup target.
                        each:
                          type: Gauge
                          gauge:
                            path: [status, lastSyncedAt]

        prometheusOperator:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          # Operator admission webhooks need a cert; the chart's
          # patch Jobs mint a self-signed one in-cluster. Fine here,
          # nothing else trusts it.
          admissionWebhooks:
            enabled: true

        prometheus:
          prometheusSpec:
            retention: 15d
            # Below the volume: the TSDB never fills the disk it lives
            # on, whatever the retention window says.
            retentionSize: 17GiB
            scrapeInterval: 30s
            evaluationInterval: 30s
            # Pick up ServiceMonitors / PodMonitors / PrometheusRules /
            # Probes from EVERY namespace, not only those labelled
            # `release: kube-prometheus-stack`. Longhorn, ingress-nginx
            # and ArgoCD render their own monitors in their own
            # namespaces; the convention "exposing metrics = a
            # ServiceMonitor next to the app" needs this.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 20Gi
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2.5Gi
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: NotIn
                          values: [nas1]

        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 1Gi
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
          # Receiver: the in-mesh notifier (ADR-0042) through the
          # ntfy-alertmanager shim next to this file. Nothing public
          # carries a page (invariant 5): the phone reads ntfy over its
          # tunnel. Watchdog (always firing by design) and InfoInhibitor
          # (the chart's helper for silencing info-level noise) are the
          # two the upstream default config also drops. Grafana's
          # Alertmanager view stays the place to silence.
          config:
            route:
              receiver: ntfy
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                - receiver: "null"
                  matchers:
                    - alertname =~ "Watchdog|InfoInhibitor"
            receivers:
              - name: "null"
              - name: ntfy
                webhook_configs:
                  - url: http://ntfy-alertmanager.monitoring.svc:8080
                    send_resolved: true
            # A critical page silences the warning/info copies of the
            # same thing (the upstream default's three rules).
            inhibit_rules:
              - source_matchers: [severity = critical]
                target_matchers: [severity =~ "warning|info"]
                equal: [namespace, alertname]
              - source_matchers: [severity = warning]
                target_matchers: [severity = info]
                equal: [namespace, alertname]
              - source_matchers: [alertname = InfoInhibitor]
                target_matchers: [severity = info]
                equal: [namespace]

        grafana:
          enabled: true
          # Subchart, so the parent's override does not reach it; the
          # Ingress (ingress.yaml) dials Service `grafana`.
          fullnameOverride: grafana
          defaultDashboardsEnabled: true
          defaultDashboardsTimezone: Europe/Oslo
          # Break-glass local admin from the sealed secret next to this
          # file (grafana-admin.sealed.yaml); see there for why not the
          # chart's generated one.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          deploymentStrategy:
            type: Recreate
          persistence:
            enabled: true
            type: pvc
            storageClassName: longhorn
            accessModes: [ReadWriteOnce]
            size: 2Gi
          grafana.ini:
            server:
              root_url: https://grafana.gw.mesh.internal
            analytics:
              check_for_updates: false
              reporting_enabled: false
            news:
              news_feed_enabled: false
            auth:
              # The header IS the session; no "sign out" that would
              # only loop back in.
              disable_signout_menu: true
            auth.proxy:
              enabled: true
              header_name: X-Mesh-Name
              header_property: username
              auto_sign_up: true
              # Grafana checks the TCP peer (not X-Forwarded-For)
              # against this list; ingress-nginx is a pod, so the pod
              # CIDR (Talos default podSubnets). What this buys is
              # modest: it rejects a header asserted from a node or
              # the LAN, but any pod can reach grafana:80 and name
              # itself, because this CNI enforces no NetworkPolicy
              # (the same gap k8s/apps/sandbox/agent.yaml records for
              # the agent's egress — and the same bypass every
              # auth-url gated Service already has). Closing it is a
              # CNI question, not a Grafana one; thread on the epic.
              whitelist: 10.244.0.0/16
              enable_login_token: false
            auth.anonymous:
              enabled: false
            auth.basic:
              # /login still works for the break-glass admin.
              enabled: true
            users:
              # The Ingress gate already proved `admins`.
              auto_assign_org_role: Admin
              default_theme: dark
            security:
              # Cookies travel inside the device's https (ADR-0033) and
              # the identity stream; Grafana never sees TLS itself.
              cookie_secure: false
              cookie_samesite: lax
            log:
              mode: console
          sidecar:
            dashboards:
              enabled: true
              # ConfigMaps labelled grafana_dashboard=1 in ANY
              # namespace: a dashboard lives next to the app it
              # describes (k8s/apps/<app>/dashboard.yaml).
              searchNamespace: ALL
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
            datasources:
              enabled: true
              searchNamespace: ALL
          additionalDataSources:
            # Loki (k8s/apps/monitoring/loki.yaml), single binary, no
            # gateway: the plain :3100 Service.
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              jsonData:
                maxLines: 1000
          # 512Mi OOMKilled Grafana 13 twice on 2026-10-16 within
          # minutes of the first dashboard browsing (idle ~250Mi; a
          # few Compute Resources panels in flight push it past 512).
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1536Mi
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values: [nas1]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The Operator CRDs exceed the client-side-apply annotation limit
      # (Longhorn's reason).
      - ServerSideApply=true
