# grafana.gw.mesh.internal behind the admins gate (mechanism:
# k8s/apps/media/ingress.yaml). The gate is the whole login: Grafana's
# auth.proxy (kube-prometheus-stack.yaml) takes X-Mesh-Name — which the
# gateway set from the device's verified member cert and ingress-nginx
# forwarded untouched — as the username, and this annotation is what
# makes sure only an `admins` device gets that far. Remove the
# annotation and any mesh device becomes a Grafana org Admin.
#
# Prometheus and Alertmanager stay unexposed: Grafana's Explore and its
# Alertmanager view cover the UI need, and both have no auth of their
# own. Add an Ingress here (same annotation) if a raw UI is ever wanted.
#
# Live tail / dashboards use WebSockets; same timeout treatment as
# Vaultwarden's notifications hub.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://siwe-oidc.sso.svc.cluster.local/authz?group=admins
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
