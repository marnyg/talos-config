# grafana.gw.mesh.internal behind the admins gate (mechanism:
# k8s/apps/media/ingress.yaml). The gate is the whole login: Grafana's
# auth.proxy (kube-prometheus-stack.yaml) takes X-Mesh-Name — which the
# gateway set from the device's verified member cert and ingress-nginx
# forwarded untouched — as the username, and the controller's
# global-auth-url (k8s/apps/ingress-nginx, `?group=admins`) is what
# makes sure only an `admins` device gets that far. Opt this Ingress
# out of the global gate (enable-global-auth: "false") and any mesh
# device becomes a Grafana org Admin.
#
# Prometheus and Alertmanager stay unexposed: Grafana's Explore and its
# Alertmanager view cover the UI need, and both have no auth of their
# own. Add an Ingress here (it inherits the gate) if a raw UI is ever
# wanted.
#
# Live tail / dashboards use WebSockets; same timeout treatment as
# Vaultwarden's notifications hub.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # Dashboard tile; https because root_url is (ADR-0033). The chart
    # labels pods app.kubernetes.io/name=grafana = the ingress name,
    # so no pod-selector.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Grafana
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: grafana.png
    gethomepage.dev/description: metrics, logs
    gethomepage.dev/href: https://grafana.gw.mesh.internal
    gethomepage.dev/weight: "40"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
