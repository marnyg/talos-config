# Grafana's break-glass local admin, a sealed secret the chart's
# Grafana reads (grafana.admin.existingSecret in
# kube-prometheus-stack.yaml). Normal login is the mesh header
# (auth.proxy on X-Mesh-Name); this is /login when the gateway or the
# bridge is down. Read it through the wallet-gated kubeconfig —
#   kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
# Sealed rather than chart-generated: the chart's random password is
# re-rolled on every ArgoCD render, and the Deployment's checksum/secret
# annotation would roll the pod with it. Rotate: reseal with kubeseal
# --cert talos/clusters/homelab/sealed-secrets.crt (Forgejo's recipe,
# k8s/apps/forgejo/sysadmin.sealed.yaml); Grafana picks it up on restart.
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
