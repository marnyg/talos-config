# budget.gw.mesh.internal, behind the group gate like Vaultwarden and
# the *arr apps (k8s/apps/media/ingress.yaml explains the mechanism).
# The web app and the desktop/mobile clients all go through the
# device's tunnel and carry the gateway-signed X-Mesh-Token, so a
# non-member device never sees the login page. Actual's own server
# password is the second gate (deployment.yaml).
#
# Sync is plain HTTP POSTs of protobuf messages on /sync/*, plus the
# budget file upload/download; no WebSocket. The body cap covers an
# exported budget file (deployment.yaml caps the server side at 50 MB).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual
  namespace: actual
  annotations:
    # Dashboard tile; https because the app needs a secure context
    # (deployment.yaml).
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Actual Budget
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: actual-budget.png
    gethomepage.dev/description: money
    gethomepage.dev/href: https://budget.gw.mesh.internal
    gethomepage.dev/pod-selector: app=actual
    gethomepage.dev/weight: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
spec:
  ingressClassName: nginx
  rules:
    - host: budget.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual
                port:
                  number: 5006
