# The OpenRouter key the sandboxed agent spends against (agent.yaml,
# tj7c), sealed to the cluster's sealed-secrets key pair. A data-plane
# credential, not an identity: it authorises spend at a vendor, never a
# user or member (kanr memo, invariant 1 check). Set a spend limit on
# the key at OpenRouter — until M5 counted caveats (0bc.5) that limit is
# the only budget bound an agent has.
#
# Rotate: new key, reseal (kubeseal --cert
# talos/clusters/homelab/sealed-secrets.crt), running Jobs keep the old
# value until they end.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openrouter
  namespace: ai
spec:
  encryptedData:
    OPENROUTER_API_KEY: 
  template:
    metadata:
      name: openrouter
      namespace: ai
