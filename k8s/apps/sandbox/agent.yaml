# The sandboxed agent (talos-config-tj7c; ADR-0035's "null option"): pi
# as a plain Job-shaped workload under RuntimeClass kata — its own guest
# kernel, the OpenRouter key from a sealed secret, a throwaway
# workspace, a deadline. No orchestrator, no UI, no protocol binary:
# that is the point of v0. The agent-as-child (child beat beside pi,
# spawned by sap-provisioner) is the follow-up, not this file.
#
# Why a suspended CronJob: ArgoCD owns a pod *template*, not a run. A
# Job in git would fire once at sync and then be immutable; a CronJob
# that never fires (`suspend: true`, a schedule that does not exist)
# holds the template declaratively, and each run is a Job created from
# it by the owner:
#
#   scripts/agent-run.sh "<prompt>"        # batch: pi -p, read the log
#   scripts/agent-run.sh                   # interactive: tmux + pi, then
#   kubectl exec -it -n ai <pod> -- tmux attach
#
# Entry is gated by the kubeconfig, which reaches the API only over the
# mesh (cp1.mesh.internal SAN) — wallet-rooted already. No new HTTP
# surface, nothing public.
#
# The key: create an OpenRouter key WITH A SPEND LIMIT (the only budget
# bound until M5, 0bc.5) and seal it — the SealedSecret goes beside this
# file as sealed-secret.yaml:
#
#   kubectl create secret generic openrouter -n ai \
#     --from-literal=OPENROUTER_API_KEY=sk-or-… --dry-run=client -o yaml \
#   | kubeseal --cert talos/clusters/homelab/sealed-secrets.crt --format yaml \
#   > k8s/apps/sandbox/sealed-secret.yaml
#
# Known gap (v0): no NetworkPolicy enforcement on this CNI, so the
# agent's egress is unbounded — the guest kernel bounds what it can
# reach on the node, not what it can reach on the network.
#
# Resources: the guest's fixed cost (200Mi/250m, runtimeclass.yaml) is
# added by the scheduler on top of these. pi is a node process; 512Mi
# is comfortable, 2Gi the ceiling (kata's default_memory is 2 GiB).
# emptyDir volumes cross virtio-fs; metadata-heavy work pays for it
# (5h0j) — acceptable for a prompt-sized workspace.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent
  namespace: ai
spec:
  # Never fires on its own: suspended, and Feb 31 does not exist.
  suspend: true
  schedule: "0 0 31 2 *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 0
  jobTemplate:
    spec:
      backoffLimit: 0
      # 4 h: an interactive session left attached, or a long batch run.
      # agent-run.sh may shorten it per run.
      activeDeadlineSeconds: 14400
      # Keep finished Jobs a day so the transcript (the log) is readable.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: agent
        spec:
          runtimeClassName: kata
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: agent
              # k8s/apps/sandbox/build.sh prints the tag@digest to pin here.
              image: ghcr.io/marnyg/sandbox-agent@sha256:9288ffdf92cd11f78c4c15aff5a9068f4538b5ceb1695c44e420f5a3d3cbea22
              env:
                - name: AGENT_MODEL
                  value: anthropic/claude-sonnet-4.6
                  # AGENT_PROMPT: set by agent-run.sh for a batch run;
                  # absent ⇒ interactive (tmux session `agent`).
              envFrom:
                - secretRef:
                    name: openrouter
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: workspace
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
