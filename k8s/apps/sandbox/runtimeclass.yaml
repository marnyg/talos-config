# `kata`: pods that get their own guest kernel under Cloud Hypervisor —
# the sandbox layer for agent workloads that run code (spike bog2,
# decision 6d0u: sandbox first, orchestrator later). The handler comes
# from the kata-containers system extension in the fleet installer
# (talos/extensions/installer.env); a node without it fails the pod
# with "no runtime for kata", which is the right failure.
#
# overhead.podFixed is charged to the pod's requests at scheduling.
# Measured on w1 for an idle pod (bog2, 2026-10-08): cloud-hypervisor
# 149 MB + shim 43 MB + virtiofsd ×2 ~7 MB ≈ 200 MB host RSS — more than
# upstream's 130Mi figure. The guest's 2 GiB default_memory is virtual;
# only touched pages are resident.
#
# What a kata pod cannot do, by construction: hostNetwork, hostPID,
# privileged, host devices. Nothing here needs any of them.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    memory: 200Mi
    cpu: 250m
