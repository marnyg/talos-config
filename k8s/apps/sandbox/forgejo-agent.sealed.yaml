# The Forgejo token the sandboxed agent pushes with (ADR-0037, ivof.1
# bootstrap step 5): bot user `agent`, team `bots` in org `agents`,
# scopes write:repository,write:issue. A data-plane credential like the
# OpenRouter key beside it (kanr memo, invariant 1 check) — the wire
# carries repo names, never this. FORGEJO_URL is the in-cluster Service:
# pods cannot resolve the mesh name. Interim: agent.yaml mounts it by
# envFrom; once e6pu lands the k8s driver's -outfit attaches it instead.
#
# Rotate: k8s/apps/forgejo/bootstrap.md step 5 with a new --token-name,
# then DELETE the old token as sysadmin; reseal with
# kubeseal --cert talos/clusters/homelab/sealed-secrets.crt.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-agent
  namespace: ai
spec:
  encryptedData:
    FORGEJO_TOKEN: 
    FORGEJO_URL: 
  template:
    metadata:
      name: forgejo-agent
      namespace: ai
