apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nzbget
  template:
    metadata:
      labels:
        app: nzbget
    spec:
      # Never on nas1, the node pinned to host this library's NFS servers
      # (storageclass.yaml shareManagerNodeSelector). A nas1 shutdown
      # drains the share-manager and its clients at once; a client on
      # the same node is then left with a hard NFS mount to a server
      # that is gone, its unmount never returns, and Talos hangs in
      # unmountPodMounts until the power button (2026-10-05, m1au).
      # Clients on other nodes just stall and reconnect when the
      # share-manager is back. The NFS hop is paid anyway (ADR-0029).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [nas1]
      # PSS restricted: every container runs as 1000 (the linuxserver image
      # supports non-root operation; PUID/PGID are then ignored). The
      # media PVC roots (downloads, tv, movies) must already be 1000-owned
      # — they are; a fresh volume needs a one-off chown since no pod
      # runs as root any more.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config
          # Helper pin: one tag across k8s/apps (rg 'image: busybox').
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              set -e
              # s6-overlay (non-root) insists /run is owned by its uid; an
              # emptyDir is root-owned, a subdir we create is not.
              mkdir -p /scratch/run
              mkdir -p /downloads/completed/Series /downloads/completed/Movies /downloads/completed/radarr /downloads/completed/sonarr /downloads/completed/tv-sonarr /downloads/incomplete /downloads/intermediate /downloads/tmp /downloads/queue /downloads/nzb /downloads/scripts
              sed "s/PLACEHOLDER_USER/$NNTP_USER/g; s/PLACEHOLDER_PASS/$NNTP_PASS/g" \
                /template/nzbget.conf > /config/nzbget.conf
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: NNTP_USER
              valueFrom:
                secretKeyRef:
                  name: newshosting
                  key: username
            - name: NNTP_PASS
              valueFrom:
                secretKeyRef:
                  name: newshosting
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-template
              mountPath: /template
            - name: downloads
              mountPath: /downloads
            - name: scratch
              mountPath: /scratch
      containers:
        - name: nzbget
          image: ghcr.io/linuxserver/nzbget:26.3.20261002
          ports:
            - containerPort: 6789
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: scratch
              mountPath: /run
              subPath: run
          readinessProbe:
            tcpSocket:
              port: 6789
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          emptyDir: {}
        - name: scratch
          emptyDir: {}
        - name: config-template
          configMap:
            name: nzbget-config
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
---
apiVersion: v1
kind: Service
metadata:
  name: nzbget
  namespace: media
spec:
  selector:
    app: nzbget
  ports:
    - port: 6789
      targetPort: 6789
