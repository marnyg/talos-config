apiVersion: v1
kind: ConfigMap
metadata:
  name: nzbget-config
  namespace: media
data:
  # Minimal config; everything not listed falls back to the defaults in
  # ConfigTemplate. PLACEHOLDER_* are filled from secrets by the init
  # container (deployment.yaml).
  nzbget.conf: |
    MainDir=/downloads
    DestDir=${MainDir}/completed
    InterDir=${MainDir}/intermediate
    TempDir=${MainDir}/tmp
    QueueDir=${MainDir}/queue
    NzbDir=${MainDir}/nzb
    ScriptDir=${MainDir}/scripts
    LogFile=${MainDir}/nzbget.log
    WriteLog=rotate
    RotateLog=3
    WebDir=${AppDir}/webui
    ConfigTemplate=${AppDir}/webui/nzbget.conf.template
    CertStore=${AppDir}/cacert.pem
    CertCheck=yes

    Server1.Active=yes
    Server1.Name=Newshosting
    Server1.Host=news.newshosting.com
    Server1.Port=563
    Server1.Username=PLACEHOLDER_USER
    Server1.Password=PLACEHOLDER_PASS
    Server1.JoinGroup=no
    Server1.Encryption=yes
    Server1.Connections=10
    Server1.Level=0
    Server1.Group=0

    # SSO like sonarr/radarr: the ingress gate (oauth2-proxy, see
    # media/ingress.yaml) is the login, nzbget's own is off
    # (empty ControlPassword = "disable authorization request"). nzbget
    # still refuses to start with an empty ControlUsername, hence the
    # dummy; the settings page's "Password is set to empty" warning is
    # the deliberate posture, not an oversight.
    ControlIP=0.0.0.0
    ControlPort=6789
    ControlUsername=nzbget
    ControlPassword=
    AuthorizedIP=

    # MB of RAM for article assembly (the pod has no memory limit; the
    # nodes have 32 GB). WriteBuffer is KB per file.
    ArticleCache=200
    WriteBuffer=1024

    Unpack=yes
    UnrarCmd=unrar
    SevenZipCmd=7z

    Category1.Name=Series
    Category1.DestDir=
    Category2.Name=Movies
    Category2.DestDir=
