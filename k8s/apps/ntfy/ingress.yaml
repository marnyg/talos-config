# ntfy.gw.mesh.internal, behind the admins gate like Gatus and Grafana
# (k8s/apps/media/ingress.yaml explains the mechanism). The gate is
# the whole login: ntfy has no auth of its own here (deployment.yaml),
# so any admins device may subscribe to every topic and publish to
# them — the topics are the cluster's alerts, nothing per-person.
#
# The Android app holds a WebSocket (/<topic>/ws) or a JSON stream
# open for as long as it runs; same timeout treatment as Vaultwarden's
# notifications hub so nginx does not cut it every 60 s.
#
# proxy-body-size matches NTFY_ATTACHMENT_FILE_SIZE_LIMIT
# (deployment.yaml) so an image published from a device is refused by
# ntfy with a reason, not by nginx's 1m default.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy
  namespace: ntfy
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: ntfy
    gethomepage.dev/group: Notifications
    gethomepage.dev/icon: ntfy.png
    gethomepage.dev/description: pages
    gethomepage.dev/href: https://ntfy.gw.mesh.internal
    gethomepage.dev/pod-selector: app=ntfy
    gethomepage.dev/weight: "35"
    # Service widget: the latest page on the alerts topic. Homepage's
    # pod polls the Service directly — in-cluster, so no gate and no
    # token, the same reachability trust the publishers have
    # (deployment.yaml). Without `message`, which is Alertmanager's
    # markdown label dump. Own group so the tile is wide enough for
    # the fields (layout in homepage/config.yaml).
    gethomepage.dev/widget.type: ntfy
    gethomepage.dev/widget.url: http://ntfy.ntfy.svc
    gethomepage.dev/widget.topic: alerts
    gethomepage.dev/widget.fields: '["title", "priority", "lastReceived"]'
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
spec:
  ingressClassName: nginx
  rules:
    - host: ntfy.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 80
