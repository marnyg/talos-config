apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarr-configurator
  namespace: media
data:
  # Recyclarr (sidecar in deployment.yaml) syncs TRaSH's "[Anime] Remux-1080p"
  # quality profile into Sonarr. Existing profiles are untouched; a series
  # opts in by picking this profile (and series type Anime). What the
  # profile enforces, all from release-title heuristics — nothing inspects
  # the actual audio/subtitle tracks:
  #   - minFormatScore 100: only known fansub/BD groups (the Anime BD/Web
  #     tiers, 100..1400) clear the bar, which is the practical proxy for
  #     "Japanese audio, English subs". Untagged releases score 0 → skipped.
  #   - Anime Raws −10000: JP-only raw groups (no subs) are blocked.
  #   - Dubs Only −10000: English-dub-only releases are blocked.
  #   - Anime Dual Audio: JP+EN tracks, still Japanese; +10 as a tiebreak
  #     only (the guide leaves it unscored; 101+ would prefer dual audio
  #     over plain subs).
  # trash_ids: https://github.com/TRaSH-Guides/Guides/tree/master/docs/json/sonarr
  recyclarr.yml: |
    sonarr:
      sonarr:
        base_url: http://localhost:8989
        api_key: !env_var SONARR_API_KEY
        quality_profiles:
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true
        custom_formats:
          - trash_ids:
              - 418f50b10f1907201b6cfdf881f467b7  # Anime Dual Audio
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: 10
  configure.sh: |
    #!/bin/sh
    set -e

    SONARR_URL="http://localhost:8989"
    # NZBGEEK_API_KEY and PROWLARR_API_KEY come from the env (nzbgeek and
    # prowlarr sealed secrets).

    echo "Waiting for Sonarr to start..."
    until curl -sf "$SONARR_URL/ping" > /dev/null 2>&1; do
      sleep 5
    done

    # Wait for config.xml to have an API key
    while [ ! -f /config/config.xml ] || ! grep -q '<ApiKey>' /config/config.xml; do
      sleep 2
    done

    API_KEY=$(sed -n 's/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/p' /config/config.xml)
    echo "Sonarr API key: $API_KEY"
    AUTH="X-Api-Key: $API_KEY"

    # Allowed Hosts (DNS-rebinding guard, else a health warning): the
    # names Sonarr is reached by — the configurator (localhost), in-cluster
    # peers (the Service), the mesh (nginx passes the Host untouched). Not
    # the pod IP: the readiness probe sends Host: localhost for that. Host
    # settings only apply after a restart, so restart only on change.
    allowed="localhost,sonarr,sonarr.media,sonarr.media.svc,sonarr.media.svc.cluster.local,sonarr.gw.mesh.internal"
    host=$(curl -sf -H "$AUTH" "$SONARR_URL/api/v3/config/host")
    if ! printf '%s' "$host" | grep -q "\"allowedHosts\": *\"$allowed\""; then
      echo "Setting allowed hosts..."
      printf '%s' "$host" | sed "s/\"allowedHosts\": *\"[^\"]*\"/\"allowedHosts\": \"$allowed\"/" > /tmp/host.json
      curl -sf -o /dev/null -X PUT -H "$AUTH" -H "Content-Type: application/json" \
        --data-binary @/tmp/host.json "$SONARR_URL/api/v3/config/host/1" \
        && curl -sf -o /dev/null -X POST -H "$AUTH" "$SONARR_URL/api/v3/system/restart" \
        || echo "WARN: allowed hosts failed"
      sleep 15
      until curl -sf "$SONARR_URL/ping" > /dev/null 2>&1; do sleep 5; done
    fi

    # Wait for dependency services
    echo "Waiting for NZBget..."
    until curl -sf "http://nzbget:6789" > /dev/null 2>&1; do sleep 5; done

    echo "Waiting for Transmission..."
    until curl -sf "http://transmission:9091/transmission/web/" > /dev/null 2>&1; do sleep 5; done

    # Add root folder /tv
    existing=$(curl -sf -H "$AUTH" "$SONARR_URL/api/v3/rootfolder")
    if ! echo "$existing" | grep -q "/tv"; then
      echo "Adding root folder /tv..."
      curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
        -d '{"path":"/tv"}' "$SONARR_URL/api/v3/rootfolder" || echo "WARN: root folder failed"
    fi

    # Download clients. Owned like the NZBgeek indexer below: an existing
    # entry (by name) is PUT back, a missing one POSTed, so a setting
    # changed here reaches the persisted DB.
    #
    # removeCompletedDownloads is off when a client is added through the
    # API (the UI defaults it on). /downloads and /tv are different
    # volumes, so every import is a copy, and nothing else ever deletes
    # the staging one: 2026-10-24 the downloads volume filled with 130 GB
    # of imported episodes. With it on, usenet grabs go as soon as they
    # are imported; a torrent only once transmission reports it stopped,
    # which is the seed goal its indexer carries (prowlarr/configmap.yaml:
    # public trackers get one, IPTorrents none, so those seed on).
    existing=$(curl -sf -H "$AUTH" "$SONARR_URL/api/v3/downloadclient")
    download_client() {  # name, body
      eid=$(printf '%s\n' "$existing" | awk -v n="$1" \
        '$0 == "    \"name\": \"" n "\"," { hit = 1 } hit && /^    "id": / { gsub(/[^0-9]/, ""); print; exit }')
      if [ -n "$eid" ]; then
        echo "Refreshing $1 download client (id $eid)..."
        curl -sf -o /dev/null -X PUT -H "$AUTH" -H "Content-Type: application/json" \
          -d "${2%\}}, \"id\": $eid}" "$SONARR_URL/api/v3/downloadclient/$eid" || echo "WARN: $1 refresh failed"
      else
        echo "Adding $1 download client..."
        curl -sf -o /dev/null -X POST -H "$AUTH" -H "Content-Type: application/json" \
          -d "$2" "$SONARR_URL/api/v3/downloadclient" || echo "WARN: $1 client failed"
      fi
    }
    download_client NZBget '{
        "enable": true,
        "protocol": "usenet",
        "priority": 1,
        "removeCompletedDownloads": true,
        "removeFailedDownloads": true,
        "name": "NZBget",
        "implementation": "Nzbget",
        "configContract": "NzbgetSettings",
        "fields": [
          {"name": "host", "value": "nzbget"},
          {"name": "port", "value": 6789},
          {"name": "username", "value": ""},
          {"name": "password", "value": ""},
          {"name": "tvCategory", "value": "Series"},
          {"name": "useSsl", "value": false}
        ]
      }'
    # tvCategory is Sonarr's default for Transmission, pinned so a PUT
    # cannot move the subdirectory under /downloads/completed.
    download_client Transmission '{
        "enable": true,
        "protocol": "torrent",
        "priority": 1,
        "removeCompletedDownloads": true,
        "removeFailedDownloads": true,
        "name": "Transmission",
        "implementation": "Transmission",
        "configContract": "TransmissionSettings",
        "fields": [
          {"name": "host", "value": "transmission"},
          {"name": "port", "value": 9091},
          {"name": "tvCategory", "value": "tv-sonarr"},
          {"name": "useSsl", "value": false}
        ]
      }'

    # Torrent indexers are not added here: Prowlarr (k8s/apps/prowlarr)
    # holds them and pushes one entry per indexer into Sonarr through the
    # application registered below. Jackett and its per-id Torznab loop
    # retired 2026-10-21 (talos-config-6t21).
    #
    # NZBgeek indexer (Newznab/usenet), the one indexer this configurator
    # still owns: an existing one is PUT back so the categories and a
    # rotated key in the secret reach the persisted DB; a missing one is
    # POSTed. The id is the last top-level key of each object in Sonarr's
    # pretty-printed list; nested names sit deeper.
    #
    # Categories: Sonarr picks `categories` or `animeCategories` by the
    # series type. 5070 (TV/Anime) sits in both because some trackers
    # (IPTorrents) file anime only under their Anime category — a show
    # left as `standard` type got zero IPT results while the indexer's
    # own search found them (2026-10-10). animeStandardFormatSearch makes
    # anime-type searches also ask for SxxExx, which is how those
    # trackers title releases; absolute-number-only queries miss them.
    # The Prowlarr application below carries the same three settings for
    # the pushed torrent entries.
    existing=$(curl -sf -H "$AUTH" "$SONARR_URL/api/v3/indexer")
    if [ -n "$NZBGEEK_API_KEY" ]; then
      name="NZBgeek"
      body='{
        "enableRss": true,
        "enableAutomaticSearch": true,
        "enableInteractiveSearch": true,
        "protocol": "usenet",
        "priority": 10,
        "name": "'"$name"'",
        "implementation": "Newznab",
        "configContract": "NewznabSettings",
        "fields": [
          {"name": "baseUrl", "value": "https://api.nzbgeek.info"},
          {"name": "apiPath", "value": "/api"},
          {"name": "apiKey", "value": "'"$NZBGEEK_API_KEY"'"},
          {"name": "categories", "value": [5030, 5040, 5070]},
          {"name": "animeCategories", "value": [5070]},
          {"name": "animeStandardFormatSearch", "value": true}
        ]
      }'
      eid=$(printf '%s\n' "$existing" | awk -v n="$name" \
        '$0 == "    \"name\": \"" n "\"," { hit = 1 } hit && /^    "id": / { gsub(/[^0-9]/, ""); print; exit }')
      if [ -n "$eid" ]; then
        echo "Refreshing $name indexer (id $eid)..."
        curl -sf -o /dev/null -X PUT -H "$AUTH" -H "Content-Type: application/json" \
          -d "${body%\}}, \"id\": $eid}" "$SONARR_URL/api/v3/indexer/$eid" || echo "WARN: $name refresh failed"
      else
        echo "Adding $name indexer..."
        curl -sf -o /dev/null -X POST -H "$AUTH" -H "Content-Type: application/json" \
          -d "$body" "$SONARR_URL/api/v3/indexer" || echo "WARN: $name indexer failed"
      fi
    fi

    # Register with Prowlarr (k8s/apps/prowlarr) as an application, so it
    # pushes its indexers into Sonarr. The pairing is driven from this
    # side because Sonarr's key is generated on first start and lives
    # only in config.xml, while Prowlarr's is sealed in git. Same owner
    # semantics as the indexers: PUT an existing entry (a fresh Sonarr
    # volume means a new key), POST a missing one. Prowlarr validates the
    # POST against Sonarr live, and its own allowed-hosts restart may be
    # in flight, so retry a while. Optional: no secret, no pairing.
    #
    # syncCategories / animeSyncCategories / syncAnimeStandardFormatSearch
    # become `categories` / `animeCategories` / `animeStandardFormatSearch`
    # on every indexer Prowlarr pushes — the anime finding of 2026-10-10
    # (see the NZBgeek comment above) now lives here, since the Torznab
    # entries that carried it were Jackett's. minimumSeeders comes from
    # Prowlarr's app profile (Standard: 1), as before.
    if [ -n "$PROWLARR_API_KEY" ]; then
      PROWLARR_URL="http://prowlarr:9696"
      PAUTH="X-Api-Key: $PROWLARR_API_KEY"
      name="Sonarr"
      body='{
        "name": "'"$name"'",
        "syncLevel": "fullSync",
        "implementation": "Sonarr",
        "configContract": "SonarrSettings",
        "fields": [
          {"name": "prowlarrUrl", "value": "'"$PROWLARR_URL"'"},
          {"name": "baseUrl", "value": "http://sonarr:8989"},
          {"name": "apiKey", "value": "'"$API_KEY"'"},
          {"name": "syncCategories", "value": [5030, 5040, 5070]},
          {"name": "animeSyncCategories", "value": [5070]},
          {"name": "syncAnimeStandardFormatSearch", "value": true}
        ],
        "tags": []
      }'
      n=0
      until apps=$(curl -sf -H "$PAUTH" "$PROWLARR_URL/api/v1/applications"); do
        n=$((n + 1))
        if [ "$n" -ge 18 ]; then echo "WARN: Prowlarr unreachable, pairing skipped"; break; fi
        sleep 10
      done
      if [ "$n" -lt 18 ]; then
        eid=$(printf '%s\n' "$apps" | awk -v n="$name" \
          '$0 == "    \"name\": \"" n "\"," { hit = 1 } hit && /^    "id": / { gsub(/[^0-9]/, ""); print; exit }')
        if [ -n "$eid" ]; then
          echo "Refreshing Prowlarr application $name (id $eid)..."
          curl -sf -o /dev/null -X PUT -H "$PAUTH" -H "Content-Type: application/json" \
            -d "${body%\}}, \"id\": $eid}" "$PROWLARR_URL/api/v1/applications/$eid" || echo "WARN: Prowlarr $name refresh failed"
        else
          echo "Registering with Prowlarr as $name..."
          n=0
          until curl -sf -o /dev/null -X POST -H "$PAUTH" -H "Content-Type: application/json" \
            -d "$body" "$PROWLARR_URL/api/v1/applications"; do
            n=$((n + 1))
            if [ "$n" -ge 18 ]; then echo "WARN: Prowlarr $name pairing failed"; break; fi
            sleep 10
          done
        fi
      fi
    fi

    echo "Sonarr configuration complete!"
    sleep infinity
