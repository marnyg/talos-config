# App state (sonarr.db: series list, monitored flags, history) on the
# default longhorn class, RWO 2 replicas, per ADR-0011. Was an emptyDir
# until 2026-10-03, which cost the series list on every restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1
  # RWO /config: the replacement pod cannot attach while the old one
  # holds the volume on another node (Multi-Attach), so no rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      # PSS restricted, same shape as nzbget: everything runs as 1000 (the
      # linuxserver image's non-root mode; PUID/PGID dropped), s6-overlay
      # gets a 1000-owned /run via the scratch subdir. The /tv and
      # /downloads PVC roots must already be 1000-owned (they are);
      # fsGroup makes the fresh ext4 /config volume writable by 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config
          # Helper pin: one tag across k8s/apps (rg 'image: busybox').
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /scratch/run
              # Seed only on a fresh volume: Sonarr owns config.xml after
              # that (ApiKey, UI settings), so it is not rewritten per start.
              [ -f /config/config.xml ] && exit 0
              cat > /config/config.xml << 'XMLEOF'
              <Config>
                <Port>8989</Port>
                <BindAddress>*</BindAddress>
                <AuthenticationMethod>External</AuthenticationMethod>
                <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>
              </Config>
              XMLEOF
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scratch
              mountPath: /scratch
      containers:
        - name: sonarr
          image: ghcr.io/linuxserver/sonarr:4.0.20
          ports:
            - containerPort: 8989
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scratch
              mountPath: /run
              subPath: run
            - name: tv
              mountPath: /tv
            - name: downloads
              mountPath: /downloads
          readinessProbe:
            httpGet:
              path: /ping
              port: 8989
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: configurator
          # ships curl + sh, so no root apk install at start
          # Helper pin: one tag across k8s/apps (rg 'image: curlimages/curl').
          image: curlimages/curl:8.22.0
          command: ["/bin/sh", "/scripts/configure.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: NZBGEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nzbgeek
                  key: apiKey
            - name: JACKETT_INDEXERS
              valueFrom:
                configMapKeyRef:
                  name: jackett-config
                  key: indexers
            - name: JACKETT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jackett
                  key: apiKey
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: scratch
          emptyDir: {}
        - name: scripts
          configMap:
            name: sonarr-configurator
        - name: tv
          persistentVolumeClaim:
            claimName: tv
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
spec:
  selector:
    app: sonarr
  ports:
    - port: 8989
      targetPort: 8989
