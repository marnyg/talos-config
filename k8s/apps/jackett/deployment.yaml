apiVersion: apps/v1
kind: Deployment
metadata:
  name: jackett
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jackett
  template:
    metadata:
      labels:
        app: jackett
    spec:
      initContainers:
        - name: config
          # Helper pin: one tag across k8s/apps (rg 'image: busybox').
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /config/Jackett
              cp /template/ServerConfig.json /config/Jackett/ServerConfig.json
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-template
              mountPath: /template
      containers:
        - name: jackett
          image: ghcr.io/linuxserver/jackett:0.24.2780
          ports:
            - containerPort: 9117
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: AUTO_UPDATE
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: 9117
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: configurator
          # enables the indexers listed in jackett-config via Jackett's API;
          # same sidecar shape as sonarr/radarr
          # Helper pin: one tag across k8s/apps (rg 'image: curlimages/curl').
          image: curlimages/curl:8.22.0
          command: ["/bin/sh", "/template/configure.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: JACKETT_INDEXERS
              valueFrom:
                configMapKeyRef:
                  name: jackett-config
                  key: indexers
            # iptorrents is cookie-auth; optional so a missing/unsealed secret
            # degrades to "WARN: iptorrents skipped" instead of blocking the
            # pod (and so the public indexers).
            - name: IPTORRENTS_COOKIE
              valueFrom:
                secretKeyRef:
                  name: iptorrents
                  key: cookie
                  optional: true
            - name: IPTORRENTS_USER_AGENT
              valueFrom:
                secretKeyRef:
                  name: iptorrents
                  key: userAgent
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: config-template
              mountPath: /template
      volumes:
        - name: config
          emptyDir: {}
        - name: config-template
          configMap:
            name: jackett-config
---
apiVersion: v1
kind: Service
metadata:
  name: jackett
  namespace: media
spec:
  selector:
    app: jackett
  ports:
    - port: 9117
      targetPort: 9117
