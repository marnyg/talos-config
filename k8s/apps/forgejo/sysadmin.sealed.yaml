# Forgejo's break-glass local admin (bootstrap.md step 1), kept as a
# sealed secret no pod mounts: a vault entry, readable only through the
# wallet-gated kubeconfig —
#   kubectl -n forgejo get secret forgejo-sysadmin -o jsonpath='{.data.password}' | base64 -d
# Everything else signs in with the wallet (auth source `siwe`); this is
# for when siwe-oidc is down. Rotate: change it in Forgejo (or
# `forgejo admin user change-password`), reseal with kubeseal --cert
# talos/clusters/homelab/sealed-secrets.crt.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-sysadmin
  namespace: forgejo
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: forgejo-sysadmin
      namespace: forgejo
