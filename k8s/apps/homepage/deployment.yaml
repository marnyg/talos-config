# Homepage (gethomepage.dev): the landing page for the cluster — one
# tile per exposed service, grouped, with a status dot from the pods
# behind it and a cluster CPU/memory strip on top. It is the "where is
# everything" page; Gatus (k8s/apps/gatus) is the "is everything up"
# page and Grafana the "what is it doing" one.
#
# Same posture as Gatus: stateless, every byte of configuration is in
# git (config.yaml) and the service list is read live from Ingress
# annotations, so the pod holds nothing git cannot recreate. No
# volume. The per-app widgets Homepage can show (Sonarr queue, Jellyfin
# now-playing, ArgoCD app health, ...) each need an API key, i.e. a
# SealedSecret and a HOMEPAGE_VAR_* reference per app — deliberately
# not in v1 (bead 1t97); links + pod status + cluster widget only.
#
# The image runs its Node server as uid 1000 (the image's own owner of
# /app); PUID/PGID stay unset so the entrypoint does no chown and just
# execs. Root fs read-only: the only writes are its log file under
# /app/config/logs (emptyDir mounted over the ConfigMap dir). Homepage
# also wants to copy every file of its skeleton into /app/config when
# missing, so the ConfigMap pre-seeds the full set (config.yaml).
#
# Readiness probes /api/services, not /api/healthcheck: healthcheck
# answers before the config is touched, and some skeleton copies are
# lazy (first /api/services call), so a pod with a bad config went
# Ready and crashed on the first page load. Liveness stays cheap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          # Pinned by digest; the v2.6.0 tag (latest release) resolved
          # on 2026-10-17.
          image: ghcr.io/gethomepage/homepage:v2.6.0@sha256:3e38fe788223cb46a3ce1f046ef11667b40f7707fdca0dcbfa3f86c5c42bf1e8
          env:
            # Host-header allow-list (400 otherwise). ingress-nginx
            # forwards the Ingress host; the probe below sets the same.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: dash.gw.mesh.internal,dash.gw.mesh.internal:80
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /app/config/logs
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/services
              port: 3000
              httpHeaders:
                - name: Host
                  value: dash.gw.mesh.internal
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
              httpHeaders:
                - name: Host
                  value: dash.gw.mesh.internal
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app: homepage
  ports:
    - port: 3000
      targetPort: 3000
