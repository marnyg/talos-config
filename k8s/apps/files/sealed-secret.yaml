# The SMB account `mar`, sealed to the cluster's sealed-secrets key pair
# like jellyfin-admin. The key is the image's own convention: it reads
# every ACCOUNT_<user> env var and runs smbpasswd for it at start, so
# the secret is injected with envFrom (deployment.yaml) and no file is
# ever written.
#
# This is password auth on the LAN, not the wallet — a deliberate,
# temporary exception: the share is unreachable from outside the LAN
# or the pod network, and the pod is scaled to 0 once the transfer is
# done (the PVC stays; the class is Retain).
#
# Retrieve for the Windows side:
#   kubectl -n files get secret samba-users -o jsonpath='{.data.ACCOUNT_mar}' | base64 -d
# Rotate: new value, reseal (kubeseal --cert
# talos/clusters/homelab/sealed-secrets.crt), restart the pod.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: samba-users
  namespace: files
spec:
  encryptedData:
    ACCOUNT_mar: 
  template:
    metadata:
      name: samba-users
      namespace: files
