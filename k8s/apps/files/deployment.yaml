# A general transfer share on the user-files class (ADR-0031,
# `longhorn-user`: two replicas on different nodes). It started as the
# data dump from the Windows PC before it became node w2 (dsuj,
# 2026-10-19 — that data was declared expendable and never moved), and
# is now **permanent**: the drive every Windows VM on the cluster maps
# (win2k25 maps it as T: at first logon from its answer file). It began
# on longhorn-bulk (2026-10-04) and moved the next day when the library
# dropped to one replica: this is the one volume here whose bytes are
# not re-downloadable.
#
# Two ways in, one daemon:
#   - any Windows machine on the LAN: \\10.0.0.74\transfer —
#     hostPort 445 on nas1, where the replicas already live. The
#     Windows SMB client dials port 445 only (a /TCPPORT option exists
#     from Win11 24H2, not relied on), hence hostPort rather than a
#     NodePort, hence the privileged namespace. Nothing uses this path
#     today (the PC is gone); it stays for the next laptop or phone.
#   - KubeVirt guests (masquerade networking, so they see Services):
#     \\samba.files.svc.cluster.local\transfer over the ClusterIP.
#
# RWO, not RWX: nothing mounts this volume but samba; VMs and the PC
# reach it over SMB. That keeps the share-manager NFS hop out of the
# path; the nodeSelector pins the pod to nas1, which hostPort needs,
# and the volume attaches there whichever nodes hold its replicas.
#
# Files land as uid/gid 1000 (`mar`, the same ids the media apps run
# as), so a pod can read them later without a chown. Strategy Recreate:
# RWO + hostPort both forbid two pods at once.
#
# Stopping it means committing `replicas: 0` here: a live `kubectl
# scale` is undone by ArgoCD's selfHeal within seconds (or pause the
# app first, as scripts/encrypt-pvc.sh does). Either way the PVC and its
# data stay, and every VM's T: breaks. Grow it by raising the request —
# up only.
#
# On `longhorn-encrypted` since 2026-10-20 (the first volume moved
# there; scripts/encrypt-pvc.sh, one rsync of 15.4 G): two replicas on
# different nodes' NVMe, dm-crypt under the cluster passphrase, nightly
# ciphertext backup to Tigris via the `backup` group the class joins.
# Earlier that day it had gone from the `longhorn-user` class ADR-0031
# made for it to the plain default, by PV relabel. volumeName pins the
# claim to the encrypted PV: storageClassName is immutable, so every
# move is delete-and-rebind, and a claim recreated WITHOUT volumeName
# would be a new, empty volume. The previous, unencrypted PV
# (pvc-3355e94b…, Retain, label encrypt-pvc/old) is the safety net
# until the first Tigris backup is verified, then deleted.
#
# This claim is the only live copy of those bytes, so:
#   - ArgoCD may never prune or delete it (sync-options below); a
#     renamed directory or a bad manifest leaves it standing.
#   - The `transfer` recurring-job group gets daily Longhorn snapshots
#     (k8s/apps/storage/recurringjob.yaml) — an undo for a wrong delete
#     over SMB, inside the volume. The off-site copy is the `backup`
#     group's nightly job to Tigris (bsj).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transfer
  namespace: files
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    recurring-job-group.longhorn.io/transfer: enabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-encrypted
  volumeName: pvc-e74ad799-7000-4e27-a2a2-640bf7f4cc62
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: files
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas1
      # ext4 on a Longhorn block device: kubelet chgrps the root to
      # 1000 on mount, so `mar` can write the top level.
      securityContext:
        fsGroup: 1000
      containers:
        - name: samba
          # smbd-only variant: no avahi, wsdd2 or nmbd — the PC and the
          # VMs address the server by IP/name, discovery adds nothing.
          image: ghcr.io/servercontainers/samba:smbd-only-a3.24.2-s4.23.8-r0
          ports:
            - name: smb
              containerPort: 445
              hostPort: 445
          envFrom:
            - secretRef:
                name: samba-users # ACCOUNT_mar
          env:
            - name: UID_mar
              value: "1000"
            - name: SAMBA_CONF_WORKGROUP
              value: WORKGROUP
            - name: SAMBA_CONF_SERVER_STRING
              value: nas1 transfer share
            - name: SAMBA_CONF_LOG_LEVEL
              value: "1"
            # The image turns `;` into newlines inside smb.conf.
            - name: SAMBA_VOLUME_CONFIG_transfer
              value: "[transfer]; path = /shares/transfer; valid users = mar; guest ok = no; read only = no; browseable = yes; create mask = 0664; directory mask = 0775"
          volumeMounts:
            - name: transfer
              mountPath: /shares/transfer
          readinessProbe:
            tcpSocket:
              port: 445
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: transfer
          persistentVolumeClaim:
            claimName: transfer
---
# For in-cluster Windows VMs (masquerade → pod network → ClusterIP).
apiVersion: v1
kind: Service
metadata:
  name: samba
  namespace: files
spec:
  selector:
    app: samba
  ports:
    - name: smb
      port: 445
      targetPort: 445
