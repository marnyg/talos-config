# Prowlarr's own API key (kubeseal, see Rotate below). Seeded into
# config.xml by the deployment's init container on a fresh volume, so
# the key is known in git (sealed) rather than generated on first start:
# the sonarr/radarr configurators need it to register themselves as
# Prowlarr applications (PROWLARR_API_KEY), and a known key survives a
# volume loss without re-pairing anything.
#
# Rotate: new key, reseal (kubeseal --cert
# talos/clusters/homelab/sealed-secrets.crt), then also replace
# <ApiKey> in /config/config.xml on the volume (the seed is one-shot)
# and restart prowlarr, sonarr and radarr.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: prowlarr
  namespace: media
spec:
  encryptedData:
    apiKey: 
  template:
    metadata:
      name: prowlarr
      namespace: media
---
# IPTorrents browser session cookie + the User-Agent it was issued to:
# the tracker login has a captcha, so Prowlarr (configure.sh, the
# `iptorrents` definition) authenticates with the cookie instead.
# Moved verbatim from the retired indexer app (2026-10-21, 6t21);
# sealed data is bound to name+namespace, both unchanged. When the
# session expires, grab a fresh cookie + UA from the browser, reseal
# both keys, then restart the prowlarr pod to re-run the seed.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: iptorrents
  namespace: media
spec:
  encryptedData:
    cookie: 
    userAgent: 
  template:
    metadata:
      name: iptorrents
      namespace: media
