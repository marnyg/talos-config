# Prowlarr's own API key, sealed like the jackett one. Seeded into
# config.xml by the deployment's init container on a fresh volume, so
# the key is known in git (sealed) rather than generated on first start:
# the sonarr/radarr configurators need it to register themselves as
# Prowlarr applications (PROWLARR_API_KEY), and a known key survives a
# volume loss without re-pairing anything.
#
# Rotate: new key, reseal (kubeseal --cert
# talos/clusters/homelab/sealed-secrets.crt), then also replace
# <ApiKey> in /config/config.xml on the volume (the seed is one-shot)
# and restart prowlarr, sonarr and radarr.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: prowlarr
  namespace: media
spec:
  encryptedData:
    apiKey: 
  template:
    metadata:
      name: prowlarr
      namespace: media
