# The mesh-facing reverse proxy: one hostname per service
# (jellyfin.cp1.mesh.internal, …) instead of remembered ports — hub
# DNS resolves any <service>.<member> name to the member, so exposure
# is Ingress-only. Replaces the
# tailscale operator/ingressClass — access control moves to SIWE SSO
# (sketch 162c630d), transport stays nebula, and no hosted account sits
# in the access path (invariant 3).
#
# hostNetwork on the single node: the controller owns :80 on every
# interface (mesh + LAN), so service names need no NodePort. Plain HTTP
# by design — nebula encrypts the wire; HTTPS arrives with the
# wallet-derived CA (task refs 162c630d, deferred).
#
# Mesh v3 (P2.3, talos-config-359.9.3): the identity plane reaches this
# controller through the gateway pod (k8s/apps/gateway) over the
# ClusterIP Service below, Host untouched, with the caller's verified
# identity in X-Mesh-Node/Name/Groups. Until hostNetwork goes (the
# rest of ingress off nebula), any LAN device can hit :80 directly and
# write those headers itself (talos-config-1gv) — so nginx honours them
# only from the pod network (the gateway's side) and blanks them from
# everywhere else: geo on the real peer address, proxy-set-headers from
# the mapped variables (mesh-identity-headers ConfigMap).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.*"
    helm:
      valuesObject:
        controller:
          kind: DaemonSet
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          service:
            enabled: true
            type: ClusterIP
          publishService:
            enabled: false
          config:
            http-snippet: |
              geo $remote_addr $mesh_from_pod { default 0; 10.244.0.0/16 1; }
              map $mesh_from_pod $mesh_node   { 1 $http_x_mesh_node;   default ""; }
              map $mesh_from_pod $mesh_name   { 1 $http_x_mesh_name;   default ""; }
              map $mesh_from_pod $mesh_groups { 1 $http_x_mesh_groups; default ""; }
            proxy-set-headers: ingress-nginx/mesh-identity-headers
          ingressClassResource:
            default: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Talos enforces the baseline PSS on workload namespaces; hostNetwork
    # needs privileged. Scoped to this namespace only.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
