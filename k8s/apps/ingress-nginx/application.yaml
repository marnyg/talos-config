# The mesh-facing reverse proxy: one hostname per service
# (jellyfin.cp1.mesh.internal, …) instead of remembered ports — hub
# DNS resolves any <service>.<member> name to the member, so exposure
# is Ingress-only. Replaces the
# tailscale operator/ingressClass — access control moves to SIWE SSO
# (sketch 162c630d), transport stays nebula, and no hosted account sits
# in the access path (invariant 3).
#
# hostNetwork on the single node: the controller owns :80 on every
# interface (mesh + LAN), so service names need no NodePort. Plain HTTP
# by design — nebula encrypts the wire; HTTPS arrives with the
# wallet-derived CA (task refs 162c630d, deferred).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.*"
    helm:
      valuesObject:
        controller:
          kind: DaemonSet
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          service:
            enabled: false
          publishService:
            enabled: false
          ingressClassResource:
            default: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Talos enforces the baseline PSS on workload namespaces; hostNetwork
    # needs privileged. Scoped to this namespace only.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
