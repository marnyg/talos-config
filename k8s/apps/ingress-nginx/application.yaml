# The mesh-facing reverse proxy: one hostname per service
# (jellyfin.gw.mesh.internal, …) instead of remembered ports — the
# gateway pod (k8s/apps/gateway) forwards <service>.gw names here with
# Host intact, so exposure is Ingress-only. Replaces the
# tailscale operator/ingressClass — access control moves to SIWE SSO
# (sketch 162c630d), transport is the identity stream the gateway
# terminates, and no hosted account sits in the access path
# (invariant 3).
#
# Reachable only through the gateway (Mesh v3 P2.3,
# talos-config-359.9.3): a plain ClusterIP Service, no hostNetwork, no
# NodePort, no LoadBalancer — the gateway dials it by Service name and
# is the only thing that does. That is what makes X-Mesh-Node/Name/
# Groups trustworthy past the gateway: nothing on the LAN can reach
# this controller to forge them (talos-config-1gv closed for good with
# xnat; the geo/map gate that blanked the headers from non-pod sources
# while hostNetwork lasted went with it). Plain HTTP by design — the
# QUIC stream encrypts the wire. Browser HTTPS is terminated on the
# device, never here (ADR-0033): the daemon says X-Forwarded-Proto:
# https, the gateway honours it, and use-forwarded-headers below makes
# the controller pass it to the apps instead of stamping its own
# scheme. Safe for the same reason the identity headers are: the
# gateway is the only caller and it sets or strips what it forwards.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.*"
    helm:
      valuesObject:
        controller:
          service:
            type: ClusterIP
          config:
            use-forwarded-headers: "true"
            # The group gate (ADR-0032) as the default: every Ingress
            # gets an auth_request subrequest to the SIWE bridge's
            # /authz for group admins unless it opts out with
            # nginx.ingress.kubernetes.io/enable-global-auth: "false"
            # (k8s/apps/media/ingress.yaml explains the mechanism). An
            # Ingress added without thinking about access is therefore
            # admins-only, not open; a per-Ingress auth-url still takes
            # precedence when an app needs another group.
            global-auth-url: http://siwe-oidc.sso.svc.cluster.local/authz?group=admins
          ingressClassResource:
            default: true
          # Per-Ingress request rate, latency and status codes for every
          # *.gw name, scraped by kube-prometheus-stack
          # (k8s/apps/monitoring). :10254 is a separate ClusterIP
          # Service, still only reachable in-cluster.
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          # HA sweep slice 2 (talos-config-9l67): the controller is
          # stateless, so two replicas on distinct nodes keep every
          # *.gw name up through a node loss — the gateway dials the
          # Service, and a NotReady node's pod leaves the endpoints
          # within the node-monitor grace period. Required, not
          # preferred: a second replica on the same node buys nothing.
          # The chart adds a PDB (minAvailable 1) once replicaCount > 1.
          # maxUnavailable 1: with replicas == schedulable nodes, a
          # rollout's surge pod has nowhere to go and the default
          # (25% -> 0) never retires an old pod — seen on this change's
          # own rollout with w1 out. Retiring one first frees a node.
          replicaCount: 2
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 1
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ingress-nginx
                      app.kubernetes.io/component: controller
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Back to Talos's default level: the controller binds :80 as uid
    # 101 with NET_BIND_SERVICE, which baseline permits. Set explicitly
    # rather than dropped so ArgoCD downgrades the label it once raised
    # to privileged for hostNetwork.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
