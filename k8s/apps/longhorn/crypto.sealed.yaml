# Longhorn volume-encryption passphrase, sealed to the cluster's
# sealed-secrets key pair (talos-config-9io, 2026-10-23). Source of
# truth is talos/clusters/homelab/longhorn-crypto-secrets.yaml (age in
# git, plaintext gitignored); this file is `kubeseal --cert
# talos/clusters/homelab/sealed-secrets.crt < that`. The
# `longhorn-encrypted` StorageClass (k8s/apps/storage/storageclass.yaml)
# names this Secret for provision/stage/publish/expand; the CSI plugin
# opens each volume's LUKS header with it on the node.
#
# On a rebuilt cluster the sealed-secrets key is restored from its own
# .age (inlineManifests), so this unseals to the same passphrase and the
# Tigris backups (ciphertext under it) restore. Do not rotate casually:
# LUKS keyslots are per volume, a new value opens nothing.
#
# Hygiene: longhorn-csi-plugin logs CRYPTO_KEY_VALUE verbatim in its
# NodePublishVolume line (seen 2026-10-23, Longhorn 1.12.0). Alloy drops
# that line before Loki (k8s/apps/monitoring); node-local container
# logs sit on the encrypted EPHEMERAL partition.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: longhorn-crypto
  namespace: longhorn-system
spec:
  encryptedData:
    CRYPTO_KEY_CIPHER: 
    CRYPTO_KEY_HASH: 
    CRYPTO_KEY_PROVIDER: 
    CRYPTO_KEY_SIZE: 
    CRYPTO_KEY_VALUE: 
    CRYPTO_PBKDF: 
  template:
    metadata:
      name: longhorn-crypto
      namespace: longhorn-system
