# Replicated block storage (ADR-0011). Longhorn replaces the hostPath
# PVs + preserved `u-media` volume that ADR-0008 built for a one-node
# cluster: volumes follow pods instead of pinning them, and app state
# (sonarr/radarr/jellyfin metadata) becomes durable, which is the data
# that actually hurts to lose.
#
# Node prerequisites, all of which must be true BEFORE this syncs:
#   - factory schematic 6a9acc… (iscsi-tools + util-linux-tools);
#     talos/hardware/*.yaml
#   - a `longhorn` user volume mounted at /var/mnt/longhorn
#   - kubelet extraMounts for that path with `rshared`; see the machine
#     patches for why propagation, not just visibility, is required
#   - the node labeled node.longhorn.io/create-default-disk=true
#
# Version is pinned EXACTLY, unlike ingress-nginx's "4.*". A storage
# engine upgrade migrates on-disk replica formats and wants its release
# notes read first; drifting to whatever the chart repo published today
# is not a thing to do unattended.
#
# The UI (longhorn-frontend, no auth of its own) is exposed over the
# mesh behind the wallet by ingress.yaml next to this file.
#
# Deletion hazard: removing this Application (or renaming the directory)
# cascades to the CRDs, and the Volume/Replica CRs are the only record of
# where replica data lives. Invariant 2 classifies that bookkeeping as
# data-plane state whose durability is a backup problem. Since
# 2026-10-20 that backup exists (defaultBackupStore below, bsj) for the
# encrypted class only; a volume still on the plain class has no copy
# outside the cluster. Do not delete this Application casually.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.12.0
    helm:
      valuesObject:
        # The chart ships a `longhorn-pre-upgrade` Job as a Helm
        # pre-upgrade hook, which ArgoCD maps to a PreSync hook. PreSync
        # runs before the main wave, so the Job is created before its
        # own ServiceAccount exists and wedges the sync:
        #   pods "longhorn-pre-upgrade-" is forbidden: error looking up
        #   service account longhorn-system/longhorn-service-account
        # On a fresh install it has nothing to check regardless.
        #
        # Cost of disabling: chart upgrades lose the built-in
        # eligibility guard (version skew, degraded volumes). Acceptable
        # only because targetRevision is pinned exactly — upgrades here
        # are a deliberate act, and the check can be run by hand first.
        preUpgradeChecker:
          jobEnabled: false
        # Scraped by kube-prometheus-stack (k8s/apps/monitoring): volume
        # robustness, replica placement, disk capacity per node. The
        # ServiceMonitor renders only once the Operator CRDs exist.
        metrics:
          serviceMonitor:
            enabled: true
        # Off-site backups (bsj, 2026-10-20): a Tigris bucket on fly,
        # S3 API. `auto` is Tigris's region; AWS_ENDPOINTS in the secret
        # points the SDK at fly.storage.tigris.dev. Longhorn 1.9+ keeps
        # the target as a BackupTarget CR named `default`; the chart
        # writes these into it. What gets backed up is decided by the
        # RecurringJob in k8s/apps/storage/recurringjob.yaml (group
        # `backup` = the longhorn-encrypted class), so the bucket only
        # ever holds ciphertext (9io). Poll 300 s = the default.
        defaultBackupStore:
          backupTarget: s3://talos-longhorn-backup@auto/
          backupTargetCredentialSecret: tigris-backup
          pollInterval: 300
        defaultSettings:
          # Talos user volumes mount at /var/mnt/<name>; Longhorn's own
          # default (/var/lib/longhorn) would land on EPHEMERAL.
          defaultDataPath: /var/mnt/longhorn
          # Only nodes explicitly labeled get a default disk. The default
          # (false) would auto-create a disk on EVERY node at
          # defaultDataPath — and on a node without the user volume that
          # path is an ordinary directory on EPHEMERAL, so replicas would
          # silently land on the 200GiB scratch partition and die with
          # the next reinstall. Fail closed instead.
          createDefaultDiskLabeledNodes: true
          # The backing volume is dedicated to Longhorn, so the 30%
          # default reserve protects nothing and costs ~90GiB on cp1.
          # storageMinimalAvailablePercentage still guards against
          # filling it completely.
          storageReservedPercentageForDefaultDisk: 0
          storageMinimalAvailablePercentage: 10
          # Blocks pulled in parallel per restore from Tigris (default 2).
          # A restore is latency-bound, not bandwidth-bound: at 2 the first
          # restore test ran ~6 MB/s, ~50 min for transfer's 19 GB
          # (2026-10-20). This is disaster-recovery time and the weekly
          # restore test's runtime (k8s/apps/backup-verify). Backups stay
          # at the default: they are uplink-bound (~4-5 MB/s) regardless.
          restoreConcurrentLimit: 8
          # Back up detached volumes too: Longhorn attaches them for the
          # job and detaches after. Default false skips them silently —
          # media/libation-db (mounted only while its CronJob runs) got no
          # backup from the first backup-nightly run; LonghornBackupStale
          # would have paged a day later (2026-10-20). Same for any app
          # scaled to 0, which is exactly when its state is idle and must
          # still be in the bucket.
          allowRecurringJobWhileVolumeDetached: true
          # Keep a replica on whichever node runs the pod: this is what
          # makes the read path local and removes the hostPath
          # nodeAffinity hazard (bug 0b374653) by design rather than by
          # pinning.
          defaultDataLocality: best-effort
          # A node that goes away takes its RWO volumes' pods with it:
          # Kubernetes leaves them Terminating on the unreachable node
          # forever, the VolumeAttachment stays, and the replacement pod
          # sits ContainerCreating on a healthy replica it may not
          # attach. w1 off 2026-09-21 held the gateway (and every
          # *.gw.mesh.internal name) and the win2k25 VM that way for 8
          # days until an out-of-service taint was applied by hand
          # (talos-config-9l67). The chart default is do-nothing; with
          # this Longhorn force-deletes the terminating pod once it sees
          # the node down, releases the volume, and the pod reschedules.
          # Pods WITHOUT a Longhorn volume are not Longhorn's to touch
          # (argocd-application-controller: pinned to the control plane
          # instead, k8s/apps/argocd/controller-patch.yaml).
          nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
        persistence:
          # Not the cluster default since 2026-10-20: that is
          # `longhorn-encrypted` (k8s/apps/storage/storageclass.yaml).
          # This plain class is the opt-in for bytes that want neither
          # encryption nor an off-site copy (VM ISOs, caches). The
          # replica/locality/selector settings below still define it.
          defaultClass: false
          # Two replicas for app state on the default (nvme) class, across
          # the three nodes: one node loss keeps the data and leaves a
          # third node to rebuild onto (w1 does go away; `9l67`). Three
          # would put a copy on every node and make the smallest disk the
          # fleet's capacity ceiling. Set here rather than via
          # defaultSettings.defaultReplicaCount, which became a per-engine
          # map in 1.10 and only affects UI-created volumes; PVCs take
          # this. The other classes decide their own count
          # (k8s/apps/storage/storageclass.yaml): longhorn-bulk runs the
          # media library at one replica (ADR-0031, amending 0029).
          # files/transfer is on this class too (2026-10-20; the
          # longhorn-user class ADR-0031 made for it is gone).
          defaultClassReplicaCount: 2
          defaultDataLocality: best-effort
          # Fence app state to the NVMe tier (jx78). Since nas1's SATA
          # bays became schedulable (lug3, 2026-10-04) a selector-less
          # PVC could land a replica on spinning disk — two did. Every
          # /var/mnt/longhorn disk is tagged `nvme` (nas1 by its
          # default-disks-config, cp1/w1 by hand + the same annotation
          # in their patches for reinstalls); the bays are `bulk` and
          # only longhorn-bulk selects them. longhorn-manager syncs the
          # default class from the longhorn-storageclass ConfigMap and
          # recreates it on change; existing Volume CRs do not follow
          # and were patched by hand (2026-10-03).
          defaultDiskSelector:
            enable: true
            selector: nvme
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Longhorn's CRDs exceed the 256KB last-applied-configuration
      # annotation limit that client-side apply uses.
      - ServerSideApply=true
    # Talos enforces the baseline PSS on workload namespaces; Longhorn's
    # manager and instance-manager need privileged (host devices, mount
    # namespaces). Scoped to this namespace only, as with ingress-nginx.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
