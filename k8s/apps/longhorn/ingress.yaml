# The Longhorn UI over the mesh, gated behind the wallet like the *arr
# apps (see k8s/apps/media/ingress.yaml for the mechanism). The chart
# ships `longhorn-frontend` with NO authentication of its own, and the
# UI can delete volumes and detach disks — so the group gate is not
# optional here. Until this landed the UI was port-forward only.
#
# Lives next to the chart Application rather than inside its values:
# the chart's own `ingress.*` values render a generic Ingress without
# the auth annotations, and keeping every mesh-exposed host as a plain
# Ingress in git is the convention ("exposing a service = adding an
# Ingress here, nothing else").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-frontend
  namespace: longhorn-system
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://siwe-oidc.sso.svc.cluster.local/authz?group=admins
    # Backup restores / support bundles upload past nginx's 1 MiB default.
    nginx.ingress.kubernetes.io/proxy-body-size: 10000m
spec:
  ingressClassName: nginx
  rules:
    - host: longhorn.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
