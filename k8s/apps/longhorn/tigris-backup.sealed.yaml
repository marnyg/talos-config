# Credentials for the Longhorn backup target (talos-config-bsj,
# 2026-10-23): a Tigris bucket on fly (`talos-longhorn-backup`, org
# personal, S3 API at fly.storage.tigris.dev — AWS_ENDPOINTS is what
# Longhorn's backupstore reads for a non-AWS endpoint). The target URL
# itself is in application.yaml (defaultBackupStore). Sealed like every
# other secret here; the plaintext was piped from `fly storage create`
# straight into kubeseal and never written down.
#
# `fly storage create` attached the bucket to the hub app (the org's
# only app) and set these as fly secrets there, redeploying it; they
# were unset again the same minute — the hub holds no fly secrets.
# Rotate: Tigris console → new key pair → reseal here.
#
# What lands in the bucket is ONLY ciphertext: the backup RecurringJob
# (k8s/apps/storage/recurringjob.yaml) targets the `backup` group,
# which only the `longhorn-encrypted` class joins.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tigris-backup
  namespace: longhorn-system
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_ENDPOINTS: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: tigris-backup
      namespace: longhorn-system
