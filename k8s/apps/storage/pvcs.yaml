# The media library, on Longhorn (ADR-0011). Replaces the three hostPath
# PVs + statically-bound PVCs that ADR-0008 built for a single node.
#
# Renamed from media-tv/media-movies/media-downloads on purpose. The old
# claims set storageClassName: "" with a volumeName pointing at a
# hostPath PV, and both fields are immutable — editing them in place
# makes ArgoCD's apply fail forever. New names let one sync create these,
# roll the deployments onto them, and prune the old pair. The `media`
# namespace already carries the prefix, so media/tv reads better anyway.
#
# ReadWriteMany, not ReadWriteOnce: each of these is mounted by several
# pods (tv by sonarr+jellyfin, downloads by four), which under hostPath
# only worked because they were all on cp1. See storageclass.yaml.
#
# Sizes mean something on Longhorn (hostPath ignored them, so 450Gi of
# claims once sat on a 300GiB partition). Grown 2026-10-04 for the
# library import from the old docker host (343G tv, 92G movies, 50G
# downloads). The class holds one replica on one of nas1's two 4 TB
# bays (ADR-0031; it mirrored across both for a day, ADR-0029), so
# each size counts once against ~3.9 TB per bay. Thin-provisioned; the
# number is a ceiling, and allowVolumeExpansion lets it move again (up
# only).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tv
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-bulk
  resources:
    requests:
      storage: 900Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: movies
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-bulk
  resources:
    requests:
      storage: 400Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-bulk
  resources:
    requests:
      storage: 200Gi
