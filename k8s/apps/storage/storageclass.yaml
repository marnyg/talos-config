# A second StorageClass for bulk media, applying ADR-0011's own thesis
# consistently: durability belongs on app state, not on the library.
#
# The default `longhorn` class (RWO, 2 replicas) stays as-is for
# sonarr/radarr/jellyfin state — small, irreplaceable, worth 2x disk.
# This class is for the opposite kind of data: large, re-downloadable,
# and explicitly declared disposable by ADR-0011.
#
# Placement (2026-10-04, cnb5/lug3): the library lives on nas1's SATA
# tier — the two 4 TB bays, Longhorn disks tagged `bulk` — at ONE
# replica (ADR-0031, 2026-10-05). ADR-0029 had mirrored it across the
# two bays; one day of that showed the price: both replicas on one
# node means every nas1 reboot fails both and rebuilds ~600 GB at
# ~12 MB/s for hours (k8sd), for redundancy against a bay failure the
# library — re-downloadable by ADR-0011 — does not need. nas1 dying
# takes the library offline until it returns (data intact), as it did
# on w1. Before this, one replica sat on w1's NVMe, and w1 off
# 2026-09-21 faulted all three volumes for 12 days unnoticed.
# Capacity: 8 TB usable across the two bays.
#
# files/transfer, the irreplaceable tenant this tier briefly had, moved
# to `longhorn-user` below (two replicas on different nodes) the same
# day.
#
# StorageClass parameters are immutable: changing this file means
# deleting the class so ArgoCD recreates it (bound PVs are unaffected;
# they reference it by name; the share-manager controller re-reads the
# class by name when it creates a pod). Existing volumes do not follow a class
# change either — their Volume CRs are patched to match (replicas,
# diskSelector, affinities); 2026-10-04 that also evicted the w1 replica.
#
# Why RWX matters here (and not for state): six pods share three media
# directories — media-tv is sonarr+jellyfin, media-downloads is
# nzbget+radarr+sonarr+transmission. Under hostPath that worked only
# because every pod sat on cp1. A Longhorn RWO volume attaches to one
# node, so keeping RWO would mean pinning all six pods to a node —
# reintroducing exactly what ADR-0011 chose Longhorn to eliminate. RWX
# volumes get a share-manager pod exporting NFS in-cluster (Talos'
# kernel has nfs/nfs4 built in, verified in /proc/filesystems), so any
# pod on any node can mount them.
#
# The trade accepted: a per-volume share-manager is a single point of
# failure and puts an NFS hop in Jellyfin's streaming path. For a
# disposable library that is the cheaper failure.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-bulk
provisioner: driver.longhorn.io
allowVolumeExpansion: true
volumeBindingMode: Immediate
# Retain, unlike the default class's Delete. ArgoCD runs with
# prune: true, so a bad manifest or a renamed directory could delete
# these PVCs; Retain means that costs a manual PV cleanup instead of the
# library. Disposable is a statement about reinstalls, not about
# tolerating accidents.
reclaimPolicy: Retain
parameters:
  numberOfReplicas: "1"
  diskSelector: "bulk"
  # Relevant only to a volume patched above 1: both replicas may be on
  # one node (nas1 is the only one with `bulk` disks), never on one
  # disk. Values are enabled/disabled/ignored, not
  # booleans: "true"/"false" made every new claim fail with `invalid
  # ReplicaSoftAntiAffinity setting`, unnoticed until the first PVC
  # provisioned through this class (files/transfer, 2026-10-05) — the
  # media volumes had been patched by hand (see above).
  replicaSoftAntiAffinity: "enabled"
  replicaDiskSoftAntiAffinity: "disabled"
  # The NFS server (share-manager pod) sits on the node that holds both
  # replicas. Left to the kube-scheduler it landed on w1 for all three
  # volumes (2026-10-04): every byte then crossed w1's USB gigabit
  # dongle twice — in over NFS, back out to nas1's replicas — capping
  # the library import at ~35 MB/s and putting Jellyfin's stream on the
  # same detour. Pinning costs no availability: nas1 away is the
  # library away regardless. Longhorn reads this when it creates the
  # pod, so an existing share-manager moves only when its pod is
  # deleted (which, with rwx-volume-fast-failover off, also restarts
  # the volume's workload pods so they remount). The mirror image of
  # this pin: the library's consumers carry a nodeAffinity AWAY from
  # nas1 (jellyfin/sonarr/radarr/nzbget/transmission), because a
  # client on the server's node hangs the node's shutdown (m1au).
  shareManagerNodeSelector: "kubernetes.io/hostname:nas1"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  # Disabled rather than best-effort: the replicas are pinned to nas1's
  # bulk tier by the selector; tying placement to wherever the
  # share-manager currently runs would be either a no-op or a request
  # Longhorn cannot satisfy. The NFS hop is the accepted cost.
  dataLocality: "disabled"
---
# A third class for user files (ADR-0031): neither app state (small,
# `longhorn`, two replicas on nvme across nodes) nor the library
# (large, re-downloadable, `longhorn-bulk`, one replica). The transfer
# dump in files/transfer is the only copy of the Windows PC's data once
# that PC is wiped (dsuj) — irreplaceable and small (100 Gi claimed,
# ~6 GB used on 2026-10-05), so it gets what the library gave up: two
# replicas, and on DIFFERENT NODES, so nas1 being away (not just a bay
# dying) leaves the bytes reachable. No diskSelector: 100 Gi fits any
# tier, and Longhorn picks by free space (w1 616 G, cp1 260 G, nas1
# nvme 822 G on 2026-10-05). The cost is that every write crosses the
# LAN to the second replica synchronously, so the SMB copy from the PC
# tops out at gigabit rather than disk speed — fine for a transfer
# share. Retain, like longhorn-bulk, for the same reason: ArgoCD prunes.
# A backup target (bsj) is still the real answer for irreplaceable
# bytes; this is the stopgap that does not depend on one node.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-user
provisioner: driver.longhorn.io
allowVolumeExpansion: true
volumeBindingMode: Immediate
reclaimPolicy: Retain
parameters:
  numberOfReplicas: "2"
  # Hard node anti-affinity: a replica per node, never two on one.
  replicaSoftAntiAffinity: "disabled"
  replicaDiskSoftAntiAffinity: "disabled"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataLocality: "disabled"
