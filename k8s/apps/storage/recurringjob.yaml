# Daily Longhorn snapshots for volumes that are the only copy of their
# bytes (2026-10-20). Opt-in by label, not cluster-wide: a PVC that
# carries `recurring-job-group.longhorn.io/transfer: enabled` is
# snapshotted. Today that is files/transfer alone. Longhorn is meant to
# copy that label onto the Volume CR; on 2026-10-20 it did not for the
# existing, bound claim, and the label was set on the Volume by hand
# (`kubectl -n longhorn-system label volumes.longhorn.io <pv>
# recurring-job-group.longhorn.io/transfer=enabled`). Check the Volume
# after any rebind. A manual Snapshot CR proved the path the same day.
#
# What this is: an undo button for a wrong delete or overwrite inside
# the share — restore by cloning the snapshot into a new PVC
# (Longhorn UI, or a PVC with dataSource of kind VolumeSnapshot).
# What it is not: a backup. Snapshots are part of the volume's replica
# chain, on the same disks; losing the volume loses them. A copy off
# Longhorn is bsj (backup target), which this does not replace.
#
# Retain 7 at concurrency 1; `snapshot` (not `snapshot-cleanup`) so the
# chain is purged of nothing it did not create. Cost: snapshot deltas
# on an ~15 GB volume, negligible.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: transfer-daily-snapshot
  namespace: longhorn-system
spec:
  name: transfer-daily-snapshot
  task: snapshot
  cron: "15 3 * * *"
  retain: 7
  concurrency: 1
  groups:
    - transfer
  labels: {}
---
# Nightly off-site backup to Tigris (bsj, 2026-10-20). Group `backup`
# is joined by every volume the `longhorn-encrypted` class provisions
# (its recurringJobSelector) and by nothing else, so this ships only
# ciphertext and never the library. A backup is a snapshot plus an
# incremental upload of the blocks that changed since the last one
# (~85 GB app state → a few hundred MB a night); retain 14 keeps two
# weeks of nightly points in the bucket and prunes older ones. Runs
# after the transfer snapshot above so the two do not race on that
# volume. Restore: Longhorn UI → Backup → restore to a new PVC, or a PVC
# with `fromBackup` on a class — on this cluster or a rebuilt one with
# the same sealed-secrets key (crypto.sealed.yaml unseals to the same
# passphrase, which is what makes the ciphertext readable).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-nightly
  namespace: longhorn-system
spec:
  name: backup-nightly
  task: backup
  cron: "45 3 * * *"
  retain: 14
  concurrency: 2
  groups:
    - backup
  labels: {}
