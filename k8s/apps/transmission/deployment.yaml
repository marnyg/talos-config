# Session state (resume/ and torrents/: what is downloading or seeding)
# on the default longhorn class per ADR-0011; settings.json is still
# templated from the ConfigMap on every start. Was an emptyDir until
# 2026-10-03, so every restart orphaned the in-flight torrents.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: media
spec:
  replicas: 1
  # RWO /config: the replacement pod cannot attach while the old one
  # holds the volume on another node (Multi-Attach), so no rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: config
          # Helper pin: one tag across k8s/apps (rg 'image: busybox').
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              chown 1000:1000 /downloads
              cp /template/settings.json /config/settings.json
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-template
              mountPath: /template
            - name: downloads
              mountPath: /downloads
      containers:
        - name: transmission
          image: ghcr.io/linuxserver/transmission:4.1.3
          ports:
            - containerPort: 9091
              name: rpc
            - containerPort: 51413
              name: peer-tcp
              protocol: TCP
            - containerPort: 51413
              name: peer-udp
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
          readinessProbe:
            httpGet:
              path: /transmission/web/
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: transmission-config
        - name: config-template
          configMap:
            name: transmission-config
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  namespace: media
spec:
  selector:
    app: transmission
  ports:
    - port: 9091
      targetPort: 9091
      name: rpc
---
apiVersion: v1
kind: Service
metadata:
  name: transmission-peer
  namespace: media
spec:
  type: NodePort
  selector:
    app: transmission
  ports:
    - port: 51413
      targetPort: 51413
      nodePort: 31413
      name: peer-tcp
      protocol: TCP
    - port: 51414
      targetPort: 51413
      nodePort: 31414
      name: peer-udp
      protocol: UDP
