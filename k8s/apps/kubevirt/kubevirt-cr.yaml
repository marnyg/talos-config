# KubeVirt deployment CR — virt-operator (operator.yaml) reads this and
# rolls out virt-api / virt-controller / virt-handler. The runtime CRDs
# (VirtualMachine, VirtualMachineInstance, …) are created by the
# operator, not vendored; the root app's SkipDryRunOnMissingResource
# covers the window where this CR lands before its CRD.
#
# /dev/kvm was verified present on cp1 2026-08-11 (VT-x enabled, KVM in
# the stock Talos kernel) — no schematic change was needed for this.
# useEmulation stays off: if a node lacks KVM the VM should fail loudly,
# not silently run TCG at 1/10 speed.
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      # KubeVirt v1.9 mounts containerDisks via the k8s ImageVolume
      # feature, which this cluster (v1.32) doesn't support — kubelet
      # never mounts the volume and virt-launcher dies with
      #   exec /container-disk-binary/usr/bin/container-disk: no such file
      # (kubevirt/kubevirt#17460, hit 2026-08-11). Disabling the gate
      # forces the classic init-container copy path. Drop this once the
      # cluster reaches a k8s version where ImageVolume works (≥1.35).
      disabledFeatureGates:
        - ImageVolume
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}
