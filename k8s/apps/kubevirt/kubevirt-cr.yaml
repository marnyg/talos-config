# KubeVirt deployment CR — virt-operator (operator.yaml) reads this and
# rolls out virt-api / virt-controller / virt-exportproxy / virt-handler. The runtime CRDs
# (VirtualMachine, VirtualMachineInstance, …) are created by the
# operator, not vendored; the root app's SkipDryRunOnMissingResource
# covers the window where this CR lands before its CRD.
#
# /dev/kvm was verified present on cp1 2026-08-11 (VT-x enabled, KVM in
# the stock Talos kernel) — no schematic change was needed for this.
# useEmulation stays off: if a node lacks KVM the VM should fail loudly,
# not silently run TCG at 1/10 speed.
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      # KubeVirt v1.9 mounts containerDisks via the k8s ImageVolume
      # feature, which this cluster (v1.32) doesn't support — kubelet
      # never mounts the volume and virt-launcher dies with
      #   exec /container-disk-binary/usr/bin/container-disk: no such file
      # (kubevirt/kubevirt#17460, hit 2026-08-11). Disabling the gate
      # forces the classic init-container copy path. Drop this once the
      # cluster reaches a k8s version where ImageVolume works (≥1.35).
      disabledFeatureGates:
        - ImageVolume
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  # Infra components (virt-api, virt-controller, virt-exportproxy) may run
  # on workers, not only on cp1 (`bhui`, notes 2026-10-08). virt-operator
  # defaults them to a *required* nodeAffinity on
  # node-role.kubernetes.io/control-plane (OR …/master); with a single
  # control plane that pins every replica to cp1 and the operator-owned
  # PDBs (minAvailable 1) then block a cp1 drain until Talos' 5-min
  # DrainTimeout, because the evicted replica has nowhere to go.
  #
  # The required term below is a match-all (every node is linux; the
  # operator already adds nodeSelector kubernetes.io/os=linux), which
  # replaces the control-plane requirement with "any node". The preferred
  # term keeps steady-state placement on cp1 so nothing moves until a
  # drain or a rollout actually forces it — preferred is ignored for a
  # cordoned node, so during a drain the replacements land on w1/nas1.
  #
  # verify: virt-operator (v1.9) injects its default required term only
  # when the user's nodeAffinity.required is nil, and merges (appends)
  # user terms into the deployment's own pod anti-affinity rather than
  # replacing it. If it instead appends our required term, the terms are
  # ORed and the result is the same. Confirm after Argo syncs with
  #   kubectl -n kubevirt get deploy virt-api -o yaml | yq .spec.template.spec.affinity
  # — there must be no `control-plane` under required…nodeSelectorTerms.
  # `workloads` (virt-handler / virt-launcher) is deliberately untouched.
  infra:
    nodePlacement:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
  workloadUpdateStrategy: {}
