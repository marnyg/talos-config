# The SIWE→OIDC bridge (config-server/cmd/siweoidc): every OIDC relying
# party in the cluster authenticates against the wallet through this
# service. All configuration is right here in the args — clients and
# admin wallets are git-declared (invariant 2); auth codes, tokens, and
# the JWKS signing key are in-memory and per-boot, so a pod restart
# logs everyone out and nothing is lost.
#
# Runs in-cluster rather than on the hub deliberately: SSO must not
# depend on the hub's seal state, and a fly redeploy must not log the
# cluster out. Mesh-only by construction — reachable solely through
# ingress-nginx on the overlay (ADR-0009), plain HTTP until the
# wallet-derived CA lands (refs 162c630d).
#
# New relying party = new -client arg here + the client-side config.
# Image: built by .github/workflows/siwe-oidc-image.yml; :latest +
# imagePullPolicy Always, so a rollout restart picks up a new build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siwe-oidc
  namespace: sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siwe-oidc
  template:
    metadata:
      labels:
        app: siwe-oidc
    spec:
      containers:
        - name: siwe-oidc
          image: ghcr.io/marnyg/siwe-oidc:latest
          imagePullPolicy: Always
          args:
            - -issuer=http://auth.gw.mesh.internal
            - -listen=:8080
            - -admin=0xf56863bF40A75dC3c632C17fc65AA2EB06a89406=mar
            - -client=argocd=http://argocd.gw.mesh.internal/auth/callback
            - -client=oauth2-proxy=http://oauth2.gw.mesh.internal/oauth2/callback
            # Two origins, on purpose. The plugin derives redirect_uri
            # from the requesting Host, and a Jellyfin app reaches the
            # gateway's RAW `jellyfin` facet on :8096 (P2.3's path for
            # appliance apps — no nginx hop), which is a different origin
            # from the :80 ingress a browser uses. Without the :8096 row,
            # "Sign in with wallet" in the app dies at siwe-oidc with
            # `redirect_uri … is not registered` and the app falls back to
            # its connect screen (seen on the phone, 2026-09-20).
            # The nebula-era jellyfin.cp1 origin was cut with the TV on
            # the v3 APK (vftt).
            - -client=jellyfin=http://jellyfin.gw.mesh.internal/sso/OID/redirect/wallet,http://jellyfin.gw.mesh.internal:8096/sso/OID/redirect/wallet
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: siwe-oidc
  namespace: sso
spec:
  # Pinned, not allocated. oauth2-proxy's hostAliases maps
  # auth.gw.mesh.internal to this address so its server-side OIDC calls
  # resolve in-cluster from whichever node it lands on; a reallocated
  # ClusterIP would silently break SSO. Immutable once set, so this must
  # match the existing allocation (it does) — changing it later needs the
  # Service recreated.
  clusterIP: 10.107.226.217
  selector:
    app: siwe-oidc
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siwe-oidc
  namespace: sso
spec:
  ingressClassName: nginx
  rules:
    - host: auth.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: siwe-oidc
                port:
                  number: 80
