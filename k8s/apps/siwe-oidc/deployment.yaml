# The SIWE→OIDC bridge (config-server/cmd/siweoidc): the app layer's
# two gates (ADR-0032). Person gate: every OIDC relying party in the
# cluster authenticates against the wallet through it. Group gate:
# /authz answers ingress-nginx's auth_request from the gateway-signed
# X-Mesh-Token alone (200/401/403, no cookie, no login page). All
# configuration is right here in the args — clients, admin wallets with
# their groups (per wallet, never inferred from "may sign in" — 5kh),
# and the gateway ids whose tokens are trusted are git-declared
# (invariant 2); auth codes, tokens, and the JWKS signing key are
# in-memory and per-boot, so a pod restart logs everyone out and
# nothing is lost.
#
# Runs in-cluster rather than on the hub deliberately: SSO must not
# depend on the hub's seal state, and a fly redeploy must not log the
# cluster out. Mesh-only by construction — reachable solely through
# ingress-nginx on the overlay (ADR-0009), plain HTTP (browser TLS is a
# device-local presentation if an app ever forces it, ADR-0033).
#
# New relying party = new -client arg here + the client-side config.
# New gated service = one auth-url annotation on its Ingress
# (k8s/apps/media/ingress.yaml). New gateway = its member id in a
# -gateway arg (the pod logs "identity token issuer ed:…" at start).
# Image: built by .github/workflows/siwe-oidc-image.yml; :latest +
# imagePullPolicy Always, so a rollout restart picks up a new build.
#
# Deliberately ONE replica (HA sweep slice 2, talos-config-9l67): the
# per-boot state above is per-*pod* — a second replica would hold a
# different signing key and would not know the first one's auth codes,
# so a code minted by one and redeemed at the other (the browser and
# the relying party take different paths in) fails at random. Replicating it
# means a durable signing key and self-contained codes — a design
# change, filed as a thread. What HA it has is fast failover: no volume,
# and the tolerations below evict it from an unreachable node after 30 s
# instead of the 300 s default, so the ReplicaSet respawns it elsewhere
# in about a minute. Cost of a failover is one re-login at the OIDC
# apps (ArgoCD verifies against the rotated JWKS); the group gate has
# no session to lose — /authz is a pure function of the request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siwe-oidc
  namespace: sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siwe-oidc
  template:
    metadata:
      labels:
        app: siwe-oidc
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: siwe-oidc
          image: ghcr.io/marnyg/siwe-oidc:latest
          imagePullPolicy: Always
          args:
            - -issuer=http://auth.gw.mesh.internal
            - -listen=:8080
            - -admin=0xf56863bF40A75dC3c632C17fc65AA2EB06a89406=mar:admins
            # The in-cluster gateway (k8s/apps/gateway): the one key
            # whose X-Mesh-Token /authz and device login accept. Its
            # member key lives on the gateway's volume; a re-keyed
            # gateway is a new id and a new line here — and in the
            # Jellyfin pod's qc sidecar (k8s/apps/jellyfin), the other
            # verifier of this token.
            - -gateway=ed:45fc82fcbd3714b82a42805131a957a59cd814e02064ba40abc4f71f6b6613f4
            - -client=argocd=http://argocd.gw.mesh.internal/auth/callback
            # ArgoCD logs a member device in by token, no wallet page:
            # the device is the right principal there (the audit log
            # names it; `admins` → role:admin). Jellyfin is NOT opted in
            # — its users carry watch state, and one user per device
            # would split the person's.
            - -token-client=argocd
            # One origin: the plugin derives redirect_uri from the
            # requesting Host, and every client — browser or app — now
            # reaches Jellyfin through the :80 ingress. The :8096 row
            # (the gateway's raw `jellyfin` facet) went with the facet,
            # 2026-10-06, ADR-0034; the nebula-era jellyfin.cp1 origin
            # went with the TV on the v3 APK (vftt).
            - -client=jellyfin=http://jellyfin.gw.mesh.internal/sso/OID/redirect/wallet
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: siwe-oidc
  namespace: sso
spec:
  # Pinned, not allocated. argocd-server's and Jellyfin's hostAliases
  # map auth.gw.mesh.internal to this address so their server-side OIDC
  # calls resolve in-cluster from whichever node they land on; a
  # reallocated ClusterIP would silently break SSO. Immutable once set, so this must
  # match the existing allocation (it does) — changing it later needs the
  # Service recreated.
  clusterIP: 10.107.226.217
  selector:
    app: siwe-oidc
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siwe-oidc
  namespace: sso
spec:
  ingressClassName: nginx
  rules:
    - host: auth.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: siwe-oidc
                port:
                  number: 80
