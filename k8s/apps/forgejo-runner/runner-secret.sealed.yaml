# The runner's pre-shared secret (bootstrap.md step 1): 40 hex chars
# the pod re-registers from on every start, and the same value
# `forgejo-cli actions register` holds on the Forgejo side. Rotate:
# step 1 again with a new value, then delete the old runner row.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  encryptedData:
    RUNNER_SECRET: 
  template:
    metadata:
      name: forgejo-runner
      namespace: forgejo-runner
