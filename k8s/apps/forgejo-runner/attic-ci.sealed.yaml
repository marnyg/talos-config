# The runner's Attic token (bootstrap.md step 2): `atticadm make-token
# --sub ci --validity 2y --pull main --push main`, minted 2026-10-17.
# Pods push by Service name with their own token; the mesh gate is
# for devices (nix-cache/attic-ingress.yaml). Rotate: step 2 again.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: attic-ci
  namespace: forgejo-runner
spec:
  encryptedData:
    ATTIC_TOKEN: 
  template:
    metadata:
      name: attic-ci
      namespace: forgejo-runner
