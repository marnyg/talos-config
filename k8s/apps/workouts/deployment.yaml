# Workouts: the Strong replacement (workouts/, epic yz75). One static Go
# binary, one SQLite file + the exercise media on one Longhorn volume
# (ADR-0029). Data-plane state under invariant 2's exception: payload,
# backed up with the volume, nothing the control plane depends on.
#
# Seeding: the Strong export (licensed media, kept out of git) goes in
# with the binary's own importer. The image is scratch — no sh, no tar
# — so kubectl cp/exec cannot target it; instead (done 2026-10-16):
#   1. a busybox pod on the PVC: `tar -C <export> -cf - api media |
#      kubectl exec -i seed -- sh -c 'mkdir -p /data/strong-export &&
#      tar -C /data/strong-export -xf -'`
#   2. a one-off pod from this image with args
#      [import, -data, /var/lib/workouts, /var/lib/workouts/strong-export]
# Re-running is idempotent (rows keep Strong's ids).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workouts
  namespace: workouts
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workouts
  namespace: workouts
spec:
  replicas: 1
  # RWO volume + SQLite: no rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workouts
  template:
    metadata:
      labels:
        app: workouts
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workouts
          # workouts/build.sh prints the digest; pin it here.
          image: ghcr.io/marnyg/workouts@sha256:15ea29f431b2bde5c2e7fc94c89f204c5ae8b4f4890ad78898b022d9925c18cc
          args: ["serve", "-data", "/var/lib/workouts", "-listen", ":8080", "-tz", "Europe/Oslo"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/workouts
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: workouts
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: workouts
  namespace: workouts
spec:
  selector:
    app: workouts
  ports:
    - port: 8080
      targetPort: 8080
