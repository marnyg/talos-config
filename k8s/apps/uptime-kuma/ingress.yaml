# uptime.gw.mesh.internal, behind the group gate like Vaultwarden and
# the *arr apps (k8s/apps/media/ingress.yaml explains the mechanism).
# Admins only: the dashboard edits monitors and notification channels,
# and the first-run page creates the admin account. Uptime Kuma's own
# login is the second gate. Status pages (its share-with-others view)
# sit behind the same gate for now; opening one to a wider group would
# be a second Ingress on a path, gated on that group.
#
# The dashboard is a socket.io session: a WebSocket on /socket.io/.
# Both hops in front of nginx are stdlib reverse proxies, which forward
# the Upgrade; the read timeout below keeps nginx from cutting an idle
# socket every 60 s.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://siwe-oidc.sso.svc.cluster.local/authz?group=admins
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: uptime.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
