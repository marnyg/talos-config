# The Forgejo token agent children push with (ADR-0037, e6pu.3; ivof.1
# bootstrap step 5): bot user `agent`, team `bots` in org `agents`,
# scopes write:repository,write:issue. A data-plane credential like the
# OpenRouter key beside it (kanr memo, invariant 1 check) — the wire
# carries repo names, never this. FORGEJO_URL is the in-cluster Service:
# pods cannot resolve the mesh name. Attached by the provisioner's
# -outfit to the sandbox-agent image (deployment.yaml); the child reads
# it once and scrubs it from pi's environment (actors/cmd/child).
# Moved here from k8s/apps/sandbox (ns ai) when the shell git path went.
#
# Rotate: k8s/apps/forgejo/bootstrap.md step 5 with a new --token-name,
# then DELETE the old token as sysadmin; reseal with
# kubeseal --cert talos/clusters/homelab/sealed-secrets.crt.
# Rotated 2026-10-20 (97rz): token-name sandbox → sandbox-20261020 after
# the first `sandbox` token leaked into session bce13a83's transcript.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-agent
  namespace: sap
spec:
  encryptedData:
    FORGEJO_TOKEN: 
    FORGEJO_URL: 
  template:
    metadata:
      name: forgejo-agent
      namespace: sap
