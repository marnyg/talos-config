# The OpenRouter key for agent children the sap-provisioner starts
# (ADR-0037 outfit: `-outfit <sandbox-agent digest>=openrouter` on the
# Deployment renders it as envFrom on the child's container). The same
# key as k8s/apps/sandbox/sealed-secret.yaml, resealed for this
# namespace — a SealedSecret is bound to name+namespace. A data-plane
# credential: it authorises spend at a vendor, never a user or member.
#
# Rotate with the `ai` copy: kubectl get secret -n ai openrouter -o json
# | jq '.metadata = {name, namespace: "sap"}' | kubeseal --cert
# talos/clusters/homelab/sealed-secrets.crt -o yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openrouter
  namespace: sap
spec:
  encryptedData:
    OPENROUTER_API_KEY: 
  template:
    metadata:
      name: openrouter
      namespace: sap
    type: Opaque
