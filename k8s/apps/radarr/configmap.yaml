apiVersion: v1
kind: ConfigMap
metadata:
  name: radarr-configurator
  namespace: media
data:
  # Recyclarr (sidecar in deployment.yaml) syncs TRaSH's "[Anime] Remux-1080p"
  # quality profile into Radarr; a movie opts in by picking it. Same
  # title-heuristic enforcement as sonarr's (see sonarr/configmap.yaml):
  # group tiers gate on minFormatScore 100, Anime Raws and Dubs Only sit
  # at -10000, Anime Dual Audio is a +10 tiebreak. Radarr's profile
  # additionally carries language: Original, so a release parsed as
  # English-only is rejected outright.
  # trash_ids: https://github.com/TRaSH-Guides/Guides/tree/master/docs/json/radarr
  recyclarr.yml: |
    radarr:
      radarr:
        base_url: http://localhost:7878
        api_key: !env_var RADARR_API_KEY
        quality_profiles:
          - trash_id: 722b624f9af1e492284c4bc842153a38  # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true
        custom_formats:
          - trash_ids:
              - 4a3b087eea2ce012fcc1ce319259a3be  # Anime Dual Audio
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: 10
  configure.sh: |
    #!/bin/sh
    set -e

    RADARR_URL="http://localhost:7878"
    # NZBGEEK_API_KEY and PROWLARR_API_KEY come from the env (nzbgeek and
    # prowlarr sealed secrets).

    echo "Waiting for Radarr to start..."
    until curl -sf "$RADARR_URL/ping" > /dev/null 2>&1; do
      sleep 5
    done

    # Wait for config.xml to have an API key
    while [ ! -f /config/config.xml ] || ! grep -q '<ApiKey>' /config/config.xml; do
      sleep 2
    done

    API_KEY=$(sed -n 's/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/p' /config/config.xml)
    echo "Radarr API key: $API_KEY"
    AUTH="X-Api-Key: $API_KEY"

    # Allowed Hosts (DNS-rebinding guard, else a health warning): the
    # names Radarr is reached by — the configurator (localhost), in-cluster
    # peers (the Service), the mesh (nginx passes the Host untouched). Not
    # the pod IP: the readiness probe sends Host: localhost for that. Host
    # settings only apply after a restart, so restart only on change.
    allowed="localhost,radarr,radarr.media,radarr.media.svc,radarr.media.svc.cluster.local,radarr.gw.mesh.internal"
    host=$(curl -sf -H "$AUTH" "$RADARR_URL/api/v3/config/host")
    if ! printf '%s' "$host" | grep -q "\"allowedHosts\": *\"$allowed\""; then
      echo "Setting allowed hosts..."
      printf '%s' "$host" | sed "s/\"allowedHosts\": *\"[^\"]*\"/\"allowedHosts\": \"$allowed\"/" > /tmp/host.json
      curl -sf -o /dev/null -X PUT -H "$AUTH" -H "Content-Type: application/json" \
        --data-binary @/tmp/host.json "$RADARR_URL/api/v3/config/host/1" \
        && curl -sf -o /dev/null -X POST -H "$AUTH" "$RADARR_URL/api/v3/system/restart" \
        || echo "WARN: allowed hosts failed"
      sleep 15
      until curl -sf "$RADARR_URL/ping" > /dev/null 2>&1; do sleep 5; done
    fi

    # Wait for dependency services
    echo "Waiting for NZBget..."
    until curl -sf "http://nzbget:6789" > /dev/null 2>&1; do sleep 5; done

    echo "Waiting for Transmission..."
    until curl -sf "http://transmission:9091/transmission/web/" > /dev/null 2>&1; do sleep 5; done

    # Add root folder /movies
    existing=$(curl -sf -H "$AUTH" "$RADARR_URL/api/v3/rootfolder")
    if ! echo "$existing" | grep -q "/movies"; then
      echo "Adding root folder /movies..."
      curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
        -d '{"path":"/movies"}' "$RADARR_URL/api/v3/rootfolder" || echo "WARN: root folder failed"
    fi

    # Add NZBget download client
    existing=$(curl -sf -H "$AUTH" "$RADARR_URL/api/v3/downloadclient")
    if ! echo "$existing" | grep -q "NZBget"; then
      echo "Adding NZBget download client..."
      curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{
        "enable": true,
        "protocol": "usenet",
        "priority": 1,
        "name": "NZBget",
        "implementation": "Nzbget",
        "configContract": "NzbgetSettings",
        "fields": [
          {"name": "host", "value": "nzbget"},
          {"name": "port", "value": 6789},
          {"name": "username", "value": ""},
          {"name": "password", "value": ""},
          {"name": "movieCategory", "value": "Movies"},
          {"name": "useSsl", "value": false}
        ]
      }' "$RADARR_URL/api/v3/downloadclient" || echo "WARN: NZBget client failed"
    fi

    # Add Transmission download client
    if ! echo "$existing" | grep -q "Transmission"; then
      echo "Adding Transmission download client..."
      curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{
        "enable": true,
        "protocol": "torrent",
        "priority": 1,
        "name": "Transmission",
        "implementation": "Transmission",
        "configContract": "TransmissionSettings",
        "fields": [
          {"name": "host", "value": "transmission"},
          {"name": "port", "value": 9091},
          {"name": "useSsl", "value": false}
        ]
      }' "$RADARR_URL/api/v3/downloadclient" || echo "WARN: Transmission client failed"
    fi

    # Torrent indexers are not added here: Prowlarr (k8s/apps/prowlarr)
    # holds them and pushes one entry per indexer into Radarr through the
    # application registered below. Jackett and its per-id Torznab loop
    # retired 2026-10-21 (talos-config-6t21).

    # Add NZBgeek indexer (Newznab/usenet)
    existing=$(curl -sf -H "$AUTH" "$RADARR_URL/api/v3/indexer")
    if [ -n "$NZBGEEK_API_KEY" ] && ! echo "$existing" | grep -q "NZBgeek"; then
      echo "Adding NZBgeek indexer..."
      curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{
        "enableRss": true,
        "enableAutomaticSearch": true,
        "enableInteractiveSearch": true,
        "protocol": "usenet",
        "priority": 10,
        "name": "NZBgeek",
        "implementation": "Newznab",
        "configContract": "NewznabSettings",
        "fields": [
          {"name": "baseUrl", "value": "https://api.nzbgeek.info"},
          {"name": "apiPath", "value": "/api"},
          {"name": "apiKey", "value": "'"$NZBGEEK_API_KEY"'"},
          {"name": "categories", "value": [2000, 2010, 2020, 2030, 2040, 2050]},
          {"name": "animeCategories", "value": []}
        ]
      }' "$RADARR_URL/api/v3/indexer" || echo "WARN: NZBgeek indexer failed"
    fi

    # Register with Prowlarr as an application; see sonarr/configmap.yaml
    # for the reasoning (the pairing is driven from this side because
    # only this pod knows Radarr's key). syncCategories become the
    # `categories` of every indexer Prowlarr pushes (the movie set the
    # Jackett Torznab entries carried until 2026-10-21); minimumSeeders
    # comes from Prowlarr's app profile (Standard: 1), as before.
    if [ -n "$PROWLARR_API_KEY" ]; then
      PROWLARR_URL="http://prowlarr:9696"
      PAUTH="X-Api-Key: $PROWLARR_API_KEY"
      name="Radarr"
      body='{
        "name": "'"$name"'",
        "syncLevel": "fullSync",
        "implementation": "Radarr",
        "configContract": "RadarrSettings",
        "fields": [
          {"name": "prowlarrUrl", "value": "'"$PROWLARR_URL"'"},
          {"name": "baseUrl", "value": "http://radarr:7878"},
          {"name": "apiKey", "value": "'"$API_KEY"'"},
          {"name": "syncCategories", "value": [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060]}
        ],
        "tags": []
      }'
      n=0
      until apps=$(curl -sf -H "$PAUTH" "$PROWLARR_URL/api/v1/applications"); do
        n=$((n + 1))
        if [ "$n" -ge 18 ]; then echo "WARN: Prowlarr unreachable, pairing skipped"; break; fi
        sleep 10
      done
      if [ "$n" -lt 18 ]; then
        eid=$(printf '%s\n' "$apps" | awk -v n="$name" \
          '$0 == "    \"name\": \"" n "\"," { hit = 1 } hit && /^    "id": / { gsub(/[^0-9]/, ""); print; exit }')
        if [ -n "$eid" ]; then
          echo "Refreshing Prowlarr application $name (id $eid)..."
          curl -sf -o /dev/null -X PUT -H "$PAUTH" -H "Content-Type: application/json" \
            -d "${body%\}}, \"id\": $eid}" "$PROWLARR_URL/api/v1/applications/$eid" || echo "WARN: Prowlarr $name refresh failed"
        else
          echo "Registering with Prowlarr as $name..."
          n=0
          until curl -sf -o /dev/null -X POST -H "$PAUTH" -H "Content-Type: application/json" \
            -d "$body" "$PROWLARR_URL/api/v1/applications"; do
            n=$((n + 1))
            if [ "$n" -ge 18 ]; then echo "WARN: Prowlarr $name pairing failed"; break; fi
            sleep 10
          done
        fi
      fi
    fi

    echo "Radarr configuration complete!"
    sleep infinity
