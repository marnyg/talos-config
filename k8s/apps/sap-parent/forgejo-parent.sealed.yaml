# The parent's read-only Forgejo token (talos-config-rpxe): bot user
# `agent`, token-name parent-ro, scopes read:repository,read:user —
# enough for GET /api/v1/user/repos, which feeds the repo picker on the
# new-session/new-task forms with the repos the bot can push to. The
# write token stays with the provisioner's -outfit (ADR-0037: the
# parent names repos, children carry the credential); this one cannot
# push, open PRs or issues (POST → 403, checked at minting). FORGEJO_URL
# is the in-cluster Service: pods cannot resolve the mesh name.
#
# Rotate: k8s/apps/forgejo/bootstrap.md step 5b with a new --token-name,
# DELETE the old one as sysadmin; reseal with
# kubeseal --cert talos/clusters/homelab/sealed-secrets.crt.
# Minted 2026-10-21.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-parent
  namespace: sap
spec:
  encryptedData:
    FORGEJO_TOKEN: 
    FORGEJO_URL: 
  template:
    metadata:
      name: forgejo-parent
      namespace: sap
