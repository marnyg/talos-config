# Home Assistant Core at https://home.gw.mesh.internal. One Longhorn
# volume (ADR-0029) is /config: configuration.yaml and its includes,
# .storage/ (users, integrations, dashboards, the auth tokens the
# companion app holds), the sqlite recorder database and the media
# folder. All of it is data plane (invariant 2's exception): nothing
# the control plane depends on lives here, and losing the volume loses
# the automations and history, not membership. `bsj` (backup target)
# covers it like Forgejo and Vaultwarden.
#
# Reverse proxy: ingress-nginx forwards X-Forwarded-For on every
# request, and Home Assistant answers 400 to a forwarded request unless
# the proxy's address is listed in its http config's trusted_proxies.
# That config lives in /config/.storage/http (not configuration.yaml —
# see the init container), and the init container reconciles the two
# proxy keys into it before every start. configuration.yaml itself is
# HA's own default (it writes one on a fresh volume) and stays the
# user's.
#
# Identity: Home Assistant authenticates itself (owner account from
# onboarding, long-lived tokens for the companion app). The SIWE bridge
# gates reachability on the Ingress (group admins, ingress.yaml); the
# HA login is the second gate. The X-Mesh-Name header could log a
# device in as a person later (the Grafana pattern, spike i1il) — HA
# has no header-auth provider in core, so not now.
#
# HTTPS: the companion app and the browser both work over plain http,
# but the PWA install, the camera/microphone and the location features
# want a secure context, so the published name is the https one
# (ADR-0033, meshtls) — TLS terminates on the device, the wire from
# the gateway inward stays plain HTTP, and HA sees X-Forwarded-Proto.
#
# Network: ClusterIP only (namespace.yaml explains the baseline PSS).
# Discovery-based integrations and USB radios need hostNetwork / a
# device mount on a pinned node, which would also put :8123 on the LAN
# outside the mesh gate; revisit once a concrete integration needs it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
  namespace: homeassistant
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-encrypted
  volumeName: pvc-c7fd57f4-bc1c-458c-b783-2cbbd49305ae
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  # RWO volume + sqlite: no rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Reverse-proxy trust lives in HA's http store, not YAML: since
        # 2026.x an `http:` YAML block is migrated ONCE into
        # .storage/http as a *pending* trial that must be promoted from
        # the UI (ws http/config/promote) within 5 min or it is marked
        # not_promoted, never applied again, and YAML is ignored for
        # good. The first start here lost that race (the WebSocket the
        # UI needs was the gateway bug o8wd) and came up with no
        # trusted proxies. So the store is reconciled directly, before
        # HA starts (nothing else has it open then): the two proxy keys
        # are merged into `stable` on
        # every start, a failed pending trial is dropped, and a fresh
        # volume gets a store built from HA's own schema defaults —
        # the HA image runs this, so the defaults match the pinned
        # version. Everything else in the store stays the UI's.
        - name: http-store
          image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
          command: ["python3", "-c"]
          args:
            - |
              import json, os, datetime
              from homeassistant.components.http.config import (
                  HTTP_STORAGE_SCHEMA, STORAGE_VERSION, STORAGE_MINOR_VERSION)
              # ingress-nginx pods (talos/base/*.yaml podSubnets).
              want = {"use_x_forwarded_for": True, "trusted_proxies": ["10.244.0.0/16"]}
              path = "/config/.storage/http"
              if os.path.exists(path):
                  doc = json.load(open(path))
              else:
                  stable = dict(HTTP_STORAGE_SCHEMA({}),
                      created_at=datetime.datetime.now(datetime.UTC).isoformat(),
                      error=None, error_message=None)
                  doc = {"version": STORAGE_VERSION, "minor_version": STORAGE_MINOR_VERSION,
                      "key": "http", "data": {"stable": stable, "pending": None,
                      "yaml_migration_done": True}}
              data = doc["data"]
              changed = any(data["stable"].get(k) != v for k, v in want.items())
              data["stable"].update(want)
              if data.get("pending") and data["pending"].get("error"):
                  data["pending"] = None  # a failed trial; HA never applies it
                  changed = True
              os.makedirs("/config/.storage", exist_ok=True)
              tmp = path + ".tmp"
              with open(tmp, "w") as f:
                  json.dump(doc, f, indent=2)
              os.chmod(tmp, 0o600)
              os.replace(tmp, path)
              print("http store:", "reconciled" if changed else "unchanged")
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: homeassistant
          # Pinned by digest; the 2026.10.2 tag resolved on 2026-10-17
          # (same manifest as `stable` that day).
          image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - containerPort: 8123
          securityContext:
            # Root with the runtime's default capability set, which is
            # what s6's /init expects (namespace.yaml); no additions.
            # Not drop-ALL: s6 chowns and switches uid on the way in,
            # and a root with no CHOWN/SETUID fails there, not here.
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              # 302 to /onboarding.html or the login page; any 2xx/3xx
              # means the http integration is up.
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  selector:
    app: homeassistant
  ports:
    - port: 8123
      targetPort: 8123
