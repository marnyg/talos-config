# Gated behind the wallet like the *arr apps (see k8s/apps/media/
# ingress.yaml for the mechanism): SillyTavern has no auth of its own
# here (single user, whitelistMode off), so the group gate is what keeps
# "every exposed service authenticates against the wallet" true — the
# wallet signed the device's member cert the token attests.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sillytavern
  namespace: ai
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: SillyTavern
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: sillytavern.png
    gethomepage.dev/description: LLM front-end
    gethomepage.dev/pod-selector: app=sillytavern
    gethomepage.dev/weight: "40"
    # Character cards / backgrounds upload past nginx's 1 MiB default.
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  rules:
    - host: sillytavern.gw.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sillytavern
                port:
                  number: 8000
