# Attic's JWT signing key (RS256, PKCS#1 PEM, base64), sealed to the
# cluster's sealed-secrets key pair like files/samba-users. atticd reads
# it from the environment (ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64) in
# place of jwt.signing.token-rs256-secret-base64 in server.toml.
#
# Nobody outside the cluster needs this key: tokens are minted in-pod
# with `atticadm make-token` (bootstrap.md), which reads the same env.
# It was generated and sealed in one pipeline — the plaintext was never
# a file or an argument:
#   openssl genrsa -traditional 4096 | base64 | tr -d '\n' \
#   | kubectl create secret generic attic-token-key -n nix-cache \
#       --dry-run=client -o yaml \
#       --from-file=ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64=/dev/stdin \
#   | kubeseal --cert talos/clusters/homelab/sealed-secrets.crt -o yaml
# (nixpkgs openssl: macOS LibreSSL has no -traditional and silently
# yields an empty key.) Rotating it invalidates every issued token.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: attic-token-key
  namespace: nix-cache
spec:
  encryptedData:
    ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64: 
  template:
    metadata:
      name: attic-token-key
      namespace: nix-cache
