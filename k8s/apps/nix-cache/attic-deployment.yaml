# Attic: the binary cache for our own builds (attic-config.yaml has
# the why; namespace.yaml the split from the nixos-mirror).
#
# One volume, longhorn-bulk: db + chunks together (see config), one
# replica on nas1's SATA tier. Everything in it is re-derivable — from
# source, slowly — which is ADR-0011's definition of bulk; the pod
# itself is not pinned (RWO attaches across the LAN from wherever it
# lands). nas1 away is this cache away, same as the mirror; nix falls
# through to building. 100 Gi; retention (6 months default) and GC keep
# it bounded.
#
# Reach, two ports on one Service:
#   gate (8081) — the Ingress's backend: the nginx sidecar, which adds
#     the sealed mesh token (attic-mesh-token.sealed.yaml) and hands
#     the request to atticd. A member device past the group gate can
#     pull and push with no credential of its own.
#   api  (8080) — atticd itself, for pods on the pod network; they
#     carry their own token.
#
# The image is upstream's nix-built one (dockerTools, /bin/atticd +
# /bin/atticadm + busybox), no user set. It runs here as uid 1000 with
# fsGroup for the volume; atticd needs nothing in /etc/passwd.
# Only `latest` and sha tags are published; pinned by digest, resolved
# 2026-10-16.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: attic
  namespace: nix-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-bulk
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: nix-cache
spec:
  replicas: 1
  # RWO volume + sqlite: never two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: attic
  template:
    metadata:
      labels:
        app: attic
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atticd
          image: ghcr.io/zhaofengli/attic@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
          command: [/bin/atticd, -f, /config/server.toml, --mode, monolithic]
          envFrom:
            - secretRef:
                name: attic-token-key # ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64
          env:
            # Plain `info` logs every sqlx statement (seen on first
            # start, 2026-10-16); keep attic's own lines, mute the ORM.
            - name: RUST_LOG
              value: info,sqlx=warn,sea_orm_migration=warn
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
        - name: gate
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # The image's nginx user; the pod-level 1000 is atticd's and
          # the volume's, not this container's.
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: attic-mesh-token # ATTIC_MESH_TOKEN
          env:
            - name: NGINX_ENVSUBST_FILTER
              value: ^ATTIC_
          ports:
            - name: gate
              containerPort: 8081
          volumeMounts:
            - name: gate
              mountPath: /etc/nginx/templates
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          # TCP, not HTTP: attic's binary-cache routes live under
          # /<cache>/ and there is no unauthenticated health path at the
          # root, so a GET would 404 and fail the probe.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: attic
        - name: data
          persistentVolumeClaim:
            claimName: attic
        - name: gate
          configMap:
            name: attic-gate
---
# api: pods (in-cluster builders) use
# http://attic.nix-cache.svc.cluster.local/main with their own token.
# gate: the Ingress only (see header).
apiVersion: v1
kind: Service
metadata:
  name: attic
  namespace: nix-cache
spec:
  # Pinned, not allocated: the CI runner's hostAliases map
  # cache.gw.mesh.internal here (forgejo-runner/deployment.yaml), since
  # the attic client follows the advertised api-endpoint. Immutable;
  # matches the existing allocation — see siwe-oidc's Service.
  clusterIP: 10.103.91.1
  selector:
    app: attic
  ports:
    - name: api
      port: 80
      targetPort: 8080
    - name: gate
      port: 8081
      targetPort: 8081
