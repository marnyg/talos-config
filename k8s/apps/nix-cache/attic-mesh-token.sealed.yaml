# The Attic token the mesh path acts as (attic-deployment.yaml, the
# `gate` sidecar). Why a token exists at all: the group gate on the
# Ingress already proves "admin device", but Attic's only notion of
# write permission is a JWT it signed — it cannot read X-Mesh-Groups.
# So the sidecar adds this one as `Authorization: Bearer` to every
# request that passed the gate, and a member device needs no `attic
# login` credential: the mesh identity is the whole credential, as for
# ArgoCD or Forgejo reads. Past the gate this is ambient authority,
# which the invariants already accept one hop past the bridge.
#
# Scope: pull/push/create/configure on `main` only — no destroy, no
# other caches. sub=mesh-admins, 5 years. Minted in-pod and sealed in
# one pipeline (never printed; bootstrap.md has the command); it is
# bound to attic-token-key.sealed.yaml, so rotating that key means
# re-minting this.
#
# Pods do not get it: they reach atticd directly through the Service's
# `api` port and carry their own, narrower token.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: attic-mesh-token
  namespace: nix-cache
spec:
  encryptedData:
    ATTIC_MESH_TOKEN: 
  template:
    metadata:
      name: attic-mesh-token
      namespace: nix-cache
