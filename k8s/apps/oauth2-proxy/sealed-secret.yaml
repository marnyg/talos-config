# oauth2-proxy's cookie secret, sealed to the cluster's sealed-secrets
# key pair (provisioned by inlineManifest, same as newshosting/nzbgeek).
# Sealed rather than per-boot so browser sessions survive pod restarts;
# rotating it just logs everyone out. Regenerate:
#   head -c 32 /dev/urandom | base64   → kubectl create secret … | kubeseal
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: oauth2-proxy
  namespace: sso
spec:
  encryptedData:
    cookie-secret: 
  template:
    metadata:
      name: oauth2-proxy
      namespace: sso
