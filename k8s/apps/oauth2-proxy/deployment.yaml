# One oauth2-proxy gates every non-OIDC web UI (sonarr/radarr/nzbget/
# jackett/transmission) via ingress-nginx auth_request: their Ingresses
# carry auth-url/auth-signin annotations pointing here, so protecting a
# service is two annotations in git — the app itself stays untouched.
#
# Identity comes from the SIWE→OIDC bridge (public client, PKCE — the
# client_secret below is a required-but-ignored placeholder, not a
# secret). The session rides one cookie scoped to .cp1.mesh.internal,
# so a single wallet signature opens all gated services. Cookie secret
# is sealed (sealed-secret.yaml) so sessions survive pod restarts;
# cookie-secure=false is the ADR-0009 plain-HTTP posture — the mesh
# encrypts the wire.
#
# hostAliases: pods cannot resolve .mesh.internal (Talos host DNS
# serves no /etc/hosts entries to kube-dns — siderolabs/talos#9822),
# so the issuer hostname is pinned here.
#
# It points at the siwe-oidc **Service**, not at cp1's mesh address as
# it did until 2026-07-31. That pin only ever worked while this pod
# happened to run on cp1: nebula carries 10.42.0.0/16 source addresses,
# and a pod's source is 10.244.x.x, so from any other node the dial to
# 10.42.218.125:80 just times out. cp1's reboot during the Longhorn work
# rescheduled this pod to w1 and every SSO-protected service started
# returning 500 (nginx: "auth request unexpected status: 502").
#
# Pointing at the ClusterIP is not a workaround for OIDC's issuer-URL
# equality rule — it satisfies it. siwe-oidc advertises
# issuer/authorization_endpoint/jwks_uri as http://auth.cp1.mesh.internal
# no matter how the discovery document is fetched, so the browser's view
# and this pod's view agree on the issuer string. Only the transport
# differs: server-side calls (discovery, token redeem, JWKS) resolve
# in-cluster from any node, browser-side calls still go over the mesh
# through ingress.
#
# The ClusterIP is pinned in the siwe-oidc Service manifest so this
# literal cannot go stale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      hostAliases:
        - ip: 10.107.226.217
          hostnames: [auth.cp1.mesh.internal]
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
          args:
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --provider=oidc
            - --provider-display-name=wallet
            - --oidc-issuer-url=http://auth.cp1.mesh.internal
            - --client-id=oauth2-proxy
            - --client-secret=public-client-pkce-only
            - --code-challenge-method=S256
            - --scope=openid profile email groups
            - --email-domain=*
            - --allowed-group=admins
            - --redirect-url=http://oauth2.cp1.mesh.internal/oauth2/callback
            - --cookie-secure=false
            - --cookie-samesite=lax
            - --cookie-domain=.cp1.mesh.internal
            - --whitelist-domain=.cp1.mesh.internal
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: cookie-secret
          ports:
            - containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: sso
spec:
  selector:
    app: oauth2-proxy
  ports:
    - port: 80
      targetPort: 4180
---
# The sign-in/callback surface needs its own hostname: the auth_request
# subrequest goes service-to-service, but the browser redirect
# (/oauth2/start → bridge → /oauth2/callback) must ride the mesh.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  namespace: sso
spec:
  ingressClassName: nginx
  rules:
    - host: oauth2.cp1.mesh.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
