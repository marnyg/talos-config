# Cluster layer for WORKERS. The controlplane layer (cluster.yaml) is
# not reusable here: apiServer/proxy/inlineManifests are control-plane
# concerns, and pairing it with secrets.yaml fails validation outright
# ("etcd config is only allowed on control plane machines").
#
# A worker needs exactly two facts from the cluster: its name and where
# the API server is. Everything else it learns from the control plane
# after it joins.
cluster:
  clusterName: homelab
  # cp1's declared LAN address — the same value cluster.yaml gives the
  # control plane; static in its machine patch, so not a DHCP lease
  # (invariant 7). Since P2.5 (talos-config-359.9.5) a worker's kubelet
  # reaches the API server over the LAN, so cluster membership no
  # longer needs any overlay up — the invariant-4 exception that the
  # nebula-address endpoint created is gone.
  controlPlane:
    endpoint: https://10.0.0.68:6443
