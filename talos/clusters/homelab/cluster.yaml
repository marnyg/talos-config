cluster:
  clusterName: homelab
  controlPlane:
    # Node's own derived mesh address (HKDF from MAC) — loopback-local
    # on the node, independent of DHCP/router state (invariant 7).
    # Phase 2 step 2: moved off the wg0 address (10.99.0.54); wg0 SAN
    # stays below until step 3 strips the dual overlay.
    endpoint: https://10.42.218.125:6443
  apiServer:
    certSANs:
      - 10.99.0.54
      # cp1's nebula identity (HKDF-derived from the MAC; confirmed by
      # the phase-1 reboot check).
      - 10.42.218.125
      - cp1.mesh.internal
  proxy:
    # kube-proxy in nftables mode serves NodePorts only on the primary
    # node IP by default — which would exclude wg0. Serve them on all
    # addresses so admin peers reach apps over the tunnel.
    extraArgs:
      nodeport-addresses: 0.0.0.0/0
  inlineManifests:
    - name: argocd-namespace
      contents: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: argocd
    - name: argocd-installer
      contents: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: argocd-installer
          namespace: kube-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: argocd-installer
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: argocd-installer
          namespace: kube-system
        ---
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: argocd-installer
          namespace: kube-system
        spec:
          template:
            spec:
              serviceAccountName: argocd-installer
              containers:
              - name: installer
                image: alpine/kubectl:latest
                command:
                - /bin/sh
                - -c
                - |
                  kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
                  kubectl apply -f - <<'EOF'
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: apps
                    namespace: argocd
                  spec:
                    project: default
                    source:
                      repoURL: https://github.com/marnyg/talos-config.git
                      targetRevision: main
                      path: k8s/apps
                      directory:
                        recurse: true
                    destination:
                      server: https://kubernetes.default.svc
                      namespace: default
                    syncPolicy:
                      automated:
                        prune: true
                        selfHeal: true
                      syncOptions:
                        - SkipDryRunOnMissingResource=true
                  EOF
              restartPolicy: OnFailure
          backoffLimit: 3
