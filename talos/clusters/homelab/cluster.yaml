cluster:
  clusterName: homelab
  controlPlane:
    # cp1's declared LAN address (machines/b0-41-6f-15-3b-8f/patch.yaml,
    # static, selected by MAC) — mesh v3 P2.5 (talos-config-359.9.5):
    # kubernetes is IP-native and stays off the identity mesh; the
    # endpoint is a git declaration, not a lease (invariant 7). Was the
    # nebula address 10.42.218.125 from mesh-v2 phase 2 step 2 until
    # 2026-09-20, and the wg0 address before that.
    endpoint: https://10.0.0.68:6443
  apiServer:
    certSANs:
      # Talos adds every node address and the endpoint host on its own;
      # these are the names admins and kubelets dial, stated so the cert
      # is a declaration and not an enumeration of whatever is up:
      # the LAN address (endpoint), the identity-plane name (talosconfig
      # and `nix run .#kubeconfig` on the irohup tun), and the hostname.
      - 10.0.0.68
      - cp1.mesh.internal
      - cp1
      # cp1's nebula address; kept until Phase 4 deletes nebula so the
      # cert does not churn twice.
      - 10.42.218.125
  proxy:
    # kube-proxy in nftables mode serves NodePorts only on the primary
    # node IP by default. Serving on all addresses predates P2.5 (it
    # was for nebula0); harmless now, revisit at Phase 4.
    extraArgs:
      nodeport-addresses: 0.0.0.0/0
  inlineManifests:
    - name: argocd-namespace
      contents: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: argocd
    - name: argocd-installer
      contents: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: argocd-installer
          namespace: kube-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: argocd-installer
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: argocd-installer
          namespace: kube-system
        ---
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: argocd-installer
          namespace: kube-system
        spec:
          template:
            spec:
              serviceAccountName: argocd-installer
              containers:
              - name: installer
                image: alpine/kubectl:latest
                command:
                - /bin/sh
                - -c
                - |
                  # Pinned: `stable` made every reinstall adopt whatever
                  # upstream shipped that day. Bump deliberately.
                  kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.5/manifests/install.yaml

                  # ArgoCD's own config (oidc.config, policy.csv,
                  # server.insecure) is NOT set here — it lives in
                  # k8s/apps/argocd/config.yaml and is reconciled by ArgoCD
                  # itself, so it follows git HEAD and self-heals. This Job is
                  # bootstrap-irreducible only: install ArgoCD, make it able to
                  # reach the issuer, and hand it the root Application.
                  #
                  # Keeping config here would make it bootstrap-time-only (this
                  # Job runs once per cluster), which is what left the
                  # 2026-07-31 reinstall with no SSO and dex resurrected.

                  # The issuer hostAliases pin is NOT set here — it lives in
                  # k8s/apps/argocd/server-patch.yaml (SSA partial) and is
                  # reconciled by ArgoCD, so it follows git HEAD. The old
                  # bootstrap-time patch pinned cp1's mesh address, which no
                  # pod off cp1 could dial (nebula carries 10.42.0.0/16
                  # sources only) — same failure class as oauth2-proxy's
                  # 2026-07-31 break.

                  # No dex: the bridge is the only IdP (invariant 1 — no hosted
                  # identity, and no idle second issuer to keep patched).
                  kubectl -n argocd delete deployment,service argocd-dex-server --ignore-not-found

                  # cmd-params is consumed as env — pods only see it on restart.
                  kubectl -n argocd rollout restart deployment argocd-server

                  kubectl apply -f - <<'EOF'
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: apps
                    namespace: argocd
                  spec:
                    project: default
                    source:
                      repoURL: https://github.com/marnyg/talos-config.git
                      targetRevision: main
                      path: k8s/apps
                      directory:
                        recurse: true
                    destination:
                      server: https://kubernetes.default.svc
                      namespace: default
                    syncPolicy:
                      automated:
                        prune: true
                        selfHeal: true
                      syncOptions:
                        - SkipDryRunOnMissingResource=true
                  EOF
              restartPolicy: OnFailure
          backoffLimit: 3
