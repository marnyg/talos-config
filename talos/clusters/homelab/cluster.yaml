cluster:
  clusterName: homelab
  controlPlane:
    # Node's own derived mesh address (HKDF from MAC) — loopback-local
    # on the node, independent of DHCP/router state (invariant 7).
    endpoint: https://10.42.218.125:6443
  apiServer:
    certSANs:
      # cp1's nebula identity (HKDF-derived from the MAC; confirmed by
      # the phase-1 reboot check). The wg0 SAN (10.99.0.54) left with
      # phase 2 step 3.
      - 10.42.218.125
      - cp1.mesh.internal
  proxy:
    # kube-proxy in nftables mode serves NodePorts only on the primary
    # node IP by default — which would exclude nebula0. Serve them on
    # all addresses so mesh members reach apps over the overlay.
    extraArgs:
      nodeport-addresses: 0.0.0.0/0
  inlineManifests:
    - name: argocd-namespace
      contents: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: argocd
    - name: argocd-installer
      contents: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: argocd-installer
          namespace: kube-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: argocd-installer
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: argocd-installer
          namespace: kube-system
        ---
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: argocd-installer
          namespace: kube-system
        spec:
          template:
            spec:
              serviceAccountName: argocd-installer
              containers:
              - name: installer
                image: alpine/kubectl:latest
                command:
                - /bin/sh
                - -c
                - |
                  # Pinned: `stable` made every reinstall adopt whatever
                  # upstream shipped that day. Bump deliberately.
                  kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.5/manifests/install.yaml

                  # ArgoCD's own config (oidc.config, policy.csv,
                  # server.insecure) is NOT set here — it lives in
                  # k8s/apps/argocd/config.yaml and is reconciled by ArgoCD
                  # itself, so it follows git HEAD and self-heals. This Job is
                  # bootstrap-irreducible only: install ArgoCD, make it able to
                  # reach the issuer, and hand it the root Application.
                  #
                  # Keeping config here would make it bootstrap-time-only (this
                  # Job runs once per cluster), which is what left the
                  # 2026-07-31 reinstall with no SSO and dex resurrected.

                  # The issuer hostAliases pin is NOT set here — it lives in
                  # k8s/apps/argocd/server-patch.yaml (SSA partial) and is
                  # reconciled by ArgoCD, so it follows git HEAD. The old
                  # bootstrap-time patch pinned cp1's mesh address, which no
                  # pod off cp1 could dial (nebula carries 10.42.0.0/16
                  # sources only) — same failure class as oauth2-proxy's
                  # 2026-07-31 break.

                  # No dex: the bridge is the only IdP (invariant 1 — no hosted
                  # identity, and no idle second issuer to keep patched).
                  kubectl -n argocd delete deployment,service argocd-dex-server --ignore-not-found

                  # cmd-params is consumed as env — pods only see it on restart.
                  kubectl -n argocd rollout restart deployment argocd-server

                  kubectl apply -f - <<'EOF'
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: apps
                    namespace: argocd
                  spec:
                    project: default
                    source:
                      repoURL: https://github.com/marnyg/talos-config.git
                      targetRevision: main
                      path: k8s/apps
                      directory:
                        recurse: true
                    destination:
                      server: https://kubernetes.default.svc
                      namespace: default
                    syncPolicy:
                      automated:
                        prune: true
                        selfHeal: true
                      syncOptions:
                        - SkipDryRunOnMissingResource=true
                  EOF
              restartPolicy: OnFailure
          backoffLimit: 3
