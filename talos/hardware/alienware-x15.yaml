# Alienware x15 R1 laptop (Dell; OUI 98:e7:43, service tag 324S9K3,
# BIOS 1.4.0, SKU 0A8D). i9-11900H, 1TB SK hynix PC711 NVMe.
# All of this was read off the node AFTER first boot — it PXE-booted
# straight into the device-flow wait, so nothing could be inspected
# before the install (see the disk note below).
machine:
  # Fan-noise tuning. The fans themselves are out of reach: they are
  # EC-controlled, and the Talos kernel builds neither dell-smm-hwmon
  # (CONFIG_SENSORS_DELL_SMM unset) nor any platform_profile driver, so
  # there is no /sys pwm interface to drive and no "quiet" ACPI profile
  # to select from Linux. The lever that does exist is heat: intel_pstate
  # is built in (CONFIG_X86_INTEL_PSTATE=y), and pinning no_turbo keeps
  # the i9-11900H at base clocks (2.5GHz; boost is 4.9) instead of
  # spiking to ~90°C under load — the EC then never ramps the fans past
  # their low tier. Applied live by apply-config, no reboot; verify with
  #   talosctl -n 10.42.227.66 read /sys/devices/system/cpu/intel_pstate/no_turbo
  # If the throughput loss ever matters, the softer knob is
  # max_perf_pct (e.g. "70") instead of no_turbo.
  sysfs:
    devices.system.cpu.intel_pstate.no_turbo: "1"
  install:
    # PIN, not the base template's /dev/sda. That default would have
    # been actively destructive here: the machine also presents a
    # 2.1GB USB "Flash Disk" as sda (it boots from it), so a
    # /dev/sda install targets the boot stick, not the system disk.
    #
    # The first install ran on a `diskSelector: size >= 100GB` instead,
    # because the disk was unknowable in advance; the selector is gone
    # now that the device node is a measured fact. Takes effect at
    # install time only — repinning does not move an installed system.
    disk: /dev/nvme0n1
    # The same imager-built installer cp1 runs (hardware/minipc.yaml has
    # the full account): stock Talos + the three official extensions of
    # factory schematic 6a9acc… (nebula, iscsi-tools, util-linux-tools;
    # versions in talos/extensions/installer.env) + our p0agent extension, which puts the node on
    # the identity plane (w1.mesh.internal; talos-config-qb5q). Without
    # nebula the node has no overlay identity and the hub's serve-time
    # cert injection has no extension service to configure; without the
    # other two it cannot run Longhorn (ADR-0011). Keep the tag AND
    # digest in step with minipc.yaml — one fleet image.
    #
    # Predecessor: factory 6a9acc… until 2026-09-19 (upgraded in place,
    # `talosctl upgrade`; EPHEMERAL survives).
    image: ghcr.io/marnyg/talos-installer:v1.12.6-p0agent-0.1.4@sha256:a6ea8ccd3d6f105749e9420cb2e126f23ba17a790ad2cfc2e292554e5faf0abc
