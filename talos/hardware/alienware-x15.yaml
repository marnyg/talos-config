# Alienware x15 R1 laptop (Dell; OUI 98:e7:43, service tag 324S9K3,
# BIOS 1.4.0, SKU 0A8D). i9-11900H, 1TB SK hynix PC711 NVMe.
# All of this was read off the node AFTER first boot — it PXE-booted
# straight into the device-flow wait, so nothing could be inspected
# before the install (see the disk note below).
machine:
  # Fan-noise tuning. The fans themselves are out of reach: they are
  # EC-controlled, and the Talos kernel builds neither dell-smm-hwmon
  # (CONFIG_SENSORS_DELL_SMM unset) nor any platform_profile driver, so
  # there is no /sys pwm interface to drive and no "quiet" ACPI profile
  # to select from Linux. The lever that does exist is heat: intel_pstate
  # is built in (CONFIG_X86_INTEL_PSTATE=y), and pinning no_turbo keeps
  # the i9-11900H at base clocks (2.5GHz; boost is 4.9) instead of
  # spiking to ~90°C under load — the EC then never ramps the fans past
  # their low tier. Applied live by apply-config, no reboot; verify with
  #   talosctl -n 10.0.0.71 read /sys/devices/system/cpu/intel_pstate/no_turbo
  # If the throughput loss ever matters, the softer knob is
  # max_perf_pct (e.g. "70") instead of no_turbo.
  sysfs:
    devices.system.cpu.intel_pstate.no_turbo: "1"
  # GPU: the RTX 3070 Mobile (0000:01:00.0, 10de:24dd GA104M, 8GB)
  # belongs to the HOST — AI pods, epic talos-config-e6rx. It sat
  # unbound until 2026-11-18 (stock Talos ships no nvidia driver). The
  # `-nvidia` installer below carries the open kernel modules and the
  # container toolkit (talos/extensions/installer.env has the why of
  # open + lts); these four lines are what actually binds the card.
  # k8s/apps/nvidia-device-plugin turns it into `nvidia.com/gpu: 1`.
  # The iGPU (Intel UHD, 00:02.0) is undriven and irrelevant.
  kernel:
    modules:
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
  # Sidero's NVIDIA guide sets this alongside the modules; taken as
  # given, not investigated.
  sysctls:
    net.core.bpf_jit_harden: "1"
  install:
    # PIN, not the base template's /dev/sda. That default would have
    # been actively destructive here: the machine also presents a
    # 2.1GB USB "Flash Disk" as sda (it boots from it), so a
    # /dev/sda install targets the boot stick, not the system disk.
    #
    # The first install ran on a `diskSelector: size >= 100GB` instead,
    # because the disk was unknowable in advance; the selector is gone
    # now that the device node is a measured fact. Takes effect at
    # install time only — repinning does not move an installed system.
    disk: /dev/nvme0n1
    # The same imager-built installer cp1 runs (hardware/minipc.yaml has
    # the full account): stock Talos + the official extensions
    # (iscsi-tools, util-linux-tools, kata-containers; versions in
    # talos/extensions/installer.env) + our p0agent extension, which puts
    # the node on the identity plane (w1.mesh.internal; talos-config-qb5q).
    # Without p0agent the node has no mesh identity at all; without the
    # Longhorn pair it cannot run Longhorn (ADR-0011).
    #
    # Since 2026-11-18 this is the `-nvidia` VARIANT of the fleet image
    # (same Talos, same four extensions, plus the two NVIDIA ones —
    # `VARIANT=nvidia build.sh --installer-only`). Only the GPU nodes
    # run it: keep tag AND digest in step with asus-tuf-b550-pro.yaml,
    # and the Talos/p0agent versions in step with minipc.yaml.
    #
    # Predecessors: factory 6a9acc… until 2026-09-19 (upgraded in place,
    # `talosctl upgrade`; EPHEMERAL survives); p0agent-0.1.4 with the
    # nebula extension until 2026-09-21 (Mesh v3 Phase 4, P4.1).
    image: ghcr.io/marnyg/talos-installer:v1.12.6-p0agent-0.1.6-kata-nvidia@sha256:a871cd26d11d08e33b077860e30c79c388ac173f796ffdcf878cf56b4b96d2aa
