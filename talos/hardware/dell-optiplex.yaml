# Dell (OUI 98:e7:43, UUID prefix 4c4c4544 "LLED", service tag 324S9K3).
#
# An RFC6902 patch, not a strategic merge, for one reason: the base
# worker template hardcodes `install.disk: /dev/sda`, and a merge patch
# cannot delete a key. Setting it to "" is silently dropped, leaving
# BOTH `disk` and `diskSelector` in the config — valid, but the winner
# is then an implicit machinery precedence rule. Removing the key makes
# the selector the only answer.
#
# The disk is SELECTED, not pinned, because the machine could not be
# inspected before install: it PXE-booted straight into the device-flow
# wait, so apid never listened and `talosctl get disks` was unavailable.
#
# `>= 100GB` is chosen to fail SAFE rather than to always match. If the
# box turns out to have a smaller boot disk, the install fails visibly
# and wipes nothing; a selector loose enough to always match could pick
# a data disk on a two-disk machine and destroy it.
#
# PIN THIS after first boot — replace the selector with the real device
# node once `talosctl -n <w1 mesh ip> get disks` can answer:
#   - op: add
#     path: /machine/install/disk
#     value: /dev/nvme0n1   (or whatever it reports)
- op: remove
  path: /machine/install/disk
- op: add
  path: /machine/install/diskSelector
  value:
    size: '>= 100GB'
# Factory schematic 011ccc… = stock v1.12.6 + siderolabs/nebula (1.10.3),
# the same image cp1 runs — see hardware/minipc.yaml for how to rebuild
# the id from its inputs. Nodes have no mesh identity without it, and the
# hub injects the config/cert for the extension at serve time.
- op: replace
  path: /machine/install/image
  value: factory.talos.dev/installer/011ccccdcfa98314d2550cb33b56426be8f45553fce129a1e6124de63e9f1598:v1.12.6
