machine:
  install:
    # Imager-built installer (ours, ghcr.io/marnyg) = stock v1.12.6 + the
    # three official extensions of factory schematic 6a9acc… + our own
    # `p0agent` extension. The Image Factory only carries official
    # extensions, so a third-party extension means `imager` + a registry we
    # own; content-addressing gives way to a tag pinned by digest. Rebuild
    # with `talos/extensions/p0agent/build.sh <static-p0agent> <ver>` (lists
    # every extension explicitly — `--base-installer-image` does NOT
    # inherit the factory's). Gate ruling 2026-09-16 (Mesh v3 Phase 0,
    # bead 5cz, ADR-0023): declare what cp1 runs rather than upgrade back to the
    # factory image Phase 1 would immediately replace.
    #
    # - nebula        (1.10.3) runs the mesh overlay on the node. Without
    #                 it the node has no mesh identity at all.
    # - iscsi-tools   iscsid + iscsiadm + the iscsi_tcp module, which
    #                 Longhorn's V1 data engine attaches volumes with.
    # - util-linux-tools  nsenter (required by Longhorn ≥1.5) and fstrim
    #                 (volume trimming). Both per ADR-0011.
    # - p0agent       (0.1.2) `ext-p0agent`, the Mesh v3 node agent
    #                 (config-server/cmd/nodeagent, 359.8.3): NodeId key on
    #                 EPHEMERAL, boot-token enrollment (ADR-0015), renewal
    #                 beat, authorize() on ALPN-gated streams to apid /
    #                 kube-api. Config arrives as an ExtensionServiceConfig
    #                 the hub injects at serve. 0.0.3 was the P0.3 probe.
    #                 0.1.2 carries the seq fix (envelope.MaxSeq: a
    #                 UnixNano-seeded seq is not exact under RFC 8785, so
    #                 renew + bundle in one beat collapsed onto one seq)
    #                 and the name-map merge across a hub deploy.
    #
    # Predecessors: factory 011ccc… (nebula only) until 2026-07-31 when
    # Longhorn landed; factory 6a9acc… (the three official extensions)
    # until 2026-09-15. w1 (alienware-x15.yaml) declares this same image
    # since 2026-09-20 (qb5q) — change both together.
    #
    # Changing this image on a *running* node needs an upgrade, not a
    # reboot: `talosctl upgrade --image <the image below>`.
    # EPHEMERAL survives — upgrades stopped wiping it in Talos 1.5, which
    # is why there is no --preserve flag to pass — so etcd and
    # /var/media come back. A fresh *install* is the destructive path.
    disk: /dev/nvme0n1
    image: ghcr.io/marnyg/talos-installer:v1.12.6-p0agent-0.1.2@sha256:71d45214f7fbb6382138e59c0575d0146af3e72be02348e1d8e9995a73d04c31
