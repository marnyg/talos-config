# Extension service spec (talos.dev/v1.12/advanced/extension-services).
# Registered as `ext-p0agent`; rootfs = /usr/local/lib/containers/p0agent.
name: p0agent
depends:
  - network:
      - addresses
      - connectivity
      - hostname
      - etcfiles
  # ADR-0019 NTP gate: Talos offers it as a first-class start dependency.
  # The agent logs wall clock + uptime at start so the ordering is on record.
  - time: true
container:
  entrypoint: ./p0agent
  args:
    - serve
    - -relay
    - https://marnyg-iroh-relay-spike.fly.dev
    - -key
    - /var/lib/p0agent/key
    - -forward
    - mesh/apid/v1=127.0.0.1:50000
  environment:
    - P0_LOG=info
  mounts:
    # The persistent NodeId. /var is EPHEMERAL: survives reboot and
    # upgrade, not a wipe — exactly the durability a node key needs
    # (invariants.md 1: member keys are minted on the member).
    - source: /var/lib/p0agent
      destination: /var/lib/p0agent
      type: bind
      options: [rbind, rshared, rw]
    # The rootfs is scratch + one static binary; resolving the relay
    # hostname needs the host resolver (127.0.0.53, host netns).
    - source: /etc/resolv.conf
      destination: /etc/resolv.conf
      type: bind
      options: [rbind, ro]
restart: always
logToConsole: false
