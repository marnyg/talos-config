# Mesh name: w1.mesh.internal — the member cert's name, apid's
# certSAN, resolved by the name map on the tun (was also the nebula
# DNS label; the overlay address 10.42.227.66 went with nebula in Mesh
# v3 Phase 4). Also the hostname (patch.yaml pins it), so it is apid's -n
# target and cert SAN as-is — no `hostname:` override needed.
name: w1
# SMBIOS UUID, read from the hub's device-flow log before the first
# approval (service tag 324S9K3). Recorded up front on purpose: it is
# the durable KMS unseal allowlist, so declaring it here means the node
# never depends on the session-scoped "sealed this lifetime" grace
# window — a hub restart before the UUID was written down would
# otherwise leave an encrypted disk that cannot unlock.
uuid: 4c4c4544-0032-3410-8053-b3c04f394b33
diskEncryption: true
# The MAC it was installed under is the laptop's own NIC, not the dongle
# this directory is named after (c4vd renamed it 2026-10-01): the rename
# silently rotated the composed passphrase, which is how installMAC
# came to exist (hub test TestDiskEncryptionSurvivesRename).
# Installed before 2026-10-03, when the break-glass passphrase (LUKS
# slot 1) derived from the directory MAC; the hub keeps deriving from
# this one so the served block matches the header on disk. Transitional:
# delete at the next reinstall (new installs derive from uuid).
installMAC: 98:e7:43:11:97:b8
config: base/worker.yaml
# No sealed-secrets.yaml: that patch provisions the controller's key
# pair via an inlineManifest, which is a control-plane concern.
patches:
  - clusters/homelab/time.yaml
  - clusters/homelab/worker-cluster.yaml
  - clusters/homelab/worker-secrets.yaml
  - hardware/alienware-x15.yaml
