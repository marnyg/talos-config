# Mesh name: cp1.mesh.internal — the member cert's name, apid's
# certSAN, resolved by the name map on the tun (was also the nebula
# DNS label; the overlay address 10.42.218.125 went with nebula in
# Mesh v3 Phase 4). Services need no declaration here: <service>.cp1.mesh.internal
# resolves to this machine automatically, and ingress-nginx routes by
# Host header — exposing a service is purely an Ingress in k8s/apps.
name: cp1
# What the machine calls itself — apid's -n target and cert SAN. cp1's
# patch never pinned machine.network.hostname (w1's does), so it runs
# under Talos's generated stable hostname until the next reinstall
# (talos-config-t7b2); drop this field when that lands.
hostname: talos-wu6-eib
uuid: 37a1f6ed-580e-054c-8392-98bd8090d21a
diskEncryption: true
config: base/controlplane.yaml
patches:
  - clusters/homelab/time.yaml
  - clusters/homelab/cluster.yaml
  - clusters/homelab/secrets.yaml
  - clusters/homelab/sealed-secrets.yaml
  - hardware/minipc.yaml
