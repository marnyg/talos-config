cluster:
  allowSchedulingOnControlPlanes: true
machine:
  kubelet:
    # Longhorn's data path, bind-mounted into the kubelet container with
    # `rshared` propagation — same reasoning as w1's patch: Talos
    # propagates user volumes into kubelet, but not as *shared* mounts,
    # and Longhorn's instance-manager mounts replica devices under this
    # path from another mount namespace.
    #
    # Added in a second apply, after the u-media -> u-longhorn handover
    # created the mount point. The source path must exist or kubelet
    # fails to start, /var/mnt is read-only on Talos until a user volume
    # mounts there, and this is the only control plane.
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
---
# Cap EPHEMERAL so it stops swallowing the whole 512GB disk, leaving
# room for the `media` user volume below. Takes effect only when the
# partition is (re)created — a fresh install, not an upgrade or reboot.
# The pre-cap layout (EPHEMERAL = 510GB, whole disk) persists until the
# next reinstall.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 160GiB
  grow: false
---
# cp1's contribution to Longhorn (mounts at /var/mnt/longhorn).
#
# This was `media` until 2026-07-31, the ADR-0008 preserved volume that a
# reinstall was supposed to spare. ADR-0011 supersedes that: the media
# library became an ordinary Longhorn volume (RWX, one replica, class
# `longhorn-bulk`), so this partition holds nothing unique and becomes
# backing store like w1's. Invariant 2's "no single node's disk is exempt
# from a wipe" is the general form of the same change.
#
# The rename is not free: a UserVolumeConfig is identified by name and
# labels the partition `u-<name>`, so Talos will not relabel `u-media` in
# place. Removing the old document unmounts it but deliberately leaves
# the data; the space only becomes allocatable after an explicit
# `talosctl wipe disk nvme0n1p5`, and only then does this document
# provision. Sequence matters — wiping while the old document is still in
# the config fails with "blockdevice is in use by volume".
#
# Still unencrypted, and now that is a weaker justification than it was:
# ADR-0004 cleared the media volume as public and re-downloadable, which
# stops describing a Longhorn disk the moment app state moves onto it.
# Same open decision as w1's volume, thread `8e46f3a5`.
#
# Sizing: unchanged from the media volume it replaces — 476.9GiB disk
# - ~2.3GiB (EFI/META/STATE) - 160GiB EPHEMERAL leaves ~314GiB.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: system_disk
  minSize: 300GiB
  maxSize: 300GiB
filesystem:
  type: xfs
