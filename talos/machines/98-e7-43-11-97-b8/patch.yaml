# Pin the hostname. Talos' generated names are NOT stable across a
# reinstall — cp1 came back as talos-wu6-eib having been talos-ezw-edv
# — so without this every wipe leaves a permanently NotReady Node
# object behind and breaks anything that referenced the old name.
machine:
  network:
    hostname: w1
    # Declared LAN address (mesh v3 P2.5, talos-config-359.9.5) — the
    # address this MAC already held, declared so the kubelet's path to
    # the control plane is git-derived, not leased (invariant 7). No
    # router DHCP exclusion on purpose (decision talos-config-ebis).
    #
    # deviceSelector by MAC, not `interface:` — this is a USB NIC whose
    # name is not stable (enp0s13f0u1u4 → enp0s13f0u1, notes.md
    # 2026-09-20). The address survives a rename; note flannel does not
    # (it caches the name), so the flannel-pod restart from that note is
    # still needed after a rename.
    #
    # This MAC is NOT this directory's MAC. 98:e7:43:11:97:b8 is the
    # laptop's Dell pass-through address, which only a Dell-branded
    # dock/adapter inherits; the box has no wired PCI NIC (Wi-Fi only,
    # undriven). It provisioned through such a dock, and that MAC still
    # selects this config at (re)install — but the LAN NIC today is a
    # plain Realtek r8152 dongle with its own MAC, so a selector on the
    # directory MAC matched nothing and the node silently fell back to
    # DHCP (found by the mesh v3 soak reboot, 2026-09-20). Swapping the
    # dongle means updating this line; reinstalling means reattaching
    # the dock or renaming the directory (talos-config bead filed).
    interfaces:
      - deviceSelector:
          hardwareAddr: 0c:37:96:5d:26:c4
        dhcp: false
        addresses:
          - 10.0.0.71/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.0.0.1
    nameservers:
      - 10.0.0.1
  kubelet:
    # Longhorn's data path, bind-mounted into the kubelet container with
    # `rshared` propagation (ADR-0011, per Longhorn's Talos guide).
    #
    # Talos already propagates /var/mnt/<name> user volumes into kubelet,
    # but not as a *shared* mount. Longhorn needs bidirectional
    # propagation: its instance-manager mounts each replica's iSCSI
    # device underneath this path from a different mount namespace, and
    # without `rshared` those mounts are invisible to kubelet, so pods
    # attach an empty directory instead of the volume.
    #
    # The source path must already exist as the u-longhorn mount, or
    # kubelet fails to start. Add this only alongside the volume.
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
---
# Cap EPHEMERAL so it stops owning the whole 953.9GiB disk, leaving room
# for the Longhorn volume below. Takes effect only when the partition is
# (re)created — a fresh install, not an upgrade or reboot.
#
# 200GiB is generous for a worker: EPHEMERAL holds container images,
# logs and pod scratch, and nothing durable. Durable data belongs in
# Longhorn, which is the point of the split.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 200GiB
  grow: false
---
# Dedicated storage volume for Longhorn (mounts at /var/mnt/longhorn).
# Sidero recommends a disk separate from the Talos install disk for any
# storage cluster; a partition is the closest thing available on a
# single-disk machine.
#
# Sizing: 953.9GiB disk - ~2.3GiB (EFI/META/STATE) - 200GiB EPHEMERAL
# leaves ~751GiB; 700GiB fits with slack.
#
# Deliberately NOT the `media` name cp1's volume carries. This partition
# is Longhorn's backing store, not a media library — the media library
# becomes a Longhorn volume that happens to have replicas here.
#
# UNENCRYPTED, matching cp1's media volume — but note the posture has
# genuinely shifted and this deserves a decision, not inheritance.
# ADR-0004 justifies leaving cp1's media volume in the clear because it
# holds re-downloadable public content. A Longhorn disk holds app state
# too (sonarr/radarr/jellyfin metadata), which is not re-downloadable
# and not public. Talos user volumes do support `encryption:`, but the
# hub only derives keys for systemDiskEncryption today, so turning it on
# is hub work, not a flag. Tracked, not silently accepted.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: system_disk
  minSize: 700GiB
  maxSize: 700GiB
filesystem:
  type: xfs
