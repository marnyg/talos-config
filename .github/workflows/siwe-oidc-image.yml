# Builds and pushes the SIWE→OIDC bridge image to ghcr on every push
# to main that touches it. The cluster pins :<sha>@digest in
# k8s/apps/siwe-oidc (since 2026-10-06; was :latest + Always) — a new
# image is a deliberate pin bump, and a rollback is the previous line. ghcr here is
# trusted infrastructure like fly (invariant 3), not a root of trust:
# the image contains no secrets and every identity decision it makes
# reduces to wallet signature verification against git-declared
# addresses.
name: siwe-oidc-image
on:
  push:
    branches: [main]
    paths:
      - "config-server/siweoidc/**"
      - "config-server/cmd/siweoidc/**"
      - "config-server/ethsig/**"
      - "config-server/meshtoken/**"
      - "config-server/policy/**"
      - "config-server/go.mod"
      - "config-server/go.sum"
      - "protocol/**"
      - ".dockerignore"
      - "Dockerfile.cmd"
      - ".github/workflows/siwe-oidc-image.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cmd
          build-args: CMD=siweoidc
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/siwe-oidc:latest
            ghcr.io/${{ github.repository_owner }}/siwe-oidc:${{ github.sha }}
