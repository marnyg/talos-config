# Gates the Go code and the Quint design models on every change, so
# neither drifts unnoticed again (verification/quint/check.sh went stale
# for two weeks; there was no Go test workflow at all). Five jobs:
#
#   go            go vet + go test -race for each module (config-server,
#                 protocol, actors), Go version pinned from each module's
#                 go.mod.
#   quint         the fast tier — `check.sh run` (witness tests + random
#                 simulation), on every push/PR.
#   quint-verify  the Apalache bounded-model-checking tier
#                 (`check.sh verify`) — minutes long, so nightly +
#                 manual only.
#   nickel        verification/nickel/check.sh — the durable artifacts
#                 against their snapshot contracts (the list lives in
#                 that script's header), on every push/PR.
#   vendor-hash   rebuilds each module's fixed-output vendor derivation
#                 from scratch so a stale vendorHash fails here, not on
#                 the next `nix build` (flake.nix caveat 3: ../protocol is
#                 a local replace, so the hash moves with protocol/*.go
#                 and a cached FOD hides the drift). Cheap only because
#                 both modules carry an `overrideModAttrs` that keeps
#                 iroh-ffi / iroh-relay out of the vendor FOD's inputs —
#                 without it this job spent ~12min on a cold Rust build
#                 to reach a 7s check (run 35471088669). If you ever see
#                 this job building Rust again, that override regressed.
#
# Both check.sh headers name this workflow; keep them in sync.
name: verify
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly, for the Apalache verify tier
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [config-server, protocol, actors]
    steps:
      # Full checkout, not sparse: config-server's policy/ tests read
      # the shipped ../talos/mesh-policy-v3.yaml and the Nickel contract
      # (see flake.nix config-server-bin).
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race
  quint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
      # quint from the flake's own nixpkgs input (`--inputs-from .` reads
      # flake.lock): the version is pinned by construction (0.30.0 today)
      # and bumps with the flake. The package bundles Apalache + JVM.
      - name: check.sh run
        run: nix shell --inputs-from . nixpkgs#quint -c verification/quint/check.sh run
  quint-verify:
    # Apalache bounded model checking takes minutes; run it nightly and
    # on demand, never inline on push/PR. `quint verify` downloads
    # Apalache itself but needs a JDK 17+ on the runner.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: check.sh verify
        run: nix shell --inputs-from . nixpkgs#quint -c verification/quint/check.sh verify
  nickel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
      # nickel comes from the flake's own nixpkgs input (`--inputs-from .`
      # reads flake.lock), so the version is pinned by construction —
      # currently 1.16.0 — and bumps with the flake, like quint above. No
      # `--impure` / devenv shell needed: only the nixpkgs package is
      # evaluated.
      - name: check.sh
        run: nix shell --inputs-from . nixpkgs#nickel -c verification/nickel/check.sh
  vendor-hash:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attr: [config-server-bin, iroh-transport, actors-bin]
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
      # Two steps, and the order matters: `--rebuild` implies `--check`,
      # which only compares against an *already valid* store path. Run
      # alone on a fresh runner it aborts with "some outputs ... are not
      # valid, so checking is not possible" instead of checking anything.
      # So: realise the FOD first (substitution allowed — that is exactly
      # the stale-cache case we want to catch), then re-run the builder
      # and compare. Mismatch ⇒ "hash mismatch in fixed-output
      # derivation" with the `got:` line to paste into the module's
      # nix/default.nix.
      - name: ${{ matrix.attr }} goModules FOD realise
        run: nix build .#${{ matrix.attr }}.goModules --no-link
      - name: ${{ matrix.attr }} goModules FOD rebuild + compare
        run: nix build .#${{ matrix.attr }}.goModules --rebuild --no-link
