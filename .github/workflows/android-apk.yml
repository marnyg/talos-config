# Builds the Android mesh app (TV + phone) and publishes the
# debug-signed APK two ways: a workflow artifact (per-run history) and
# a rolling `android-latest` release, whose asset URL is stable and
# unauthenticated — the address a TV's Downloader app fetches:
#
#   https://github.com/marnyg/talos-config/releases/download/android-latest/talos-mesh.apk
#
# The repo IS the distribution channel (sideload onto the Shield).
# Debug signing is deliberate for now: a release keystore is a later
# step because changing the signature forces uninstall + re-enroll on
# every device.
#
# SINCE P2.4 (iroh inside the app) THIS WORKFLOW CANNOT RUN ON A STOCK
# RUNNER: the AAR links libiroh_ffi.a cross-built for
# aarch64-linux-android (iroh-go/nix/android.nix — impure, unfree NDK,
# ~1 h cold). Until that build is cached for CI, the app is built on
# the NixOS box (android/shell.nix) and published with
# android/publish.sh to the same rolling release. The push trigger is
# off; dispatch by hand only once IROH_FFI_ANDROID_LIB is obtainable.
name: android-apk
on:
  workflow_dispatch:
permissions:
  contents: write # rolling android-latest release
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: config-server/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The ubuntu runner ships an Android SDK; gomobile needs an NDK.
      - name: install NDK
        run: |
          set -eu
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: build gomobile AAR
        run: |
          : "${IROH_FFI_ANDROID_LIB:?the aarch64-linux-android libiroh_ffi.a is not available on this runner (see header)}"
          ./android/build-aar.sh
      - name: build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: talos-mesh-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Rolling release: one tag, one asset, always the tip of main.
      # Prerelease so a future real release scheme can own "latest".
      - name: publish android-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cp android/app/build/outputs/apk/debug/app-debug.apk talos-mesh.apk
          gh release view android-latest > /dev/null 2>&1 || \
            gh release create android-latest --prerelease \
              --title "Android app (rolling)" \
              --notes "Debug-signed APK, rebuilt on every push that touches the app. Sideload: download this asset on the TV and install."
          gh release upload android-latest talos-mesh.apk --clobber
          gh release edit android-latest --notes "Debug-signed APK, rebuilt on every push that touches the app (last: ${GITHUB_SHA}). Sideload: download this asset on the TV and install."
