{{define "title"}}deck{{end}}
{{define "content"}}
{{if .Card}}{{$t := .Card}}
<p class="muted">{{.Count}} in the deck</p>
<div class="card">
  <h2><a href="/tasks/{{$t.ID}}">{{$t.Title}}</a></h2>
  {{if $t.Body}}<pre>{{$t.Body}}</pre>{{end}}
  <p class="muted">created {{date $t.CreatedAt}}</p>
  <div class="actions">
    <form method="post" action="/tasks/{{$t.ID}}/done">
      <input type="hidden" name="back" value="/">
      <button class="primary">do ✓</button>
    </form>
    <form method="post" action="/tasks/{{$t.ID}}/flag">
      <input type="hidden" name="back" value="/">
      <button>groom ✎</button>
    </form>
    <form method="post" action="/tasks/{{$t.ID}}/snooze">
      <input type="hidden" name="back" value="/">
      <select name="until">
        <option value="tomorrow">tomorrow</option>
        <option value="week">a week</option>
      </select>
      <button>sleep 💤</button>
    </form>
  </div>
</div>
{{else}}
<div class="card">
  <h2>Deck is empty</h2>
  <p class="muted">Nothing ready right now. <a href="/tasks/new">Add a task</a> or check <a href="/tasks">all</a>.</p>
</div>
{{end}}
{{end}}
