# Talos config server on fly.io.
# Secrets: AGE_KEY (dedicated deploy key; see talos/fly-age-key.age).
app = "marnyg-talos-config"
primary_region = "arn"

[build]
dockerfile = "Dockerfile"

[env]
ADMIN_ADDRESSES = "0xf56863bF40A75dC3c632C17fc65AA2EB06a89406"
# Public tunnel endpoint machines dial (dedicated IPv4, UDP).
WG_ENDPOINT = "213.188.219.215:51820"
# Pinned server WG pubkey (public; derived from the admin wallet's
# unseal signature). Unseal fails if a signature derives anything else.
WG_SERVER_PUBKEY = "uNUI+XlWP/1Q+byYzpl1BBP28o6owEATBU3LwV43xl0="
# Disk-unseal KMS endpoint advertised to machines (fly terminates TLS
# on the dedicated gRPC port below, raw h2 to the backend). STATE
# unlock happens before the tunnel exists, so this must be
# WAN-reachable.
KMS_ADVERTISE = "https://marnyg-talos-config.fly.dev:8443"
# Named admin WG peers: keys/IPs derived from the wallet master, no
# registry. Connect with `wgup -name <name>` (enrolls via /wg/enroll —
# wallet signs a device-bound nonce, NOT the master message). Offline
# fallback: wgping -admin <name> -sig <unseal-sig> -wgquick \
#   -endpoint 213.188.219.215:51820
WG_ADMIN_PEERS = "laptop"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

# Disk-unseal KMS: gRPC needs end-to-end HTTP/2, which fly's HTTP
# handler would not guarantee to the backend — so it gets its own TLS
# port with ALPN h2 and byte-passthrough to the same internal port
# (the server's h2c handler speaks prior-knowledge h2).
[[services]]
protocol = "tcp"
internal_port = 8081

  [[services.ports]]
  port = 8443
  handlers = ["tls", "http"]

    # Proxy speaks HTTP/2 cleartext (prior knowledge) to the backend
    # — required for gRPC. Note the exact nesting: everywhere else
    # this key is silently dropped.
    [services.ports.http_options]
    h2_backend = true

# WireGuard control channel. UDP on fly requires a dedicated IPv4 and
# binding fly-global-services; machines dial out, so the app can no
# longer scale to zero. No key secret at rest: the server starts
# sealed and an admin wallet-signature unseals it at /status.
[[services]]
protocol = "udp"
internal_port = 51820

  [[services.ports]]
  port = 51820

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
