# Talos config server on fly.io.
# Secrets: AGE_KEY (dedicated deploy key; see talos/fly-age-key.age).
#
# No [build]: the image is built by nix (fly/image.nix — config-server is
# cgo against libiroh_ffi since talos-config-e8d, which fly's remote
# builder cannot link) and deployed by reference:
#   fly/deploy.sh            build on a linux builder, push, fly deploy --image
# A bare `fly deploy` has nothing to build and fails, on purpose.
app = "marnyg-talos-config"
primary_region = "arn"

[env]
ADMIN_ADDRESSES = "0xf56863bF40A75dC3c632C17fc65AA2EB06a89406"
# Disk-unseal KMS endpoint advertised to machines (fly terminates TLS
# on the dedicated gRPC port below, raw h2 to the backend). STATE
# unlock happens before the mesh exists, so this must be WAN-reachable
# (invariant 4).
KMS_ADVERTISE = "https://marnyg-talos-config.fly.dev:8443"
# Public relay URL the hub's iroh endpoint is advertised at (see the
# [http_service] note below). The hub homes on its relay child over
# loopback; members dial this. Setting it is what makes the process a
# hub (sealed until an admin wallet signs at /status).
IROH_RELAY_URL = "https://marnyg-talos-config.fly.dev"
# Mesh devices are no longer declared here (ADR-0012): enrollment is
# wallet-signed, the device generates its keypair locally, and the
# approver at /status decides the final name and group per enrollment.
# The device set is not enumerable from git — devices resolve while
# their tunnel is live.

# 443 also carries the iroh home relay (Mesh v3, ADR-0022): the relay
# protocol is a WebSocket upgrade on /relay (+ /ping, /generate_204
# probes), which the fly proxy forwards to config-server's :8080, which
# proxies to the iroh-relay child on loopback. No QUIC address
# discovery (would need a relay-owned cert on UDP 7842). Members dial
# https://marnyg-talos-config.fly.dev as their RelayMode::Custom URL —
# and the hub's own iroh endpoint (hubkey = EndpointId, ADR-0024, e8d)
# is homed on that same relay and advertised at this URL, so a member
# reaches the Issuer's inbox wherever it is: `iroh:relay=<this>`.
[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

# Disk-unseal KMS: gRPC needs end-to-end HTTP/2, which fly's HTTP
# handler would not guarantee to the backend — so it gets its own TLS
# port with ALPN h2 and byte-passthrough to the same internal port
# (the server's h2c handler speaks prior-knowledge h2). A non-443 port
# needs the app's DEDICATED IPv4 (213.188.219.215, $2/mo; shared v4s
# carry 80/443 only) — that address outlived the nebula udp/4242
# service it was first allocated for (Mesh v3 Phase 4).
[[services]]
protocol = "tcp"
internal_port = 8081

  [[services.ports]]
  port = 8443
  handlers = ["tls", "http"]

    # Proxy speaks HTTP/2 cleartext (prior knowledge) to the backend
    # — required for gRPC. Note the exact nesting: everywhere else
    # this key is silently dropped.
    [services.ports.http_options]
    h2_backend = true

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
