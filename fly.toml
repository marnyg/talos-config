# Talos config server on fly.io.
# Secrets: AGE_KEY (dedicated deploy key; see talos/fly-age-key.age).
app = "marnyg-talos-config"
primary_region = "arn"

[build]
dockerfile = "Dockerfile"

[env]
ADMIN_ADDRESSES = "0xf56863bF40A75dC3c632C17fc65AA2EB06a89406"
# Disk-unseal KMS endpoint advertised to machines (fly terminates TLS
# on the dedicated gRPC port below, raw h2 to the backend). STATE
# unlock happens before the mesh exists, so this must be WAN-reachable
# (invariant 4).
KMS_ADVERTISE = "https://marnyg-talos-config.fly.dev:8443"
# Nebula mesh — the single overlay (wg0 deleted in phase 2). Public
# endpoint every mesh member dials to find the lighthouse (dedicated
# IPv4, UDP). Members are injected/enrolled with this value, so
# changing it re-issues configs, not certs.
MESH_ENDPOINT = "213.188.219.215:4242"
# Pinned mesh CA fingerprint (public; derived from the admin wallet's
# unseal signature — `recover -ca-fingerprint -sig <unseal-sig>`).
# Unseal fails if a signature derives anything else.
MESH_CA_PIN = "b881d6ffb00822272d6937fd2eb033f6253edc0c1716104bf467cd1be6177527"
# Named mesh devices: identities derived from the same master as wg0's,
# no registry. The list decides two things — which names may enroll at
# /mesh/enroll, and which resolve in mesh DNS.
#
# MESH_DEVICES are owner devices (admins group): unrestricted access to
# nodes, matching what wg0 already grants them.
MESH_DEVICES = "laptop"
# MESH_MEDIA_DEVICES are shared-space appliances (media group): Jellyfin's
# NodePort and nothing else. A device in both lists is a startup error,
# because the group is signed into its certificate.
MESH_MEDIA_DEVICES = "androidtv,phone"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

# Disk-unseal KMS: gRPC needs end-to-end HTTP/2, which fly's HTTP
# handler would not guarantee to the backend — so it gets its own TLS
# port with ALPN h2 and byte-passthrough to the same internal port
# (the server's h2c handler speaks prior-knowledge h2).
[[services]]
protocol = "tcp"
internal_port = 8081

  [[services.ports]]
  port = 8443
  handlers = ["tls", "http"]

    # Proxy speaks HTTP/2 cleartext (prior knowledge) to the backend
    # — required for gRPC. Note the exact nesting: everywhere else
    # this key is silently dropped.
    [services.ports.http_options]
    h2_backend = true

# Nebula mesh: lighthouse + relay for nodes and owner devices. UDP on
# fly requires a dedicated IPv4 and binding fly-global-services (nebula
# resolves listen.host itself, so no bind shim); members dial out, so
# the app cannot scale to zero. No key secret at rest: the server
# starts sealed and an admin wallet-signature unseals it at /status.
[[services]]
protocol = "udp"
internal_port = 4242

  [[services.ports]]
  port = 4242

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
