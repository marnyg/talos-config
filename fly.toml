# Talos config server on fly.io.
# Secrets: AGE_KEY (dedicated deploy key; see talos/fly-age-key.age).
app = "marnyg-talos-config"
primary_region = "arn"

[build]
dockerfile = "Dockerfile"

[env]
ADMIN_ADDRESSES = "0xf56863bF40A75dC3c632C17fc65AA2EB06a89406"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
