# Talos config server on fly.io.
# Secrets: AGE_KEY (dedicated deploy key; see talos/fly-age-key.age).
app = "marnyg-talos-config"
primary_region = "arn"

[build]
dockerfile = "Dockerfile"

[env]
ADMIN_ADDRESSES = "0xf56863bF40A75dC3c632C17fc65AA2EB06a89406"
# Public tunnel endpoint machines dial (dedicated IPv4, UDP).
WG_ENDPOINT = "213.188.219.215:51820"
# Pinned server WG pubkey (public; derived from the admin wallet's
# unseal signature). Unseal fails if a signature derives anything else.
WG_SERVER_PUBKEY = "uNUI+XlWP/1Q+byYzpl1BBP28o6owEATBU3LwV43xl0="
# Disk-unseal KMS endpoint advertised to machines (fly terminates TLS,
# gRPC rides h2 → h2c to the backend). STATE unlock happens before the
# tunnel exists, so this must be WAN-reachable.
KMS_ADVERTISE = "https://marnyg-talos-config.fly.dev:443"

[http_service]
internal_port = 8080
force_https = true
# gRPC (KMS) needs HTTP/2 to the backend.
h2_backend = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

# WireGuard control channel. UDP on fly requires a dedicated IPv4 and
# binding fly-global-services; machines dial out, so the app can no
# longer scale to zero. No key secret at rest: the server starts
# sealed and an admin wallet-signature unseals it at /verify.
[[services]]
protocol = "udp"
internal_port = 51820

  [[services.ports]]
  port = 51820

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
