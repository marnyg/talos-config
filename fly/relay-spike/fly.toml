# Mesh v3 Phase 0, check P0.1 (bead talos-config-359.1.1): can an iroh
# relay be self-hosted on fly? SCRATCH app — not the hub. Upstream image,
# no build step; config injected via [[files]].
#
# Plain-HTTP relay behind fly's TLS terminator: the relay protocol is a
# WebSocket upgrade on /relay (+ /ping, /generate_204 probes), which the
# fly proxy forwards. QUIC address discovery (UDP 7842) is OFF: it needs
# the relay to own a TLS cert, and it only serves remote hole-punching,
# which ADR-0006 does not want anyway. LAN-direct uses DISCO-exchanged
# local candidates over the relay and needs no QAD.
#
#   fly apps create marnyg-iroh-relay-spike
#   fly deploy -c fly/relay-spike/fly.toml
#   curl -sI https://marnyg-iroh-relay-spike.fly.dev/generate_204   # 204
app = "marnyg-iroh-relay-spike"
primary_region = "arn"

[build]
image = "n0computer/iroh-relay:v1.1.0"

[experimental]
cmd = ["--config-path", "/config/relay.toml"]

[[files]]
guest_path = "/config/relay.toml"
raw_value = """
enable_relay = true
http_bind_addr = "[::]:3340"
enable_quic_addr_discovery = false
enable_metrics = false
access = "everyone"
"""

[http_service]
internal_port = 3340
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
